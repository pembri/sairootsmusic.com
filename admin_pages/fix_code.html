<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAI Roots | Alien Character Cleaner PRO</title>
    <script src="./tailwindcss.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rasta: { green: '#2D8659', yellow: '#FBBF24', red: '#DC2626' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #080808; color: #e5e7eb; font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Anton', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-4xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="font-display text-4xl text-white tracking-wider uppercase">Alien <span class="text-rasta-red">Cleaner PRO</span></h1>
                <p class="text-xs text-gray-500 tracking-[0.2em]">MEMBASMI MOJIBAKE + BACKUP SYSTEM</p>
            </div>
            <div class="text-right">
                <span id="backup-status" class="text-[10px] bg-white/5 px-2 py-1 rounded border border-white/10 text-gray-400 italic">No Backup Found</span>
            </div>
        </div>

        <div class="glass p-6 rounded-2xl mb-6">
            <div class="mb-4">
                <label class="block text-[10px] font-bold text-rasta-green uppercase mb-2 tracking-widest">GitHub Access Token</label>
                <input type="password" id="gh-token" placeholder="Paste ghp_token di sini..." 
                       class="w-full bg-black/40 border border-white/10 rounded-xl py-3 px-4 focus:outline-none focus:border-rasta-red transition-all text-sm">
            </div>
            <div class="flex gap-3">
                <button onclick="scanRepo()" class="flex-1 bg-white text-black font-bold py-3 rounded-xl hover:bg-rasta-red hover:text-white transition-all flex items-center justify-center gap-2 text-sm">
                    <i class="fas fa-search"></i> SCAN FILE
                </button>
                <button onclick="restoreBackup()" id="btn-restore" class="hidden flex-1 border border-rasta-yellow text-rasta-yellow font-bold py-3 rounded-xl hover:bg-rasta-yellow hover:text-black transition-all flex items-center justify-center gap-2 text-sm">
                    <i class="fas fa-history"></i> RESTORE BACKUP
                </button>
            </div>
        </div>

        <div id="console-box" class="hidden glass rounded-2xl overflow-hidden border-t-2 border-rasta-red">
            <div class="bg-white/5 px-4 py-2 flex items-center justify-between border-b border-white/5">
                <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Process Console</span>
                <div class="flex gap-1.5">
                    <div class="w-2 h-2 rounded-full bg-rasta-red"></div>
                    <div class="w-2 h-2 rounded-full bg-rasta-yellow"></div>
                    <div class="w-2 h-2 rounded-full bg-rasta-green"></div>
                </div>
            </div>
            <div id="log" class="h-80 overflow-y-auto p-4 font-mono text-[11px] space-y-1 custom-scroll bg-black/20">
                <p class="text-gray-500 italic">Menunggu perintah scan...</p>
            </div>
            <div id="action-area" class="p-4 bg-white/5 border-t border-white/5 hidden">
                <button onclick="executeClean()" class="w-full bg-rasta-red text-white font-black py-4 rounded-xl hover:scale-[1.01] active:scale-95 transition-all uppercase tracking-tighter text-lg">
                    MULAI BASMI ALIEN SEKARANG
                </button>
            </div>
        </div>
    </div>

    <script>
        let fileList = [];
        const REPO = "pembri/sairootsmusic.com";

        window.onload = () => { checkBackup(); };

        function checkBackup() {
            if (localStorage.getItem('alien_backup')) {
                document.getElementById('backup-status').innerHTML = "🟢 Backup Ready (Aman)";
                document.getElementById('backup-status').classList.add('text-rasta-green');
                document.getElementById('btn-restore').classList.remove('hidden');
            }
        }

        function addLog(msg, type = 'info') {
            const log = document.getElementById('log');
            const colors = { info: 'text-gray-400', success: 'text-rasta-green', warn: 'text-rasta-yellow', error: 'text-rasta-red' };
            log.innerHTML += `<div class="${colors[type]}"><span class="opacity-30">[${new Date().toLocaleTimeString()}]</span> ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        // Engine Encode/Decode Aman (UTF-8)
        function decodeUTF8Base64(base64) {
            const binString = atob(base64);
            const bytes = new Uint8Array(binString.length);
            for (let i = 0; i < binString.length; i++) bytes[i] = binString.charCodeAt(i);
            return new TextDecoder('utf-8').decode(bytes);
        }

        function encodeUTF8Base64(str) {
            const bytes = new TextEncoder().encode(str);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary);
        }

        // KAMUS PEMBERSIH ALIEN
        function cleanAlienCharacters(text) {
            return text
                .replace(/Ã‚Â©/g, '©')        
                .replace(/Ã¢Â€Â¦/g, '...')       
                .replace(/Ã¢Â€Â™/g, "'")         
                .replace(/Ã¢Â€Âœ/g, '"')         
                .replace(/Ã¢Â€Â/g, '"')         
                .replace(/Ã¢Â€Â“|Ã¢Â€Â”/g, '-')   
                .replace(/Ã/g, '')
                .replace(/Â/g, '')
                .replace(/¦/g, '')
                .replace(//g, '')
                .replace(/¢/g, '')
                .replace(/\uFFFD/g, ''); // Simbol diamond tanda tanya hitam
        }

        async function scanRepo() {
            const token = document.getElementById('gh-token').value;
            if (!token) return alert("Isi tokennya dulu cok!");

            document.getElementById('console-box').classList.remove('hidden');
            addLog("Mencari file target...", "warn");

            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/git/trees/main?recursive=1`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const data = await res.json();
                
                fileList = data.tree.filter(item => {
                    // FILTER FOLDER HARAM
                    return item.path.endsWith('.html') && 
                           !item.path.startsWith('admin_pages/') && 
                           !item.path.startsWith('cover/') &&
                           !item.path.includes('pembersih_alien.html') &&
                           !item.path.includes('rapihkan_kode.html');
                });

                addLog(`Scan Selesai. ${fileList.length} file HTML siap dicek. Folder haram aman.`, "success");
                document.getElementById('action-area').classList.remove('hidden');
            } catch (err) {
                addLog("Error Koneksi: " + err.message, "error");
            }
        }

        async function executeClean() {
            const token = document.getElementById('gh-token').value;
            let backupData = JSON.parse(localStorage.getItem('alien_backup') || '{}');
            let filesFixed = 0;

            addLog("Mulai proses pembersihan alien...", "warn");

            for (let file of fileList) {
                try {
                    const fileRes = await fetch(file.url, { headers: { 'Authorization': `token ${token}` } });
                    const fileData = await fileRes.json();
                    
                    const originalContent = decodeUTF8Base64(fileData.content);
                    const cleanedContent = cleanAlienCharacters(originalContent);

                    // CUMA DI-PUSH & BACKUP KALAU BENERAN ADA ALIENNYA
                    if (originalContent !== cleanedContent) {
                        addLog(`⚠️ Alien terdeteksi di: ${file.path} -> Membersihkan...`, "warn");
                        
                        // Save Backup dulu sebelum eksekusi
                        backupData[file.path] = { sha: fileData.sha, content: originalContent };
                        localStorage.setItem('alien_backup', JSON.stringify(backupData));

                        await fetch(`https://api.github.com/repos/${REPO}/contents/${file.path}`, {
                            method: 'PUT',
                            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: `🧹 SAI Roots Toolkit: Cleaned Mojibake Characters`,
                                content: encodeUTF8Base64(cleanedContent),
                                sha: fileData.sha
                            })
                        });
                        addLog(`✅ Bersih: ${file.path}`, "success");
                        filesFixed++;
                    }
                } catch (e) {
                    addLog(`Gagal proses ${file.path} | ${e.message}`, "error");
                }
            }
            
            addLog(`PROSES SELESAI! ${filesFixed} file berhasil dibersihkan.`, "success");
            checkBackup();
        }

        async function restoreBackup() {
            const token = document.getElementById('gh-token').value;
            const backupData = JSON.parse(localStorage.getItem('alien_backup'));
            
            if (!token) return alert("Masukkan token untuk restore!");
            if (!confirm("Yakin mau balikin file yang kena bersih tadi ke aslinya?")) return;

            addLog("Memulai Restore...", "warn");

            for (let path in backupData) {
                try {
                    const currentFile = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                        headers: { 'Authorization': `token ${token}` }
                    });
                    const currentData = await currentFile.json();

                    await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: `⏪ Restore: Reverted ${path} to pre-clean state`,
                            content: encodeUTF8Base64(backupData[path].content),
                            sha: currentData.sha
                        })
                    });
                    addLog(`Restored: ${path}`, "info");
                } catch (e) {
                    addLog(`Gagal Restore ${path}`, "error");
                }
            }
            
            addLog("RESTORE TOTAL SELESAI!", "success");
            localStorage.removeItem('alien_backup');
            location.reload();
        }
    </script>
</body>
</html>

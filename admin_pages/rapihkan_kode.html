<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMERGENCY RESET | SAI Roots</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #eee; font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Anton', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-6">
    <div class="max-w-2xl mx-auto">
        <h1 class="font-display text-4xl text-white mb-2 uppercase">Emergency <span class="text-red-600">Reset</span></h1>
        <p class="text-xs text-gray-500 mb-8 tracking-widest">KEMBALIKAN SEMUA FILE DALAM SATU KLIK</p>

        <div class="glass p-6 rounded-3xl mb-6">
            <input type="password" id="token" placeholder="GitHub Token" class="w-full bg-black border border-white/10 p-4 rounded-xl mb-4 outline-none focus:border-red-600">
            <button onclick="loadCommits()" class="w-full bg-white text-black font-bold py-3 rounded-xl uppercase text-xs">Cari Titik Aman</button>
        </div>

        <div id="list-container" class="hidden">
            <p class="text-[10px] font-bold text-gray-500 mb-4 uppercase tracking-widest">Pilih Commit Sebelum Kejadian (Titik Aman):</p>
            <div id="commit-list" class="space-y-2 max-h-96 overflow-y-auto pr-2"></div>
        </div>
    </div>

    <script>
        const REPO = "pembri/sairootsmusic.com";
        
        async function loadCommits() {
            const t = document.getElementById('token').value;
            if(!t) return alert("Token kosong!");
            
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/commits?per_page=100`, {
                    headers: { 'Authorization': `token ${t}` }
                });
                const data = await res.json();
                
                const list = document.getElementById('commit-list');
                list.innerHTML = '';
                
                data.forEach(c => {
                    const isBad = c.commit.message.includes("Clean: Fixed text");
                    const card = document.createElement('div');
                    card.className = `p-4 rounded-xl border ${isBad ? 'border-white/5 opacity-40' : 'border-green-600/50 bg-green-600/5 cursor-pointer hover:bg-green-600/20'} transition-all`;
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-xs font-bold ${isBad ? 'text-gray-600' : 'text-white'}">${c.commit.message}</p>
                                <p class="text-[9px] text-gray-500">${new Date(c.commit.author.date).toLocaleString()}</p>
                            </div>
                            <span class="text-[10px] font-mono bg-white/5 px-2 py-1 rounded text-gray-400">${c.sha.substring(0,7)}</span>
                        </div>
                        ${!isBad ? `<button onclick="resetTo('${c.sha}')" class="mt-3 w-full bg-green-600 text-white text-[10px] font-black py-2 rounded-lg uppercase">RESET REPO KE SINI</button>` : ''}
                    `;
                    list.appendChild(card);
                });
                document.getElementById('list-container').classList.remove('hidden');
            } catch(e) { alert("Gagal ambil data: " + e.message); }
        }

        async function resetTo(sha) {
            const t = document.getElementById('token').value;
            if(!confirm("YAKIN? Ini bakal ngehapus semua perubahan setelah titik ini dan balikin kode lo ke normal.")) return;

            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/git/refs/heads/main`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `token ${t}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sha: sha, force: true })
                });

                if(res.ok) {
                    alert("BERHASIL! Repo lo udah balik normal. Cek GitHub sekarang.");
                    location.reload();
                } else {
                    alert("Gagal reset. Cek koneksi atau token.");
                }
            } catch(e) { alert("Error: " + e.message); }
        }
    </script>
</body>
</html>

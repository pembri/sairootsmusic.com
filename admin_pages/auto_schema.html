<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Schema - SAI Roots</title>
    
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        
        // 1. FITUR TARIK / RESET SCHEMA (KILL SWITCH)
        window.hapusSchema = function() {
            localStorage.setItem('sairoots_schema_mati', 'true');
            document.querySelectorAll('script[id="sairoots-smart-schema"]').forEach(el => el.remove());
            console.error("🚨 [KILL SWITCH] Schema DIMATIKAN permanen di browser ini.");
            document.getElementById('status-teks').innerHTML = "❌ SCHEMA DIMATIKAN!";
            document.getElementById('status-teks').style.color = "red";
        };

        window.aktifkanSchema = function() {
            localStorage.removeItem('sairoots_schema_mati');
            console.log("✅ [SCHEMA HIDUP] Schema diaktifkan kembali. Mereload...");
            location.reload();
        };

        if (localStorage.getItem('sairoots_schema_mati') === 'true') {
            console.warn("⚠️ Schema sedang diblokir oleh Kill Switch.");
            return; // Berhenti mengeksekusi
        }

        // 2. DETEKSI URL AKURAT (Membaca spasi %20 dengan decodeURIComponent)
        const rawPath = window.location.pathname.toLowerCase();
        const currentPath = decodeURIComponent(rawPath); 
        const pageUrl = window.location.href;

        // 3. PENGECUALIAN MUTLAK: FOLDER ADMIN
        if (currentPath.includes('/admin_pages/')) {
            console.log("🛡️ URL mengandung /admin_pages/. Proses Injeksi Schema Dibatalkan.");
            return;
        }

        // 4. DATA UNIVERSAL (Membawa struktur utuh tanpa mengurangi link)
        const baseGraph = [
            {
                "@type": "WebSite",
                "@id": "https://sairootsmusic.com/#website",
                "url": "https://sairootsmusic.com/",
                "name": "SAI Roots Music",
                "alternateName": ["SAI Roots", "Sai Roots"],
                "description": "Official website of SAI Roots - Indonesian independent Reggae, Rap & Ska music project.",
                "publisher": { "@id": "https://sairootsmusic.com/#organization" }
            },
            {
                "@type": "MusicGroup",
                "@id": "https://sairootsmusic.com/#organization",
                "name": "SAI Roots",
                "description": "SAI Roots adalah proyek musik independen beraliran Reggae, Rap, dan Ska asal Indonesia, diciptakan dan dikelola secara eksklusif oleh Ahmad Supembri.",
                "url": "https://sairootsmusic.com/",
                "image": ["https://upload.wikimedia.org/wikipedia/commons/0/03/SAI_Roots.jpg"],
                "genre": ["Reggae", "Roots Reggae", "Rap", "Ska"],
                "founder": { "@id": "https://sairootsmusic.com/#founder" },
                "sameAs": [
                    "https://www.wikidata.org/wiki/Q139783618",
                    "https://musicbrainz.org/artist/acd09c55-df9b-4628-9605-446b3cf6554a",
                    "https://www.youtube.com/@sairoots",
                    "https://open.spotify.com/artist/0xOPCtZvhXVd9RTbU1aYTr",
                    "https://music.apple.com/id/artist/1892187423",
                    "https://m.soundcloud.com/sairoots",
                    "https://www.deezer.com/artist/384508281",
                    "https://music.amazon.com/artists/B0GTFWNC32/sai-roots",
                    "https://youtube.com/channel/UCnjRvftn7QD2kDqLHszImsA"
                ]
            },
            {
                "@type": "Person",
                "@id": "https://sairootsmusic.com/#founder",
                "name": "Ahmad Supembri",
                "image": "https://upload.wikimedia.org/wikipedia/commons/2/23/Ahmad_Supembri.jpg",
                "url": "https://sairootsmusic.com/",
                "occupation": ["Musician", "Composer", "Lyricist", "Record Producer"],
                "sameAs": [
                    "https://www.wikidata.org/wiki/Q139784101",
                    "https://instagram.com/ahmadsupembri",
                    "https://facebook.com/ahmadsupembri",
                    "https://tiktok.com/@ahmadsupembri"
                ]
            }
        ];

        // 5. IDENTIFIKASI HALAMAN (Sangat Spesifik Berdasarkan Request)
        let pageSpecificSchema = null;
        let identifiedAs = "Tidak Diketahui";

        if (currentPath === '/' || (currentPath.endsWith('index.html') && !currentPath.includes('/lyric/'))) {
            identifiedAs = "Beranda (index.html)";
            pageSpecificSchema = {
                "@type": "WebPage",
                "@id": pageUrl + "#webpage",
                "url": pageUrl,
                "isPartOf": { "@id": "https://sairootsmusic.com/#website" }
            };
        } 
        else if (currentPath.includes('about.html')) {
            identifiedAs = "Halaman About (about.html)";
            pageSpecificSchema = {
                "@type": "AboutPage",
                "@id": pageUrl + "#webpage",
                "url": pageUrl
            };
        } 
        else if (currentPath.includes('contact.html')) {
            identifiedAs = "Halaman Kontak (contact.html)";
            pageSpecificSchema = {
                "@type": "ContactPage",
                "@id": pageUrl + "#webpage",
                "url": pageUrl
            };
        } 
        else if (currentPath.includes('credits.html')) {
            identifiedAs = "Halaman Credits (credits.html)";
            pageSpecificSchema = {
                "@type": "WebPage",
                "@id": pageUrl + "#webpage",
                "url": pageUrl
            };
        }
        else if (currentPath.includes('privacy.html')) {
            identifiedAs = "Halaman Privacy (privacy.html)";
            pageSpecificSchema = {
                "@type": "WebPage",
                "@id": pageUrl + "#webpage",
                "url": pageUrl
            };
        }
        else if (currentPath.includes('profil_ahmad_supembri.html')) {
            identifiedAs = "Halaman Profil Supembri (profil_ahmad_supembri.html)";
            pageSpecificSchema = {
                "@type": "ProfilePage",
                "@id": pageUrl + "#webpage",
                "mainEntity": { "@id": "https://sairootsmusic.com/#founder" },
                "url": pageUrl
            };
        } 
        else if (currentPath.includes('list lagu discography.html')) {
            identifiedAs = "Direktori Diskografi (list lagu discography.html)";
            pageSpecificSchema = {
                "@type": "CollectionPage",
                "@id": pageUrl + "#webpage",
                "url": pageUrl
            };
        }
        else if (currentPath.includes('list lirik lyric.html')) {
            identifiedAs = "Direktori Daftar Lirik (list lirik lyric.html)";
            pageSpecificSchema = {
                "@type": "CollectionPage",
                "@id": pageUrl + "#webpage",
                "url": pageUrl
            };
        }
        else if (currentPath.includes('list coveran') || currentPath.includes('video_cover.html')) {
            identifiedAs = "Direktori Daftar Video Cover (video_cover.html)";
            pageSpecificSchema = {
                "@type": "CollectionPage",
                "@id": pageUrl + "#webpage",
                "url": pageUrl
            };
        }
        else if (currentPath.includes('/lyric/') && currentPath.endsWith('index.html')) {
            identifiedAs = "Halaman Detail Lirik (/lyric/.../index.html)";
            pageSpecificSchema = {
                "@type": "MusicComposition",
                "@id": pageUrl + "#composition",
                "url": pageUrl,
                "composer": { "@id": "https://sairootsmusic.com/#founder" },
                "lyricist": { "@id": "https://sairootsmusic.com/#founder" }
            };
        } 
        else if (currentPath.includes('/track/')) {
            identifiedAs = "Halaman Detail Lagu (/track/...html)";
            pageSpecificSchema = {
                "@type": "MusicRecording",
                "@id": pageUrl + "#recording",
                "url": pageUrl,
                "byArtist": { "@id": "https://sairootsmusic.com/#organization" }
            };
        } 
        else if (currentPath.includes('/cover/')) {
            identifiedAs = "Halaman Detail Video Cover (/cover/...html)";
            pageSpecificSchema = {
                "@type": "VideoObject",
                "@id": pageUrl + "#video",
                "url": pageUrl,
                "creator": { "@id": "https://sairootsmusic.com/#founder" }
            };
        } 
        else if (currentPath.includes('/article/')) {
            identifiedAs = "Halaman Detail Artikel (/article/...html)";
            pageSpecificSchema = {
                "@type": "Article",
                "@id": pageUrl + "#article",
                "url": pageUrl,
                "author": { "@id": "https://sairootsmusic.com/#founder" },
                "publisher": { "@id": "https://sairootsmusic.com/#organization" }
            };
        }
        else {
            identifiedAs = "Halaman Lainnya (Fallback)";
            pageSpecificSchema = {
                "@type": "WebPage",
                "@id": pageUrl + "#webpage",
                "url": pageUrl
            };
        }

        if (pageSpecificSchema) {
            baseGraph.push(pageSpecificSchema);
        }

        // 6. INJEKSI KE DOM
        const finalSchema = { "@context": "https://schema.org", "@graph": baseGraph };
        const scriptLd = document.createElement('script');
        scriptLd.type = 'application/ld+json';
        scriptLd.id = 'sairoots-smart-schema';
        scriptLd.textContent = JSON.stringify(finalSchema, null, 2);
        
        document.head.insertBefore(scriptLd, document.head.firstChild);
        
        // Output visual untuk halaman testing ini
        const stTeks = document.getElementById('status-teks');
        if(stTeks) {
            stTeks.innerHTML = `✅ BERHASIL MENGIDENTIFIKASI:<br><span style="color:#00ff00; font-size:20px;">${identifiedAs}</span>`;
            document.getElementById('code-output').textContent = JSON.stringify(finalSchema, null, 2);
        }
        
    });
    </script>
</head>

<body style="background-color: #111; color: #eee; font-family: sans-serif; padding: 20px;">

    <div style="max-width: 800px; margin: 0 auto; background: #222; padding: 30px; border-radius: 8px; border: 1px solid #444;">
        <h2 style="color: #4CAF50;">Tester Identifikasi HTML</h2>
        
        <h3 id="status-teks" style="color: #ffeb3b; border-bottom: 1px solid #444; padding-bottom: 15px;">⏳ Menganalisa halaman ini...</h3>

        <div style="background: #333; padding: 15px; border-radius: 5px; margin: 20px 0;">
            <h4 style="margin: 0 0 10px 0; color: #ff9800;">Panel Reset Darurat</h4>
            <button onclick="hapusSchema()" style="background: #d32f2f; color: white; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold; border-radius: 4px;">Tarik Schema</button>
            <button onclick="aktifkanSchema()" style="background: #388e3c; color: white; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold; border-radius: 4px; margin-left: 10px;">Kembalikan Schema</button>
        </div>

        <h4>Schema Output di Head Anda:</h4>
        <pre id="code-output" style="background: #000; padding: 15px; border-radius: 5px; overflow-x: auto; color: #0f0; font-size: 13px;"></pre>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="canonical" href="https://sairootsmusic.com/admin_pages/auto_canonical">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAI Roots - Schema Dashboard</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { border-bottom: 3px solid #ffcc00; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; color: #4caf50; }
        .header h1 span { color: #f44336; }
        .panel { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        input[type="password"] { width: 100%; padding: 10px; margin-top: 10px; background: #2c2c2c; border: 1px solid #555; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-right: 10px; margin-top: 10px; transition: opacity 0.2s; }
        button:hover { opacity: 0.8; }
        .btn-scan { background-color: #ffcc00; color: #000; }
        .btn-push { background-color: #4caf50; color: #fff; display: none; }
        .btn-reset { background-color: #f44336; color: #fff; }
        #console { background: #000; color: #0f0; padding: 15px; border-radius: 5px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
        .info { font-size: 12px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SAI <span>Roots</span> Schema Manger</h1>
        <small>v3.0 - REGEX Powered (ANTI-MELESET)</small>
    </div>

    <div class="panel" id="login-panel">
        <label><b>GitHub Personal Access Token (PAT)</b></label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        <div class="info">Dibutuhkan akses 'repo' untuk membaca dan memodifikasi pembri/sairootsmusic.com</div>
    </div>

    <div class="panel">
        <button class="btn-scan" onclick="scanRepo()">🔍 SCAN SEMUA HTML</button>
        <button class="btn-push" id="btn-push" onclick="pushSchemaMasal()">🚀 PUSH SCHEMA MASAL</button>
        <button class="btn-reset" onclick="resetSchema()">🗑️ RESET / TARIK SCHEMA</button>
    </div>

    <div class="panel">
        <h3>Terminal Log:</h3>
        <div id="console">Menunggu instruksi...</div>
    </div>
</div>

<script>
    const REPO = 'pembri/sairootsmusic.com';
    const BRANCH = 'main'; 
    let htmlFilesList = [];

    function log(msg, color = "#0f0") {
        const c = document.getElementById('console');
        c.innerHTML += `<span style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</span>\n`;
        c.scrollTop = c.scrollHeight;
    }

    // BASE SCHEMA UNIVERSAL (FULL 100% NGGAK ADA YANG DIKURANGI)
    function getUniversalSchema() {
        return [
            {
                "@type": "WebSite",
                "@id": "https://sairootsmusic.com/#website",
                "url": "https://sairootsmusic.com/",
                "name": "SAI Roots Music",
                "alternateName": ["SAI Roots", "Sai Roots"],
                "description": "Official website of SAI Roots - Indonesian independent Reggae, Rap & Ska music project.",
                "publisher": { "@id": "https://sairootsmusic.com/#organization" }
            },
            {
                "@type": "MusicGroup",
                "@id": "https://sairootsmusic.com/#organization",
                "name": "SAI Roots",
                "alternateName": "SAI Roots Music",
                "description": "SAI Roots adalah proyek musik independen beraliran Reggae, Rap, dan Ska asal Indonesia, diciptakan dan dikelola secara eksklusif oleh Ahmad Supembri.",
                "url": "https://sairootsmusic.com/",
                "image": ["https://upload.wikimedia.org/wikipedia/commons/0/03/SAI_Roots.jpg"],
                "genre": ["Reggae", "Roots Reggae", "Rap", "Ska", "Hip Hop"],
                "countryOfOrigin": { "@type": "Country", "name": "Indonesia" },
                "founder": { "@id": "https://sairootsmusic.com/#founder" },
                "member": { "@id": "https://sairootsmusic.com/#founder" },
                "recordLabel": { "@id": "https://sairootsmusic.com/#recordLabel" },
                "sameAs": [
                    "https://www.wikidata.org/wiki/Q139783618",
                    "https://musicbrainz.org/artist/acd09c55-df9b-4628-9605-446b3cf6554a",
                    "https://www.youtube.com/@sairoots",
                    "https://open.spotify.com/artist/0xOPCtZvhXVd9RTbU1aYTr",
                    "https://music.apple.com/id/artist/1892187423",
                    "https://m.soundcloud.com/sairoots",
                    "https://www.deezer.com/artist/384508281",
                    "https://music.amazon.com/artists/B0GTFWNC32/sai-roots",
                    "https://youtube.com/channel/UCnjRvftn7QD2kDqLHszImsA"
                ]
            },
            {
                "@type": "Person",
                "@id": "https://sairootsmusic.com/#founder",
                "name": "Ahmad Supembri",
                "image": "https://upload.wikimedia.org/wikipedia/commons/2/23/Ahmad_Supembri.jpg",
                "description": "Indonesian musician, composer, lyricist, and record producer.",
                "url": "https://sairootsmusic.com/",
                "nationality": { "@type": "Country", "name": "Indonesia" },
                "occupation": ["Musician", "Composer", "Lyricist", "Record Producer"],
                "sameAs": [
                    "https://www.wikidata.org/wiki/Q139784101",
                    "https://instagram.com/ahmadsupembri",
                    "https://facebook.com/ahmadsupembri",
                    "https://tiktok.com/@ahmadsupembri"
                ]
            },
            {
                "@type": "Organization",
                "@id": "https://sairootsmusic.com/#recordLabel",
                "name": "SAI Roots Music",
                "description": "Indonesian independent record label owned by Ahmad Supembri.",
                "url": "https://sairootsmusic.com/",
                "founder": { "@id": "https://sairootsmusic.com/#founder" },
                "sameAs": ["https://www.wikidata.org/wiki/Q139784313"]
            }
        ];
    }

    async function apiRequest(endpoint, method = 'GET', body = null) {
        const token = document.getElementById('gh-token').value.trim();
        if (!token) throw new Error("Token GitHub belum diisi!");
        
        const options = {
            method: method,
            headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        };
        if (body) options.body = JSON.stringify(body);

        const res = await fetch(`https://api.github.com/repos/${REPO}/${endpoint}`, options);
        if (!res.ok) throw new Error(`API Error: ${res.status} ${res.statusText}`);
        return await res.json();
    }

    async function scanRepo() {
        try {
            log("Memulai scan repository...", "#ffcc00");
            htmlFilesList = [];
            const tree = await apiRequest(`git/trees/${BRANCH}?recursive=1`);
            
            tree.tree.forEach(item => {
                if (item.type === 'blob' && item.path.endsWith('.html')) {
                    if (!item.path.includes('admin_pages/')) {
                        htmlFilesList.push(item);
                    }
                }
            });

            log(`Ditemukan ${htmlFilesList.length} file HTML yang valid.`, "#ffcc00");
            
            htmlFilesList.forEach(file => {
                const info = identifyPage(file.path);
                
                // Pewarnaan log biar lu gampang ngecek mana yang lolos, mana yang WebPage
                let colorCode = "#0f0";
                if(info.type === "WebPage") colorCode = "#aaa"; 
                if(info.type === "VideoObject") colorCode = "#e91e63"; // Pink untuk Cover
                if(info.type === "MusicRecording") colorCode = "#00bcd4"; // Biru untuk Track
                if(info.type === "MusicComposition") colorCode = "#ffeb3b"; // Kuning untuk Lirik
                if(info.type === "Article") colorCode = "#ff9800"; // Orange untuk Artikel
                if(info.type === "CollectionPage") colorCode = "#9c27b0"; // Ungu untuk List
                
                log(`- /${file.path} => [ ${info.type} ]`, colorCode);
            });

            document.getElementById('btn-push').style.display = 'inline-block';
            log("Scan selesai. Silakan periksa hasil deteksi di atas.", "#4caf50");

        } catch (error) {
            log(error.message, "#f44336");
        }
    }

    // =========================================================================
    // FUNGSI INI YANG GUE ROMBAK TOTAL PAKAI REGEX BRUTAL
    // =========================================================================
    function identifyPage(path) {
        // Ambil path asli dari GitHub, pastikan huruf kecil
        const lowerPath = decodeURIComponent(path).toLowerCase();
        
        let schemaType = "WebPage";
        let specificData = {};

        // PENGECEKAN REGEX (Mustahil Meleset)
        if (lowerPath === 'index.html' || lowerPath === '') {
            schemaType = "WebPage";
            specificData = { "name": "Beranda - SAI Roots Music" };
        } 
        else if (lowerPath.match(/(^|\/)lyric\//)) {
            schemaType = "MusicComposition";
            specificData = { "composer": { "@id": "https://sairootsmusic.com/#founder" } };
        } 
        else if (lowerPath.match(/(^|\/)track\//)) {
            schemaType = "MusicRecording";
            specificData = { "byArtist": { "@id": "https://sairootsmusic.com/#organization" } };
        } 
        else if (lowerPath.match(/(^|\/)cover\//)) {
            schemaType = "VideoObject";
            specificData = { "creator": { "@id": "https://sairootsmusic.com/#founder" } };
        } 
        else if (lowerPath.match(/(^|\/)article\//)) {
            schemaType = "Article";
            specificData = { "author": { "@id": "https://sairootsmusic.com/#founder" } };
        } 
        else if (lowerPath.includes('about')) {
            schemaType = "AboutPage";
        } 
        else if (lowerPath.includes('contact')) {
            schemaType = "ContactPage";
        } 
        else if (lowerPath.includes('profil')) {
            schemaType = "ProfilePage";
        } 
        else if (lowerPath.includes('list') || lowerPath.includes('discography') || lowerPath.includes('coveran')) {
            schemaType = "CollectionPage";
        }

        // =========================================================================
        // PENGELOLAAN CLEAN URL & NAMA FOLDER PENYIMPANAN
        // =========================================================================
        let cleanUrlPath = lowerPath.replace(/\.html$/, '');
        if (cleanUrlPath.endsWith('/index')) {
            cleanUrlPath = cleanUrlPath.slice(0, -6); // hapus '/index'
        }
        
        let slugForUrl = cleanUrlPath.replace(/^\/+/, ''); // Hapus slash di depan kalau ada
        if (slugForUrl === 'index') slugForUrl = '';
        
        const fullCleanUrl = slugForUrl === '' ? 'https://sairootsmusic.com/' : `https://sairootsmusic.com/${slugForUrl}`;

        // Bikin nama folder aman (hanya huruf, angka, dan strip)
        let folderName = slugForUrl.replace(/[^a-zA-Z0-9-]/g, '-').replace(/^-+|-+$/g, '');
        if (!folderName) folderName = 'beranda';

        return {
            path: path,
            type: schemaType,
            cleanUrl: fullCleanUrl,
            slugFolder: folderName,
            specific: specificData
        };
    }

    function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
    function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

    async function pushSchemaMasal() {
        if (htmlFilesList.length === 0) return log("Lakukan scan terlebih dahulu!", "#f44336");
        log("Mulai melakukan Push Masal (Membuat Schema & Modifikasi HTML)...", "#ffcc00");

        for (const file of htmlFilesList) {
            try {
                const info = identifyPage(file.path);
                
                let specificGraph = {
                    "@type": info.type,
                    "@id": info.cleanUrl + "#" + info.type.toLowerCase(),
                    "url": info.cleanUrl,
                    ...info.specific
                };

                let universalGraph = getUniversalSchema();
                let finalGraph = [specificGraph, ...universalGraph];
                
                let schemaJsonLd = {
                    "@context": "https://schema.org",
                    "@graph": finalGraph
                };

                let schemaJsContent = `// Auto-Generated Schema by SAI Roots Schema Manager\n`;
                schemaJsContent += `(function() {\n`;
                schemaJsContent += `  const schema = ${JSON.stringify(schemaJsonLd, null, 2)};\n`;
                schemaJsContent += `  const script = document.createElement('script');\n`;
                schemaJsContent += `  script.type = 'application/ld+json';\n`;
                schemaJsContent += `  script.id = 'sairoots-auto-schema';\n`;
                schemaJsContent += `  script.textContent = JSON.stringify(schema);\n`;
                schemaJsContent += `  document.head.appendChild(script);\n`;
                schemaJsContent += `})();`;

                const schemaFilePath = `schema/${info.slugFolder}/schema.js`;

                let fileSha = null;
                try {
                    const checkFile = await apiRequest(`contents/${schemaFilePath}`);
                    fileSha = checkFile.sha;
                } catch(e) {} 

                await apiRequest(`contents/${schemaFilePath}`, 'PUT', {
                    message: `Generate schema for ${info.cleanUrl}`,
                    content: utf8_to_b64(schemaJsContent),
                    sha: fileSha
                });
                log(`✔️ Created schema: /${schemaFilePath}`);

                const htmlFileObj = await apiRequest(`contents/${file.path}`);
                let htmlContent = b64_to_utf8(htmlFileObj.content);

                const scriptTag = `\n<script id="sairoots-schema-loader" src="/${schemaFilePath}"><\/script>\n`;
                
                if (!htmlContent.includes(scriptTag.trim())) {
                    htmlContent = htmlContent.replace('</head>', `${scriptTag}</head>`);
                    
                    await apiRequest(`contents/${file.path}`, 'PUT', {
                        message: `Inject schema script to ${file.path}`,
                        content: utf8_to_b64(htmlContent),
                        sha: htmlFileObj.sha
                    });
                    log(`✔️ Injected HTML: /${file.path}`);
                } else {
                    log(`➖ HTML sudah tersuntik sebelumnya: /${file.path}`, "#aaa");
                }

            } catch (err) {
                log(`Gagal memproses ${file.path}: ${err.message}`, "#f44336");
            }
        }
        log("🎉 PUSH MASAL SELESAI!", "#4caf50");
    }

    async function resetSchema() {
        if (!confirm("Yakin ingin menghapus semua injeksi schema dari HTML?")) return;
        if (htmlFilesList.length === 0) return log("Lakukan scan terlebih dahulu agar sistem tahu file HTML mana yang harus dibersihkan!", "#f44336");

        log("Memulai proses RESET Schema...", "#f44336");

        for (const file of htmlFilesList) {
            try {
                const info = identifyPage(file.path);
                const schemaFilePath = `schema/${info.slugFolder}/schema.js`;

                try {
                    const checkFile = await apiRequest(`contents/${schemaFilePath}`);
                    await apiRequest(`contents/${schemaFilePath}`, 'DELETE', {
                        message: `Reset/Delete schema for ${info.cleanUrl}`,
                        sha: checkFile.sha
                    });
                    log(`🗑️ Deleted: /${schemaFilePath}`);
                } catch(e) {} 

                const htmlFileObj = await apiRequest(`contents/${file.path}`);
                let htmlContent = b64_to_utf8(htmlFileObj.content);
                const scriptRegex = /<script id="sairoots-schema-loader"[^>]*><\/script>\n?/g;

                if (scriptRegex.test(htmlContent)) {
                    htmlContent = htmlContent.replace(scriptRegex, '');
                    await apiRequest(`contents/${file.path}`, 'PUT', {
                        message: `Remove schema injection from ${file.path}`,
                        content: utf8_to_b64(htmlContent),
                        sha: htmlFileObj.sha
                    });
                    log(`🧹 Cleaned HTML: /${file.path}`);
                }

            } catch(err) {
                log(`Gagal mereset ${file.path}: ${err.message}`, "#f44336");
            }
        }
        log("✅ RESET SELESAI. Repository telah bersih.", "#4caf50");
    }
</script>

</body>
</html>

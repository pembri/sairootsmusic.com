<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAI Roots - Ultra Restore Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151921;
            --text-color: #d1d5db;
            --accent-red: #ff4d4d;
            --accent-yellow: #ffcb2b;
            --accent-green: #00ff88;
            --border-color: #2d333b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        h1 {
            text-align: center;
            font-size: 1.6rem;
            margin-bottom: 1.5rem;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px solid var(--accent-green);
            display: inline-block;
            padding-bottom: 5px;
        }

        .center-wrapper { text-align: center; }

        /* Login Section */
        #login-section { display: flex; flex-direction: column; gap: 1.5rem; max-width: 400px; margin: 0 auto; }
        
        input {
            background: #000;
            border: 1px solid var(--border-color);
            color: var(--accent-green);
            padding: 15px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        .btn {
            cursor: pointer;
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary { background: var(--accent-green); color: #000; }
        .btn-primary:hover { box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); transform: scale(1.02); }
        .btn-primary:disabled { background: #333; color: #777; cursor: not-allowed; transform: none; }

        /* Dashboard */
        #dashboard { display: none; }
        
        .commit-list {
            background: #000;
            max-height: 350px;
            overflow-y: scroll;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin: 1.5rem 0;
        }

        .commit-item {
            padding: 15px;
            border-bottom: 1px solid #111;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .commit-item:hover { background: #111; }
        .commit-item.selected { border-left: 5px solid var(--accent-yellow); background: #1a1a10; }

        .commit-msg { font-weight: 600; color: #fff; display: block; margin-bottom: 5px; }
        .commit-meta { font-size: 0.75rem; color: #666; font-family: 'JetBrains Mono'; }

        /* Terminal Overlay */
        #terminal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            padding: 30px;
            box-sizing: border-box;
        }

        .terminal-window {
            height: 100%;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: #00ff41; /* Klasik Hacker Green */
            line-height: 1.6;
        }

        .log-error { color: var(--accent-red); font-weight: bold; }
        .log-warn { color: var(--accent-yellow); }
        .log-info { color: #00d9ff; }

        .blink { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="center-wrapper">
        <h1>Restore Center</h1>
    </div>

    <!-- Login -->
    <div id="login-section">
        <p style="text-align: center;">Enter GitHub Token to sync <b>pembri/sairootsmusic.com</b></p>
        <input type="password" id="gh-token" placeholder="PASTE_TOKEN_HERE">
        <button class="btn btn-primary" onclick="initConnect()">Access System</button>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">
        <p>Target: <span style="color:var(--accent-green)">pembri/sairootsmusic.com</span></p>
        <div style="font-size: 0.8rem; color: #888; background: #000; padding: 10px; border-radius: 5px;">
             SECURITY: <b>/admin_pages</b> & <b>/video cover</b> locked and protected.
        </div>
        
        <div id="commit-container" class="commit-list">
            <!-- Commits -->
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span id="selection-status" style="font-size: 0.9rem; color: var(--accent-yellow);">Please select a point...</span>
            <button class="btn btn-primary" id="btn-restore" onclick="runMassRestore()" disabled>GAS RESTORE MASAL</button>
        </div>
    </div>
</div>

<!-- Terminal UI -->
<div id="terminal-overlay">
    <div class="terminal-window" id="term-box">
        <div>[SYSTEM] INITIALIZING TERMINAL... READY.</div>
    </div>
</div>

<script>
    const CONFIG = {
        owner: 'pembri',
        repo: 'sairootsmusic.com',
        protected: ['admin_pages/', 'video cover/']
    };

    let token = '';
    let targetSHA = '';

    const termBox = document.getElementById('term-box');

    function log(msg, style = '') {
        const line = document.createElement('div');
        line.className = style;
        line.innerHTML = `> [${new Date().toLocaleTimeString()}] ${msg}`;
        termBox.appendChild(line);
        termBox.scrollTop = termBox.scrollHeight;
    }

    async function initConnect() {
        token = document.getElementById('gh-token').value;
        if(!token) return alert("Token kosong!");

        try {
            const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/commits?per_page=50`, {
                headers: { 'Authorization': `token ${token}` }
            });
            if(res.ok) {
                const data = await res.json();
                loadCommits(data);
            } else {
                throw new Error("Invalid Token/Repository");
            }
        } catch (e) {
            alert(e.message);
        }
    }

    function loadCommits(data) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        const container = document.getElementById('commit-container');

        // Filter: Hanya ambil commit unik berdasarkan pesan (Grouping)
        const seen = new Set();
        data.forEach(c => {
            if(seen.has(c.commit.message)) return;
            seen.add(c.commit.message);

            const div = document.createElement('div');
            div.className = 'commit-item';
            div.onclick = () => {
                document.querySelectorAll('.commit-item').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                targetSHA = c.sha;
                document.getElementById('btn-restore').disabled = false;
                document.getElementById('selection-status').innerHTML = `Target: ${c.sha.substring(0,7)}`;
            };
            div.innerHTML = `
                <div>
                    <span class="commit-msg">${c.commit.message}</span>
                    <span class="commit-meta">${c.sha.substring(0,8)} • ${new Date(c.commit.author.date).toLocaleString()}</span>
                </div>
                <div style="color:var(--accent-green)">●</div>
            `;
            container.appendChild(div);
        });
    }

    async function runMassRestore() {
        if(!confirm("PERINGATAN: Ini akan mengembalikan kode secara MASAL. Lanjutkan?")) return;

        document.getElementById('terminal-overlay').style.display = 'block';
        log("STARTING DEEP-RESTORE SEQUENCE...", "log-warn");
        
        try {
            // 1. Ambil Tree Target (Full Recursive)
            log(`Fetching target tree (SHA: ${targetSHA.substring(0,7)})...`);
            const targetCommitRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/commits/${targetSHA}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            const targetCommit = await targetCommitRes.json();
            const targetTreeRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${targetCommit.tree.sha}?recursive=1`, {
                headers: { 'Authorization': `token ${token}` }
            });
            const targetTreeData = await targetTreeRes.json();

            // 2. Ambil Tree Saat Ini untuk Proteksi
            log("Fetching current state for protection check...");
            const currentRefRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/branches/main`, {
                headers: { 'Authorization': `token ${token}` }
            });
            const currentRef = await currentRefRes.json();
            const currentTreeRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${currentRef.commit.commit.tree.sha}?recursive=1`, {
                headers: { 'Authorization': `token ${token}` }
            });
            const currentTreeData = await currentTreeRes.json();

            // 3. Logic Merging Masal
            log("Filtering and merging data objects...");
            
            // Filter target: Buang file yang ada di folder proteksi
            const filteredTarget = targetTreeData.tree.filter(item => {
                const isProtected = CONFIG.protected.some(folder => item.path.startsWith(folder));
                return !isProtected && item.type === 'blob';
            });

            // Filter current: Ambil HANYA file yang ada di folder proteksi
            const protectedAssets = currentTreeData.tree.filter(item => {
                const isProtected = CONFIG.protected.some(folder => item.path.startsWith(folder));
                return isProtected && item.type === 'blob';
            });

            log(`Target files to restore: ${filteredTarget.length}`, 'log-info');
            log(`Protected files preserved: ${protectedAssets.length}`, 'log-info');

            const finalTreeArray = [...filteredTarget, ...protectedAssets].map(item => ({
                path: item.path,
                mode: item.mode,
                type: item.type,
                sha: item.sha
            }));

            // 4. Create New Tree Masal
            log("Injecting new tree to GitHub Git Database...");
            const newTreeRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees`, {
                method: 'POST',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ tree: finalTreeArray })
            });
            const newTree = await newTreeRes.json();

            // 5. Create Commit
            log("Sealing commit with master-key...");
            const newCommitRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/commits`, {
                method: 'POST',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: `⚡ MASS RESTORE: Reverted to ${targetSHA.substring(0,7)} (Protected Folders Kept)`,
                    tree: newTree.sha,
                    parents: [currentRef.commit.sha]
                })
            });
            const newCommit = await newCommitRes.json();

            // 6. Push ke Main
            log("Updating Main Branch HEAD...", "log-warn");
            const pushRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/refs/heads/main`, {
                method: 'PATCH',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ sha: newCommit.sha, force: true })
            });

            if(pushRes.ok) {
                log("DATABASE SYNCHRONIZED SUCCESSFULLY!", "log-warn");
                log("ALL FILES RESTORED IN ONE SINGLE COMMIT.", "log-info");
                log("DONE. <span class='blink'>_</span>");
                alert("GASS! Restore Masal Berhasil.");
            } else {
                throw new Error("Push Failed");
            }

        } catch (err) {
            log(`CRITICAL ERROR: ${err.message}`, "log-error");
            console.error(err);
        }
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SairootsMusic Restore Tool</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --success-color: #2ea043;
            --danger-color: #da3633;
            --terminal-bg: #000000;
            --terminal-text: #00ff00;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        h1, h2 {
            text-align: center;
            color: var(--accent-color);
        }

        /* Login Section */
        #login-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="password"], select {
            width: 100%;
            padding: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background: var(--success-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #30363d;
            cursor: not-allowed;
        }

        /* Main App Section */
        #app-section {
            display: none;
        }

        .commit-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #30363d;
            margin-bottom: 20px;
        }

        .commit-item {
            padding: 10px;
            border-bottom: 1px solid #30363d;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .commit-item:hover {
            background: #21262d;
        }

        .commit-item.selected {
            background: #1f6feb33;
            border-left: 4px solid var(--accent-color);
        }

        .commit-hash {
            font-size: 0.8em;
            color: #8b949e;
        }

        /* Terminal Modal */
        #terminal-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .terminal-window {
            width: 90%;
            max-width: 700px;
            height: 80%;
            background: var(--terminal-bg);
            border: 2px solid #333;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
        }

        .terminal-header {
            background: #333;
            padding: 5px 10px;
            color: #fff;
            font-size: 0.9em;
            display: flex;
            justify-content: space-between;
        }

        .terminal-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            color: var(--terminal-text);
            font-size: 0.9em;
            line-height: 1.4;
        }

        .log-line {
            margin-bottom: 2px;
        }

        .log-success { color: #00ff00; }
        .log-error { color: #ff0000; }
        .log-warning { color: #ffff00; }
        .log-info { color: #00ffff; }

        .progress-bar-container {
            height: 5px;
            background: #333;
            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;
            background: var(--terminal-text);
            width: 0%;
            transition: width 0.2s;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Section -->
    <div id="login-section">
        <h1>GITHUB RESTORE TOOL</h1>
        <p style="text-align: center; font-size: 0.9em; color: #8b949e;">Target: pembri/sairootsmusic.com</p>
        <div>
            <label for="token">GitHub Personal Access Token (Scope: repo)</label>
            <input type="password" id="token" placeholder="ghp_..." autocomplete="off">
        </div>
        <button onclick="authenticate()">LOGIN & LOAD COMMITS</button>
        <p id="login-error" style="color: var(--danger-color); text-align: center;"></p>
    </div>

    <!-- Main App Section -->
    <div id="app-section">
        <h2>SELECT TARGET COMMIT</h2>
        <p>Pilih commit yang ingin dikembalikan (Restore Point).</p>
        
        <div class="commit-list" id="commit-list">
            <!-- Commits will be loaded here -->
            <div style="padding: 20px; text-align: center;">Loading commits...</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span id="selected-commit-display" style="color: var(--accent-color);">No commit selected</span>
            <button id="restore-btn" onclick="startRestore()" disabled>START RESTORE</button>
        </div>
    </div>
</div>

<!-- Terminal Modal -->
<div id="terminal-modal">
    <div class="terminal-window">
        <div class="terminal-header">
            <span>TERMINAL - RESTORE PROCESS</span>
            <span id="terminal-status">RUNNING...</span>
        </div>
        <div class="terminal-body" id="terminal-body">
            <!-- Logs go here -->
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div style="padding: 10px; text-align: right;">
            <button id="close-terminal-btn" class="hidden" onclick="closeTerminal()">CLOSE</button>
        </div>
    </div>
</div>

<script>
    const OWNER = 'pembri';
    const REPO = 'sairootsmusic.com';
    let token = '';
    let commits = [];
    let selectedCommitSha = '';
    let selectedCommitMessage = '';

    // --- Authentication & Loading Commits ---

    async function authenticate() {
        const tokenInput = document.getElementById('token').value.trim();
        if (!tokenInput) {
            showError('Token tidak boleh kosong!');
            return;
        }
        token = tokenInput;
        
        const btn = document.querySelector('#login-section button');
        btn.disabled = true;
        btn.innerText = 'LOADING...';
        showError('');

        try {
            await loadCommits();
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('app-section').style.display = 'block';
        } catch (err) {
            showError('Gagal login atau load commits: ' + err.message);
            btn.disabled = false;
            btn.innerText = 'LOGIN & LOAD COMMITS';
        }
    }

    async function loadCommits() {
        const url = `https://api.github.com/repos/${OWNER}/${REPO}/commits?per_page=30`;
        const response = await fetch(url, {
            headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        commits = await response.json();
        renderCommits();
    }

    function renderCommits() {
        const listContainer = document.getElementById('commit-list');
        listContainer.innerHTML = '';

        if (commits.length === 0) {
            listContainer.innerHTML = '<div style="padding:10px;">Tidak ada commit ditemukan.</div>';
            return;
        }

        commits.forEach((commit, index) => {
            const div = document.createElement('div');
            div.className = 'commit-item';
            div.onclick = () => selectCommit(index, div);
            
            const sha = commit.sha.substring(0, 7);
            const msg = commit.commit.message.split('\n')[0];
            const date = new Date(commit.commit.author.date).toLocaleString();

            div.innerHTML = `
                <div>
                    <div style="font-weight:bold;">${msg}</div>
                    <div class="commit-hash">${sha} • ${date}</div>
                </div>
            `;
            listContainer.appendChild(div);
        });
    }

    function selectCommit(index, element) {
        // Remove previous selection
        document.querySelectorAll('.commit-item').forEach(el => el.classList.remove('selected'));
        
        // Add new selection
        element.classList.add('selected');
        
        selectedCommitSha = commits[index].sha;
        selectedCommitMessage = commits[index].commit.message.split('\n')[0];
        
        document.getElementById('selected-commit-display').innerText = `Selected: ${selectedCommitSha} (${selectedCommitMessage})`;
        document.getElementById('restore-btn').disabled = false;
    }

    function showError(msg) {
        document.getElementById('login-error').innerText = msg;
    }

    // --- Restore Logic ---

    async function startRestore() {
        if (!confirm(`Yakin ingin mengembalikan kode ke commit:\n${selectedCommitMessage}\n\nFile di /admin_pages dan /video cover akan DIABAIKAN.`)) {
            return;
        }

        document.getElementById('terminal-modal').style.display = 'flex';
        const terminalBody = document.getElementById('terminal-body');
        terminalBody.innerHTML = '';
        document.getElementById('close-terminal-btn').classList.add('hidden');
        document.getElementById('terminal-status').innerText = 'RUNNING...';
        
        log('Initializing restore sequence...', 'log-info');
        log(`Target Commit: ${selectedCommitSha}`, 'log-info');
        log(`Excluding: /admin_pages, /video cover`, 'log-warning');

        try {
            // 1. Get all files from the Target Commit
            log('Fetching tree structure from target commit...', 'log-info');
            const targetTree = await getTreeFromCommit(selectedCommitSha);
            
            // 2. Get current HEAD tree to compare and get current SHAs
            log('Fetching current HEAD tree...', 'log-info');
            const currentTree = await getTreeFromCommit('HEAD');
            
            // Create a map of current files for easy SHA lookup: path -> sha
            const currentFileMap = {};
            currentTree.forEach(item => {
                if (item.type === 'blob') {
                    currentFileMap[item.path] = item.sha;
                }
            });

            // 3. Filter files to restore
            const filesToRestore = targetTree.filter(item => {
                if (item.type !== 'blob') return false;
                
                const pathLower = item.path.toLowerCase();
                // Exclude logic
                if (pathLower.startsWith('admin_pages/') || 
                    pathLower.includes('/admin_pages/') ||
                    pathLower.startsWith('video cover/') || 
                    pathLower.includes('/video cover/')) {
                    return false;
                }
                return true;
            });

            log(`Found ${filesToRestore.length} files to process.`, 'log-info');

            // 4. Process each file
            let processedCount = 0;
            const totalFiles = filesToRestore.length;
            const progressBar = document.getElementById('progress-bar');

            for (const file of filesToRestore) {
                const path = file.path;
                
                // Check if file exists in current HEAD
                if (!currentFileMap[path]) {
                    log(`SKIP: ${path} (Does not exist in current HEAD)`, 'log-warning');
                    processedCount++;
                    updateProgress(processedCount, totalFiles, progressBar);
                    continue;
                }

                try {
                    // Get content from target commit
                    const contentObj = await getFileContent(selectedCommitSha, path);
                    
                    // Update file in current HEAD
                    await updateFile(path, contentObj.content, currentFileMap[path]);
                    
                    log(`RESTORED: ${path}`, 'log-success');
                } catch (err) {
                    log(`ERROR: ${path} - ${err.message}`, 'log-error');
                }

                processedCount++;
                updateProgress(processedCount, totalFiles, progressBar);
                
                // Small delay to avoid rate limiting
                await sleep(100); 
            }

            log('-----------------------------------', 'log-info');
            log('RESTORE COMPLETED SUCCESSFULLY', 'log-success');
            document.getElementById('terminal-status').innerText = 'COMPLETED';

        } catch (err) {
            log(`CRITICAL ERROR: ${err.message}`, 'log-error');
            document.getElementById('terminal-status').innerText = 'FAILED';
        }

        document.getElementById('close-terminal-btn').classList.remove('hidden');
    }

    // --- GitHub API Helpers ---

    async function getTreeFromCommit(sha) {
        // First get commit object to find tree sha
        const commitRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits/${sha}`, {
            headers: { 'Authorization': `token ${token}` }
        });
        if (!commitRes.ok) throw new Error('Failed to fetch commit details');
        const commitData = await commitRes.json();
        
        const treeSha = commitData.commit.tree.sha;
        
        // Get recursive tree to list all files
        const treeRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${treeSha}?recursive=1`, {
            headers: { 'Authorization': `token ${token}` }
        });
        if (!treeRes.ok) throw new Error('Failed to fetch tree');
        const treeData = await treeRes.json();
        
        return treeData.tree;
    }

    async function getFileContent(sha, path) {
        // We can use Contents API or Git Data API. 
        // Using Contents API is easier for getting base64 content directly.
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${sha}`, {
            headers: { 'Authorization': `token ${token}` }
        });
        if (!res.ok) throw new Error('Failed to get file content');
        return await res.json();
    }

    async function updateFile(path, content, currentSha) {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: `Restore: Revert to ${selectedCommitSha.substring(0,7)}`,
                content: content,
                sha: currentSha,
                branch: 'main' // Assuming main branch, adjust if needed
            })
        });
        
        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.message || 'Update failed');
        }
        return await res.json();
    }

    // --- UI Helpers ---

    function log(message, className) {
        const terminalBody = document.getElementById('terminal-body');
        const div = document.createElement('div');
        div.className = `log-line ${className}`;
        div.innerText = `> ${message}`;
        terminalBody.appendChild(div);
        terminalBody.scrollTop = terminalBody.scrollHeight;
    }

    function updateProgress(current, total, barElement) {
        const percent = Math.round((current / total) * 100);
        barElement.style.width = `${percent}%`;
    }

    function closeTerminal() {
        document.getElementById('terminal-modal').style.display = 'none';
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

</script>

</body>
</html>

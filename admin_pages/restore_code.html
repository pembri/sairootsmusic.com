<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAI Roots - Restore Code Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-red: #ff4444;
            --accent-yellow: #ffcc00;
            --accent-green: #2ecc71;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Login Section */
        #login-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            text-align: center;
        }

        input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
        }

        input:focus { border-color: var(--accent-yellow); }

        .btn {
            cursor: pointer;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-primary { background: var(--accent-green); color: black; }
        .btn-primary:hover { opacity: 0.8; transform: translateY(-2px); }

        /* Dashboard Section */
        #dashboard { display: none; }

        .commit-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-top: 1rem;
        }

        .commit-item {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .commit-item:hover { background: rgba(46, 204, 113, 0.1); }
        .commit-item.selected { border-left: 4px solid var(--accent-yellow); background: rgba(255, 204, 0, 0.05); }

        .commit-info { flex: 1; }
        .commit-msg { display: block; font-weight: 600; color: #fff; }
        .commit-meta { font-size: 0.8rem; color: #8b949e; font-family: 'JetBrains Mono', monospace; }

        /* Terminal Overlay */
        #terminal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 999;
            padding: 20px;
            box-sizing: border-box;
        }

        .terminal-window {
            background: #000;
            border: 1px solid var(--accent-green);
            height: 100%;
            border-radius: 8px;
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            overflow-y: auto;
            color: var(--accent-green);
        }

        .term-red { color: var(--accent-red); }
        .term-yellow { color: var(--accent-yellow); }
        
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--accent-green);
            animation: blink 0.8s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* Folders Warning */
        .warning-box {
            background: rgba(255, 68, 68, 0.1);
            border-left: 4px solid var(--accent-red);
            padding: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Page -->
    <div id="login-section">
        <h1>Restore Access</h1>
        <p>Masukkan GitHub Personal Access Token untuk mengelola repo <b>pembri/sairootsmusic.com</b></p>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
        <button class="btn btn-primary" onclick="connect()">Connect Repository</button>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard">
        <h1>Select Restore Point</h1>
        <div class="warning-box">
            <b>INFO:</b> Folder <code>/admin_pages</code> dan <code>/video cover</code> diproteksi secara otomatis (tidak akan berubah).
        </div>
        <div id="commit-container" class="commit-list">
            <!-- Riwayat commit muncul di sini -->
        </div>
        <div style="margin-top: 20px; text-align: right;">
            <button class="btn btn-primary" id="btn-restore" onclick="startRestore()" disabled>Gas Restore Sekarang</button>
        </div>
    </div>
</div>

<!-- Terminal Progress -->
<div id="terminal-overlay">
    <div class="terminal-window" id="terminal-content"></div>
</div>

<script>
    const OWNER = 'pembri';
    const REPO = 'sairootsmusic.com';
    let TOKEN = '';
    let selectedSHA = '';

    const term = document.getElementById('terminal-content');

    function log(msg, type = '') {
        const div = document.createElement('div');
        if(type === 'error') div.className = 'term-red';
        if(type === 'warn') div.className = 'term-yellow';
        div.innerHTML = `[${new Date().toLocaleTimeString()}] > ${msg}`;
        term.appendChild(div);
        term.scrollTop = term.scrollHeight;
    }

    async function connect() {
        TOKEN = document.getElementById('gh-token').value;
        if(!TOKEN) return alert('Token wajib diisi!');

        try {
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits`, {
                headers: { 'Authorization': `token ${TOKEN}` }
            });
            if(res.status === 200) {
                const commits = await res.json();
                showDashboard(commits);
            } else {
                alert('Token salah atau repo tidak ditemukan!');
            }
        } catch (e) {
            alert('Koneksi gagal!');
        }
    }

    function showDashboard(commits) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        
        const container = document.getElementById('commit-container');
        // Grouping: Jika ada pesan commit yang sama persis, ambil yang terbaru saja
        const uniqueCommits = [];
        const seenMessages = new Set();

        commits.forEach(c => {
            if(!seenMessages.has(c.commit.message)) {
                uniqueCommits.push(c);
                seenMessages.add(c.commit.message);
            }
        });

        uniqueCommits.forEach(c => {
            const item = document.createElement('div');
            item.className = 'commit-item';
            item.onclick = () => {
                document.querySelectorAll('.commit-item').forEach(el => el.classList.remove('selected'));
                item.classList.add('selected');
                selectedSHA = c.sha;
                document.getElementById('btn-restore').disabled = false;
            };
            item.innerHTML = `
                <div class="commit-info">
                    <span class="commit-msg">${c.commit.message}</span>
                    <span class="commit-meta">${c.sha.substring(0,7)} • ${new Date(c.commit.author.date).toLocaleString()}</span>
                </div>
            `;
            container.appendChild(item);
        });
    }

    async function startRestore() {
        if(!confirm('Apakah anda yakin ingin mengembalikan kode ke commit ini secara massal?')) return;

        document.getElementById('terminal-overlay').style.display = 'block';
        log('INITIALIZING HACKER RESTORE SEQUENCE...', 'warn');
        log(`TARGET: ${OWNER}/${REPO}`);
        log(`RESTORE POINT: ${selectedSHA}`);

        try {
            // 1. Dapatkan Tree dari commit yang dipilih
            log('Fetching source tree from restore point...');
            const targetCommitRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/commits/${selectedSHA}`, {
                headers: { 'Authorization': `token ${TOKEN}` }
            });
            const targetCommit = await targetCommitRes.json();
            
            log('Fetching full recursive tree structure...');
            const treeRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${targetCommit.tree.sha}?recursive=1`, {
                headers: { 'Authorization': `token ${TOKEN}` }
            });
            const fullTree = await treeRes.json();

            // 2. Dapatkan data terkini untuk folder proteksi
            log('Checking protected folders (/admin_pages & /video cover)...');
            const currentRefRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/branches/main`, {
                headers: { 'Authorization': `token ${TOKEN}` }
            });
            const currentBranch = await currentRefRes.json();
            const currentTreeRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${currentBranch.commit.commit.tree.sha}?recursive=1`, {
                headers: { 'Authorization': `token ${TOKEN}` }
            });
            const currentTree = await currentTreeRes.json();

            // 3. Filter Logic
            log('Filtering files (Applying exclusion rules)...', 'warn');
            
            // Ambil semua file dari target commit KECUALI yang di folder proteksi
            let newTreeData = fullTree.tree.filter(item => {
                const isProtected = item.path.startsWith('admin_pages/') || item.path.startsWith('video cover/');
                if(isProtected) {
                    log(`Skipping protected path: ${item.path}`, 'error');
                }
                return !isProtected && item.type === 'blob';
            });

            // Masukkan file folder proteksi dari kondisi SAAT INI (biar tidak berubah)
            const protectedFiles = currentTree.tree.filter(item => {
                return (item.path.startsWith('admin_pages/') || item.path.startsWith('video cover/')) && item.type === 'blob';
            });
            
            log(`Merging ${protectedFiles.length} protected files into new commit tree...`);
            newTreeData = [...newTreeData, ...protectedFiles];

            // 4. Create New Tree
            log('Uploading new tree structure to GitHub...');
            const createTreeRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees`, {
                method: 'POST',
                headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ tree: newTreeData.map(i => ({ path: i.path, mode: i.mode, type: i.type, sha: i.sha })) })
            });
            const newTree = await createTreeRes.json();

            // 5. Create Commit
            log('Finalizing commit metadata...');
            const newCommitRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/commits`, {
                method: 'POST',
                headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: `System Restore to ${selectedSHA.substring(0,7)} (Protected folders preserved)`,
                    tree: newTree.sha,
                    parents: [currentBranch.commit.sha]
                })
            });
            const newCommit = await newCommitRes.json();

            // 6. Update Branch Reference
            log('Updating main branch pointer...', 'warn');
            await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/refs/heads/main`, {
                method: 'PATCH',
                headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ sha: newCommit.sha, force: true })
            });

            log('RESTORE SUCCESSFUL!', 'warn');
            log('Repository has been updated. You can close this window.');
            log('<span class="cursor"></span>');
            
            alert('GASS! Restore Berhasil dilakukan.');
        } catch (err) {
            log('FATAL ERROR: ' + err.message, 'error');
            alert('Terjadi kesalahan fatal. Cek terminal.');
        }
    }
</script>

</body>
</html>

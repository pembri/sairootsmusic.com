<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="canonical" href="https://sairootsmusic.com/admin_pages/auto_canonical">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Interactive Restore - SAI Roots</title>
    <style>
        :root { --primary: #f1c40f; --accent: #e74c3c; --success: #2ecc71; --bg: #121212; }
        body { background-color: var(--bg); color: #e0e0e0; font-family: sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: auto; border: 1px solid #333; padding: 20px; border-radius: 12px; background: #1a1a1a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; font-size: 0.9em; }
        input[type="password"] { width: 100%; padding: 12px; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        
        /* List Commit Styling */
        #commitWrapper { margin-top: 20px; border: 1px solid #333; border-radius: 8px; background: #111; max-height: 400px; overflow-y: auto; }
        .commit-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #222; transition: 0.2s; }
        .commit-item:hover { background: #222; }
        .commit-item input { margin-right: 15px; transform: scale(1.3); cursor: pointer; }
        .commit-info { flex-grow: 1; overflow: hidden; }
        .commit-msg { font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .commit-meta { font-size: 0.75em; color: #888; margin-top: 3px; }
        .sha-tag { font-family: monospace; background: #333; padding: 2px 5px; border-radius: 3px; color: var(--primary); }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 12px; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        .btn-fetch { background: #3498db; color: white; }
        .btn-execute { background: var(--success); color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #log { margin-top: 20px; background: #000; padding: 15px; height: 200px; overflow-y: auto; font-size: 12px; border-radius: 6px; border: 1px solid #444; font-family: monospace; }
        .status-success { color: var(--success); }
        .status-error { color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <h2>
        SAI Roots Mass Restore 
        <span style="font-size: 0.5em; color: #666;">v2.0 Interactive</span>
    </h2>
    
    <label>GitHub Personal Access Token:</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">

    <div class="controls">
        <button class="btn-fetch" onclick="fetchCommits()">Muat 300 Commit Terbaru</button>
        <button class="btn-execute" id="execBtn" onclick="startRestore()" disabled>Eksekusi Restore Terpilih</button>
    </div>

    <label id="listLabel">Daftar Commit (0 ditemukan):</label>
    <div id="commitWrapper">
        <div style="padding: 20px; text-align: center; color: #555;">Klik "Muat Commit" untuk menampilkan data.</div>
    </div>

    <div id="log">Console Ready...</div>
</div>

<script>
    const OWNER = 'pembri';
    const REPO = 'sairootsmusic.com';
    const PROTECTED_FOLDERS = ['admin_pages/', 'video cover/'];
    let selectedCommits = [];

    function writeLog(message, type = 'info') {
        const logDiv = document.getElementById('log');
        const span = document.createElement('div');
        span.className = `status-${type}`;
        span.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
        logDiv.appendChild(span);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Fungsi Mengambil 300 Commit Terbaru
    async function fetchCommits() {
        const token = document.getElementById('token').value;
        if (!token) return alert("Masukkan Token GitHub dulu!");

        writeLog("Mengambil data commit dari GitHub...");
        const wrapper = document.getElementById('commitWrapper');
        wrapper.innerHTML = '<div style="padding: 20px; text-align: center;">Sedang memuat...</div>';

        try {
            // GitHub API per_page max 100, kita ambil 3 page untuk dapat 300
            let allCommits = [];
            for(let p=1; p<=3; p++) {
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits?per_page=100&page=${p}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const data = await response.json();
                if(data.message) throw new Error(data.message);
                allCommits = allCommits.concat(data);
            }

            wrapper.innerHTML = '';
            document.getElementById('listLabel').innerText = `Daftar Commit (${allCommits.length} ditemukan):`;
            
            allCommits.forEach(item => {
                const div = document.createElement('div');
                div.className = 'commit-item';
                div.innerHTML = `
                    <input type="checkbox" value="${item.sha}" onchange="updateSelection()">
                    <div class="commit-info">
                        <div class="commit-msg">${item.commit.message}</div>
                        <div class="commit-meta">
                            <span class="sha-tag">${item.sha.substring(0,7)}</span> • 
                            ${new Date(item.commit.author.date).toLocaleString('id-ID')}
                        </div>
                    </div>
                `;
                wrapper.appendChild(div);
            });
            writeLog("Berhasil memuat 300 commit.", "success");

        } catch (e) {
            writeLog("Gagal memuat: " + e.message, "error");
            wrapper.innerHTML = '<div style="padding: 20px; text-align: center; color: red;">Gagal mengambil data.</div>';
        }
    }

    function updateSelection() {
        const checked = document.querySelectorAll('input[type="checkbox"]:checked');
        selectedCommits = Array.from(checked).map(c => c.value);
        document.getElementById('execBtn').disabled = selectedCommits.length === 0;
        document.getElementById('execBtn').innerText = `Eksekusi Restore (${selectedCommits.length})`;
    }

    async function startRestore() {
        const token = document.getElementById('token').value;
        if (!confirm(`Konfirmasi: Anda akan me-restore ${selectedCommits.length} commit. Lanjutkan?`)) return;

        writeLog(`Memulai restore masal...`, 'info');

        for (const sha of selectedCommits) {
            try {
                writeLog(`Mengecek file pada SHA: ${sha.substring(0,7)}...`);
                
                const commitData = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits/${sha}`, {
                    headers: { 'Authorization': `token ${token}` }
                }).then(res => res.json());

                for (const file of commitData.files) {
                    if (PROTECTED_FOLDERS.some(f => file.filename.startsWith(f))) {
                        writeLog(`Skip terproteksi: ${file.filename}`, 'info');
                        continue;
                    }

                    // Ambil konten file dari commit
                    const contentData = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${file.filename}?ref=${sha}`, {
                        headers: { 'Authorization': `token ${token}` }
                    }).then(res => res.json());

                    // Ambil SHA file terbaru di main
                    const currentFile = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${file.filename}`, {
                        headers: { 'Authorization': `token ${token}` }
                    }).then(res => res.json());

                    // Commit Ulang
                    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${file.filename}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: `Restore ${file.filename} via Mass Tools`,
                            content: contentData.content,
                            sha: currentFile.sha
                        })
                    });

                    if (res.ok) writeLog(`Sukses: ${file.filename}`, 'success');
                    else writeLog(`Gagal: ${file.filename}`, 'error');

                    await new Promise(r => setTimeout(r, 1000));
                }
            } catch (err) {
                writeLog(`Error pada SHA ${sha}: ${err.message}`, 'error');
            }
        }
        writeLog("--- PROSES SELESAI ---", "success");
    }
</script>
</body>
</html>

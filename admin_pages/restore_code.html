<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Bulk Restore - SAI Roots</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            border-top: 4px solid #f1c40f; /* Kuning aksen */
        }
        h2 { color: #f1c40f; text-align: center; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #252525;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #27ae60; /* Hijau aksen */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover { background-color: #2ecc71; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #status {
            margin-top: 20px;
            padding: 15px;
            background-color: #000;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            border-left: 3px solid #e74c3c; /* Merah aksen */
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Restore Previous Code</h2>
    <p style="font-size: 12px; color: #888; text-align: center;">Target Repo: pembri/sairootsmusic.com</p>
    
    <label for="token">GitHub Personal Access Token:</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">

    <button id="startBtn" onclick="startRestore()">MULAI RESTORE MASSAL</button>

    <div id="status">Menunggu perintah...</div>
</div>

<script>
    const owner = 'pembri';
    const repo = 'sairootsmusic.com';
    const logArea = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    function log(msg) {
        logArea.innerText += `> ${msg}\n`;
        logArea.scrollTop = logArea.scrollHeight;
    }

    async function fetchGitHub(endpoint, token, options = {}) {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}${endpoint}`, {
            ...options,
            headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                ...options.headers
            }
        });
        if (!res.ok) throw new Error(`Error: ${res.status} - ${await res.text()}`);
        return res.json();
    }

    async function startRestore() {
        const token = document.getElementById('token').value;
        if (!token) return alert('Masukkan Token GitHub!');

        startBtn.disabled = true;
        logArea.innerText = "";
        log("Memulai proses pencarian commit terakhir...");

        try {
            // 1. Dapatkan daftar commit terbaru
            const commits = await fetchGitHub('/commits', token);
            if (commits.length < 2) throw new Error("Tidak ada commit sebelumnya untuk di-restore.");

            const latestCommitSha = commits[0].sha;
            const previousCommitSha = commits[1].sha; // Target restore (kode sebelum ini)

            log(`Commit Saat Ini: ${latestCommitSha.substring(0,7)}`);
            log(`Target Restore: ${previousCommitSha.substring(0,7)}`);

            // 2. Ambil daftar file dari commit target (Tree)
            const treeData = await fetchGitHub(`/git/trees/${previousCommitSha}?recursive=1`, token);
            
            // 3. Filter file .html yang bukan folder terlarang
            const filesToRestore = treeData.tree.filter(file => {
                const isHtml = file.path.endsWith('.html');
                const isForbidden = file.path.startsWith('admin_pages/') || file.path.startsWith('video_cover/');
                return isHtml && !isForbidden && file.type === 'blob';
            });

            log(`Ditemukan ${filesToRestore.length} file HTML untuk di-restore.`);

            // 4. Proses restore satu per satu dengan jeda 1 detik
            for (const file of filesToRestore) {
                try {
                    log(`Mengembalikan: ${file.path}...`);
                    
                    // Ambil konten file dari commit sebelumnya
                    const blobData = await fetchGitHub(`/git/blobs/${file.sha}`, token);
                    
                    // Lakukan commit ulang ke file tersebut
                    // Kita perlu mendapatkan SHA file saat ini di branch main untuk update
                    const currentFileStatus = await fetchGitHub(`/contents/${file.path}`, token);
                    
                    const updateData = {
                        message: `Restore ${file.path} to version from ${previousCommitSha.substring(0,7)}`,
                        content: blobData.content, // Konten sudah base64 dari API blob
                        sha: currentFileStatus.sha // SHA file sekarang agar bisa di-overwrite
                    };

                    await fetchGitHub(`/contents/${file.path}`, token, {
                        method: 'PUT',
                        body: JSON.stringify(updateData)
                    });

                    log(`SUKSES: ${file.path} dikembalikan.`);
                } catch (err) {
                    log(`GAGAL: ${file.path} - ${err.message}`);
                }
                
                // Jeda 1 detik sesuai permintaan
                await new Promise(resolve => setTimeout(resolve, 1000));
            }

            log("PROSES SELESAI!");

        } catch (error) {
            log(`FATAL ERROR: ${error.message}`);
        } finally {
            startBtn.disabled = false;
        }
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAI Roots - Restore Code</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Courier New', monospace; }
    .terminal {
      font-family: 'Courier New', monospace;
      background: #000;
      color: #00ff00;
    }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

  <!-- LOGIN PAGE -->
  <div id="loginPage" class="min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-gray-900 p-8 rounded-xl border border-gray-700">
      <h1 class="text-3xl font-bold text-center mb-8 text-green-400">🔄 RESTORE CODE</h1>
      <p class="text-center text-gray-400 mb-6">pembri/sairootsmusic.com</p>
      
      <div class="mb-6">
        <label class="block text-sm mb-2">GitHub Personal Access Token</label>
        <input id="tokenInput" type="password" 
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-green-500"
               placeholder="ghp_xxxxxxxxxxxxxxxx">
      </div>

      <button onclick="login()" 
              class="w-full bg-green-600 hover:bg-green-500 py-4 rounded-lg font-bold text-lg transition">
        LOGIN & MASUK
      </button>

      <p class="text-xs text-gray-500 text-center mt-6">
        Token harus memiliki izin <span class="text-yellow-400">repo</span>
      </p>
    </div>
  </div>

  <!-- MAIN PAGE -->
  <div id="mainPage" class="hidden min-h-screen p-8">
    <div class="max-w-5xl mx-auto">
      <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-green-400">🔄 Restore Code Tool</h1>
        <button onclick="logout()" class="text-red-400 hover:text-red-500">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>

      <div class="bg-gray-900 rounded-xl p-6 border border-gray-700 mb-8">
        <h2 class="text-xl mb-4">Riwayat Commit</h2>
        <select id="commitSelect" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-lg">
          <!-- diisi oleh JS -->
        </select>
      </div>

      <div class="bg-red-950 border border-red-700 rounded-xl p-6 mb-8">
        <h3 class="text-red-400 font-bold mb-3">⚠️ Folder yang TIDAK akan di-restore:</h3>
        <ul class="text-gray-400 space-y-1">
          <li>• /admin_pages</li>
          <li>• /video_cover</li>
        </ul>
        <p class="text-sm mt-4 text-gray-500">Semua file lain akan dikembalikan ke commit yang dipilih.</p>
      </div>

      <button onclick="startRestore()" 
              class="w-full bg-red-600 hover:bg-red-500 py-6 rounded-xl text-2xl font-bold transition-all active:scale-95">
        🚀 RESTORE MASAL KE COMMIT TERPILIH
      </button>
    </div>
  </div>

  <!-- TERMINAL PROGRESS MODAL -->
  <div id="terminalModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="w-full max-w-3xl mx-4">
      <div class="terminal rounded-xl border border-green-500 overflow-hidden shadow-2xl">
        <div class="bg-gray-900 px-4 py-2 border-b border-green-500 flex items-center">
          <div class="flex-1 text-center text-green-400 text-sm">RESTORE PROCESS - SAI ROOTS</div>
        </div>
        <div id="terminalOutput" class="h-96 p-6 overflow-y-auto text-sm leading-relaxed font-mono"></div>
      </div>
      
      <div class="text-center mt-4">
        <button onclick="cancelRestore()" 
                class="text-red-400 hover:text-red-500 text-sm">
          Batal
        </button>
      </div>
    </div>
  </div>

  <script>
    let token = '';
    let owner = 'pembri';
    let repo = 'sairootsmusic.com';
    let currentHeadSha = '';

    function log(text, color = 'text-green-400') {
      const term = document.getElementById('terminalOutput');
      const line = document.createElement('div');
      line.className = color;
      line.innerHTML = `> ${text}`;
      term.appendChild(line);
      term.scrollTop = term.scrollHeight;
    }

    async function login() {
      const inputToken = document.getElementById('tokenInput').value.trim();
      if (!inputToken) return alert("Masukkan GitHub Token!");

      token = inputToken;

      try {
        const res = await fetch('https://api.github.com/user', {
          headers: { 'Authorization': `token ${token}` }
        });
        if (!res.ok) throw new Error();
        
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('mainPage').classList.remove('hidden');
        
        await loadCommits();
      } catch (e) {
        alert("Token tidak valid atau expired!");
      }
    }

    async function loadCommits() {
      const select = document.getElementById('commitSelect');
      select.innerHTML = '<option value="">Memuat riwayat commit...</option>';

      try {
        const res = await fetch(`https://api.github.com/repos/\( {owner}/ \){repo}/commits?per_page=30`, {
          headers: { 'Authorization': `token ${token}` }
        });
        const commits = await res.json();

        select.innerHTML = '';
        commits.forEach(commit => {
          const option = document.createElement('option');
          option.value = commit.sha;
          option.textContent = `${commit.sha.substring(0,8)} - ${commit.commit.message.substring(0,60)}`;
          select.appendChild(option);
        });
      } catch (e) {
        alert("Gagal memuat commit history");
      }
    }

    async function startRestore() {
      const sha = document.getElementById('commitSelect').value;
      if (!sha) return alert("Pilih commit terlebih dahulu!");

      if (!confirm("⚠️ Anda yakin ingin mengembalikan SEMUA file (kecuali admin_pages & video_cover) ke commit ini?\n\nTindakan ini akan membuat commit baru.")) {
        return;
      }

      document.getElementById('terminalModal').classList.remove('hidden');
      document.getElementById('terminalOutput').innerHTML = '';

      log("🚀 Memulai proses restore...", "text-yellow-400");
      log(`Target Commit: ${sha.substring(0,12)}`);

      try {
        // Step 1: Ambil tree dari commit yang dipilih
        log("Mengambil tree dari commit target...");
        const targetTreeRes = await fetch(`https://api.github.com/repos/\( {owner}/ \){repo}/git/trees/${sha}?recursive=1`, {
          headers: { 'Authorization': `token ${token}` }
        });
        const targetData = await targetTreeRes.json();

        // Step 2: Ambil tree HEAD saat ini
        log("Mengambil tree HEAD saat ini...");
        const headRes = await fetch(`https://api.github.com/repos/\( {owner}/ \){repo}/git/trees/HEAD?recursive=1`, {
          headers: { 'Authorization': `token ${token}` }
        });
        const headData = await headRes.json();
        currentHeadSha = headData.sha;

        const excludedFolders = ['admin_pages', 'video_cover'];

        // Filter tree target (hapus folder yang dikecualikan)
        const filteredTree = targetData.tree.filter(item => {
          if (item.type === 'tree') {
            return !excludedFolders.some(folder => item.path.startsWith(folder));
          }
          return !excludedFolders.some(folder => item.path.startsWith(folder + '/'));
        });

        log(`Berhasil memfilter tree (${filteredTree.length} item)`);

        // Buat tree baru di GitHub
        log("Membuat tree baru di GitHub...");
        const newTreeRes = await fetch(`https://api.github.com/repos/\( {owner}/ \){repo}/git/trees`, {
          method: 'POST',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            base_tree: currentHeadSha,
            tree: filteredTree
          })
        });

        const newTree = await newTreeRes.json();

        // Buat commit
        log("Membuat commit restore...");
        const commitRes = await fetch(`https://api.github.com/repos/\( {owner}/ \){repo}/git/commits`, {
          method: 'POST',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `🔄 Restore ke commit ${sha.substring(0,12)} (kecuali admin_pages & video_cover)`,
            tree: newTree.sha,
            parents: [currentHeadSha]
          })
        });

        const newCommit = await commitRes.json();

        // Update branch (main)
        log("Mengupdate branch main...");
        await fetch(`https://api.github.com/repos/\( {owner}/ \){repo}/git/refs/heads/main`, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            sha: newCommit.sha
          })
        });

        log("✅ RESTORE BERHASIL!", "text-green-400");
        log(`New Commit: ${newCommit.sha.substring(0,12)}`, "text-green-400");

        setTimeout(() => {
          alert("Restore berhasil dilakukan!");
          location.reload();
        }, 2000);

      } catch (err) {
        console.error(err);
        log("❌ ERROR: " + err.message, "text-red-400");
      }
    }

    function cancelRestore() {
      if (confirm("Batalkan proses restore?")) {
        document.getElementById('terminalModal').classList.add('hidden');
      }
    }

    function logout() {
      if (confirm("Keluar dari tool ini?")) {
        location.reload();
      }
    }
  </script>
</body>
</html>

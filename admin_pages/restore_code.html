<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Mass Restore - SAI Roots</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 8px;
            background: #1a1a1a;
        }
        h2 { color: #f1c40f; border-bottom: 2px solid #e74c3c; padding-bottom: 10px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, textarea {
            width: 100%;
            padding: 10px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea { height: 120px; font-family: monospace; }
        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            width: 100%;
        }
        button:hover { background: #2ecc71; }
        #log {
            margin-top: 20px;
            background: #000;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-size: 13px;
            border-radius: 4px;
            border: 1px solid #444;
        }
        .status-success { color: #2ecc71; }
        .status-error { color: #e74c3c; }
        .status-info { color: #3498db; }
    </style>
</head>
<body>

<div class="container">
    <h2>Mass Restore Code (SAI Roots)</h2>
    
    <label>GitHub Personal Access Token:</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">

    <label>Daftar Commit SHA (Satu per baris):</label>
    <textarea id="shaList" placeholder="7d5930313294774a1b2a3043d423d7aaa7a561b8&#10;30746c4a0141efa3ca198977263f547bb114f476"></textarea>

    <button onclick="startRestore()">Eksekusi Restore Masal</button>

    <div id="log">Menunggu perintah...</div>
</div>

<script>
    const OWNER = 'pembri';
    const REPO = 'sairootsmusic.com';
    const PROTECTED_FOLDERS = ['admin_pages/', 'video cover/'];

    function writeLog(message, type = 'info') {
        const logDiv = document.getElementById('log');
        const span = document.createElement('div');
        span.className = `status-${type}`;
        span.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
        logDiv.appendChild(span);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function startRestore() {
        const token = document.getElementById('token').value;
        const shaInput = document.getElementById('shaList').value.trim();
        
        if (!token || !shaInput) {
            alert("Token dan SHA List wajib diisi!");
            return;
        }

        const shas = shaInput.split('\n').map(s => s.trim()).filter(s => s !== "");
        writeLog(`Memulai proses restore untuk ${shas.length} commit...`, 'info');

        for (const sha of shas) {
            try {
                writeLog(`Memproses Commit: ${sha}...`);
                
                // 1. Ambil detail commit untuk melihat file apa saja yang berubah
                const commitData = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits/${sha}`, {
                    headers: { 'Authorization': `token ${token}` }
                }).then(res => res.json());

                if (!commitData.files) throw new Error("Commit tidak ditemukan atau akses ditolak.");

                for (const file of commitData.files) {
                    const filePath = file.filename;

                    // Cek apakah file berada di folder yang diproteksi
                    const isProtected = PROTECTED_FOLDERS.some(folder => filePath.startsWith(folder));
                    
                    if (isProtected) {
                        writeLog(`Melewati file terproteksi: ${filePath}`, 'info');
                        continue;
                    }

                    // 2. Ambil konten file dari commit tersebut
                    const contentData = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${filePath}?ref=${sha}`, {
                        headers: { 'Authorization': `token ${token}` }
                    }).then(res => res.json());

                    // 3. Ambil SHA file saat ini di branch utama (untuk keperluan update)
                    const currentFile = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${filePath}`, {
                        headers: { 'Authorization': `token ${token}` }
                    }).then(res => res.json());

                    // 4. Lakukan Commit Ulang (Restore)
                    const updateResponse = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${filePath}`, {
                        method: 'PUT',
                        headers: { 
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Restore ${filePath} from commit ${sha}`,
                            content: contentData.content,
                            sha: currentFile.sha // SHA file sekarang di branch utama
                        })
                    });

                    if (updateResponse.ok) {
                        writeLog(`Berhasil Restore: ${filePath}`, 'success');
                    } else {
                        writeLog(`Gagal Restore: ${filePath}`, 'error');
                    }

                    // Jeda 1 detik sesuai permintaan
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }

            } catch (error) {
                writeLog(`Error pada commit ${sha}: ${error.message}`, 'error');
            }
        }
        writeLog("--- Semua Proses Selesai ---", 'success');
    }
</script>

</body>
</html>

            <div class="flex items-center gap-4 border-t border-white/10 pt-6">

                <div class="flex items-center gap-2">

                    <label for="save-cred" class="text-xs text-gray-400 cursor-pointer">Simpan kredensial di browser</label>

        <div class="bg-black border border-white/10 rounded-sm overflow-hidden">

                <span class="flex gap-2">

<script>
// --- KONFIGURASI MENU ---
const menuBtn = document.getElementById('menu-btn');
const mobileMenu = document.getElementById('mobile-menu');
const hamburgerIcon = document.getElementById('hamburger-icon');

function toggleMenu() {
    const isOpen = mobileMenu.classList.toggle('menu-open');
    if (isOpen) {
        hamburgerIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>`;
        hamburgerIcon.classList.add('text-rasta-yellow');
        document.body.style.overflow = 'hidden';
    } else {
        hamburgerIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>`;
        hamburgerIcon.classList.remove('text-rasta-yellow');
        document.body.style.overflow = 'auto';
    }
}
menuBtn.addEventListener('click', toggleMenu);

// --- LOGIKA SINKRONISASI ---
const terminal = document.getElementById('terminal-log');
const PLAYLIST_ID = 'PL29NQfo2Ox_DkGY9khBqL8vat09CbkI4K'; // ID Playlist Cover
const FILE_PATH = 'database.js'; // Target file di GitHub

function logMsg(msg, isError = false) {
    const time = new Date().toLocaleTimeString();
    const color = isError ? 'text-rasta-red' : 'text-rasta-green';
    terminal.innerHTML += `<br><span class="text-gray-500">[${time}]</span> <span class="${color}">${msg}</span>`;
    terminal.scrollTop = terminal.scrollHeight;
}

// Unicode safe Base64 encoding/decoding untuk Github API
function utoa(str) { return window.btoa(unescape(encodeURIComponent(str))); }
function atou(str) { return decodeURIComponent(escape(window.atob(str))); }

function createSlug(title) {
    return title.toLowerCase()
        .replace(/[^\w\s-]/g, '') // Hapus karakter spesial
        .replace(/[\s_-]+/g, '-') // Ganti spasi dengan strip
        .replace(/^-+|-+$/g, ''); // Hapus strip di awal/akhir
}

// Load Kredensial Tersimpan
window.onload = () => {
    if (localStorage.getItem('ytKey')) document.getElementById('yt-api-key').value = localStorage.getItem('ytKey');
    if (localStorage.getItem('ghToken')) document.getElementById('gh-token').value = localStorage.getItem('ghToken');
    if (localStorage.getItem('ghOwner')) document.getElementById('gh-owner').value = localStorage.getItem('ghOwner');
    if (localStorage.getItem('ghRepo')) document.getElementById('gh-repo').value = localStorage.getItem('ghRepo');
};

async function startSync() {
    const ytKey = document.getElementById('yt-api-key').value.trim();
    const ghToken = document.getElementById('gh-token').value.trim();
    const ghOwner = document.getElementById('gh-owner').value.trim();
    const ghRepo = document.getElementById('gh-repo').value.trim();
    const saveCred = document.getElementById('save-cred').checked;
    const btn = document.getElementById('btn-sync');

    if (!ytKey || !ghToken || !ghOwner || !ghRepo) {
        logMsg("GAGAL: Harap isi semua kolom kredensial!", true);
        return;
    }

    if (saveCred) {
        localStorage.setItem('ytKey', ytKey);
        localStorage.setItem('ghToken', ghToken);
        localStorage.setItem('ghOwner', ghOwner);
        localStorage.setItem('ghRepo', ghRepo);
    } else {
        localStorage.clear();
    }

    btn.disabled = true;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Memproses...`;
    btn.classList.replace('bg-rasta-green', 'bg-gray-600');
    
    terminal.innerHTML = '> Memulai proses sinkronisasi...';

    try {
        // ================== PERBAIKAN UTAMA: Fetch YouTube Playlist ==================
        logMsg(`Mengambil data dari Playlist YouTube (${PLAYLIST_ID})...`);

        let videoData = [];
        let nextPageToken = '';
        let page = 1;
        let totalFetched = 0;

        while (true) {
            const ytUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=\( {PLAYLIST_ID}&key= \){ytKey}${nextPageToken ? '&pageToken=' + nextPageToken : ''}`;
            
            const ytRes = await fetch(ytUrl);
            const ytJson = await ytRes.json();

            if (!ytRes.ok) {
                throw new Error(ytJson.error?.message || "Gagal menghubungi YouTube API");
            }

            if (!ytJson.items || ytJson.items.length === 0) {
                break;
            }

            ytJson.items.forEach(item => {
                const snippet = item.snippet;
                if (snippet.title !== "Private video" && snippet.title !== "Deleted video") {
                    videoData.push({
                        title: snippet.title,
                        slug: createSlug(snippet.title),
                        videoId: snippet.resourceId.videoId,
                        thumbnail: snippet.thumbnails.maxres ? snippet.thumbnails.maxres.url : snippet.thumbnails.high.url,
                        description: snippet.description || ""
                    });
                }
            });

            totalFetched += ytJson.items.length;
            logMsg(`Halaman ${page}: ${ytJson.items.length} video diambil (Total: ${totalFetched})`);

            nextPageToken = ytJson.nextPageToken;
            page++;

            if (!nextPageToken) break;
        }

        // Video terbaru biasanya muncul di paling atas
        videoData.reverse();

        logMsg(`Sukses! Total ${videoData.length} video cover berhasil diekstrak.`);

        // ================== BAGIAN BAWAH TETAP SAMA (TIDAK DIUBAH) ==================
        // 2. Fetch Github File (database.js)
        logMsg(`Memeriksa file ${FILE_PATH} di repositori GitHub...`);
        const ghUrl = `https://api.github.com/repos/\( {ghOwner}/ \){ghRepo}/contents/${FILE_PATH}`;
        const ghHeaders = {
            'Authorization': `token ${ghToken}`,
            'Accept': 'application/vnd.github.v3+json'
        };

        let sha = null;
        let fileContent = "";
        let newContent = "";

        const ghRes = await fetch(ghUrl, { headers: ghHeaders });
        
        if (ghRes.status === 200) {
            const ghJson = await ghRes.json();
            sha = ghJson.sha;
            fileContent = atou(ghJson.content);
            logMsg(`File ditemukan. Bersiap memperbarui kode...`);

            const coverRegex = /const\s+coverVideos\s*=\s*\[[\s\S]*?\];/;
            const newVarString = `const coverVideos = ${JSON.stringify(videoData, null, 4)};`;

            if (coverRegex.test(fileContent)) {
                newContent = fileContent.replace(coverRegex, newVarString);
            } else {
                newContent = fileContent + `\n\n// Generated by Auto-Sync\n${newVarString}\n`;
            }

        } else if (ghRes.status === 404) {
            logMsg(`File tidak ditemukan. Membuat file database.js baru...`);
            newContent = `// File Database Utama SAI Roots\nconst searchData = [];\n\nconst coverVideos = ${JSON.stringify(videoData, null, 4)};\n`;
        } else {
            const errJson = await ghRes.json();
            throw new Error(errJson.message || "Gagal mengakses GitHub API");
        }

        // 3. Commit dan Push ke Github
        logMsg(`Mengirim (push) perubahan ke GitHub...`);
        const commitBody = {
            message: `Auto-sync: Memperbarui data video cover (${videoData.length} video)`,
            content: utoa(newContent)
        };
        if (sha) commitBody.sha = sha;

        const pushRes = await fetch(ghUrl, {
            method: 'PUT',
            headers: ghHeaders,
            body: JSON.stringify(commitBody)
        });

        if (!pushRes.ok) {
            const pushErr = await pushRes.json();
            throw new Error(pushErr.message || "Gagal melakukan push");
        }

        logMsg(`✅ SINKRONISASI SELESAI! Perubahan berhasil di-push ke branch utama.`, false);
        logMsg(`Catatan: Karena GitHub Pages, perubahan di web mungkin butuh waktu 1-3 menit untuk muncul.`, false);

    } catch (error) {
        logMsg(`ERROR: ${error.message}`, true);
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fas fa-sync-alt mr-2"></i> Tarik & Update`;
        btn.classList.replace('bg-gray-600', 'bg-rasta-green');
    }
}
</script>

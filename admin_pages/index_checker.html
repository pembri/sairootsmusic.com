<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO Index Mobile</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #020617;
  color: #e2e8f0;
  padding: 15px;
  font-size: 20px; /* BESAR */
}

h1 {
  font-size: 26px;
  margin-bottom: 10px;
}

button {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  margin-bottom: 10px;
  border: none;
  border-radius: 10px;
}

.primary { background: #22c55e; color: black; }
.filter { background: #334155; color: white; }

input {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  margin-bottom: 10px;
}

.stats {
  font-size: 18px;
  margin-bottom: 10px;
}

.card {
  background: #0f172a;
  padding: 18px;
  margin-bottom: 14px;
  border-radius: 14px;
}

.indexed { border-left: 8px solid #22c55e; }
.not { border-left: 8px solid #ef4444; }
.checking { border-left: 8px solid #facc15; }

.url {
  font-size: 18px;
  word-break: break-word;
}

.status {
  font-size: 17px;
  margin-top: 6px;
}

.actions a {
  display: block;
  font-size: 16px;
  margin-top: 6px;
  color: #38bdf8;
  text-decoration: none;
}
</style>
</head>

<body>

<h1>Index Checker</h1>

<button class="primary" onclick="loadSitemap()">Load Sitemap</button>

<button class="filter" onclick="setFilter('all')">All</button>
<button class="filter" onclick="setFilter('indexed')">Indexed</button>
<button class="filter" onclick="setFilter('not')">Not Indexed</button>

<input type="text" id="search" placeholder="Cari URL..." oninput="render()">

<div class="stats" id="stats"></div>

<div id="results"></div>

<script>
const DOMAIN = "https://sairootsmusic.com";
const SITEMAP = DOMAIN + "/sitemap.xml";

let dataList = [];
let filterMode = "all";

async function loadSitemap() {
  let res = await fetch(SITEMAP);
  let text = await res.text();

  let xml = new DOMParser().parseFromString(text, "text/xml");
  let urls = [...xml.getElementsByTagName("loc")].map(x => x.textContent);

  dataList = urls.map(u => ({ url: u, status: "checking" }));

  render();
  urls.forEach((url, i) => checkIndex(url, i));
}

function setFilter(mode) {
  filterMode = mode;
  render();
}

function render() {
  let container = document.getElementById("results");
  let keyword = document.getElementById("search").value.toLowerCase();

  container.innerHTML = "";

  let filtered = dataList.filter(item => {
    if (filterMode === "indexed" && item.status !== "indexed") return false;
    if (filterMode === "not" && item.status !== "not") return false;
    if (!item.url.toLowerCase().includes(keyword)) return false;
    return true;
  });

  filtered.forEach(item => {
    let div = document.createElement("div");
    div.className = `card ${item.status}`;

    let shortUrl = item.url.replace(DOMAIN, "");

    let searchUrl = "https://www.google.com/search?q=site:" + encodeURIComponent(item.url);
    let inspectUrl = "https://search.google.com/search-console/inspect?resource_id=" + DOMAIN + "&url=" + encodeURIComponent(item.url);

    let statusText =
      item.status === "indexed" ? "🟢 Indexed" :
      item.status === "not" ? "🔴 Not Indexed" :
      "🟡 Checking";

    div.innerHTML = `
      <div class="url">${shortUrl}</div>
      <div class="status">${statusText}</div>
      <div class="actions">
        <a href="${searchUrl}" target="_blank">🔍 Lihat di Google</a>
        <a href="${inspectUrl}" target="_blank">⚙️ Inspect</a>
        <a href="${item.url}" target="_blank">🌐 Buka Halaman</a>
      </div>
    `;

    container.appendChild(div);
  });

  updateStats();
}

function updateStats() {
  let total = dataList.length;
  let indexed = dataList.filter(i => i.status === "indexed").length;
  let not = dataList.filter(i => i.status === "not").length;

  document.getElementById("stats").innerText =
    `Total: ${total} | Indexed: ${indexed} | Not: ${not}`;
}

async function checkIndex(url, index) {
  try {
    let res = await fetch("https://api.allorigins.win/get?url=" +
      encodeURIComponent("https://www.google.com/search?q=site:" + url));

    let data = await res.json();

    dataList[index].status = data.contents.includes(url) ? "indexed" : "not";
  } catch {
    dataList[index].status = "not";
  }

  render();
}
</script>

</body>
</html>

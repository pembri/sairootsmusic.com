<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Index Checker</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 20px;
}

button {
  padding: 8px 12px;
  margin: 5px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.primary { background: #22c55e; color: black; }
.filter { background: #334155; color: white; }

.box {
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  background: #1e293b;
}

.indexed { border-left: 6px solid #22c55e; }
.not-indexed { border-left: 6px solid #ef4444; }
.checking { border-left: 6px solid #facc15; }

.stats {
  margin: 10px 0;
}
a {
  color: #38bdf8;
  margin-right: 10px;
  font-size: 13px;
}
</style>
</head>

<body>

<h2>Index Checker Dashboard</h2>

<button class="primary" onclick="loadSitemap()">Load Sitemap</button>
<button class="filter" onclick="filterView('all')">All</button>
<button class="filter" onclick="filterView('indexed')">Indexed</button>
<button class="filter" onclick="filterView('not')">Not Indexed</button>

<div class="stats" id="stats"></div>
<div id="results"></div>

<script>
const DOMAIN = "https://sairootsmusic.com";
const SITEMAP = DOMAIN + "/sitemap.xml";

let dataList = [];

async function loadSitemap() {
  const res = await fetch(SITEMAP);
  const text = await res.text();

  const xml = new DOMParser().parseFromString(text, "text/xml");
  const urls = [...xml.getElementsByTagName("loc")].map(e => e.textContent);

  dataList = urls.map(u => ({ url: u, status: "checking" }));

  render();
  urls.forEach((u, i) => checkIndex(u, i));
}

function render(filter="all") {
  const container = document.getElementById("results");
  container.innerHTML = "";

  let filtered = dataList.filter(item => {
    if (filter === "indexed") return item.status === "indexed";
    if (filter === "not") return item.status === "not";
    return true;
  });

  filtered.forEach(item => {
    let div = document.createElement("div");
    div.className = `box ${item.status}`;

    let search = "https://www.google.com/search?q=site:" + encodeURIComponent(item.url);
    let inspect = "https://search.google.com/search-console/inspect?resource_id=" + DOMAIN + "&url=" + encodeURIComponent(item.url);

    div.innerHTML = `
      <strong>${item.url}</strong><br>
      <small>${item.status.toUpperCase()}</small>
      <div>
        <a href="${search}" target="_blank">🔍 Google</a>
        <a href="${inspect}" target="_blank">⚙️ Inspect</a>
        <a href="${item.url}" target="_blank">🌐 Open</a>
      </div>
    `;
    container.appendChild(div);
  });

  updateStats();
}

function filterView(type) {
  render(type);
}

function updateStats() {
  let total = dataList.length;
  let indexed = dataList.filter(i => i.status === "indexed").length;
  let not = dataList.filter(i => i.status === "not").length;

  document.getElementById("stats").innerHTML =
    `Total: ${total} | Indexed: ${indexed} | Not Indexed: ${not}`;
}

async function checkIndex(url, index) {
  try {
    let res = await fetch("https://api.allorigins.win/get?url=" +
      encodeURIComponent("https://www.google.com/search?q=site:" + url));

    let data = await res.json();

    if (data.contents.includes(url)) {
      dataList[index].status = "indexed";
    } else {
      dataList[index].status = "not";
    }

  } catch {
    dataList[index].status = "not";
  }

  render();
}
</script>

</body>
</html>

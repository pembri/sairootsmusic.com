<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index Checker</title>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:#fff}
.container{padding:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#111827;padding:12px;border-radius:12px;text-align:center}
.stat b{font-size:20px;display:block}
.search input{width:100%;padding:12px;border-radius:10px;border:none;background:#111827;color:white;margin:10px 0}
.filters{display:flex;gap:10px}
.filters button{flex:1;padding:10px;border-radius:10px;border:none;background:#1e293b;color:white}
.filters .active{background:#2563eb}
.main-btn{width:100%;padding:14px;border:none;border-radius:12px;background:#22c55e;margin:10px 0}
.card{background:#111827;padding:12px;border-radius:12px;margin-top:10px}
.status{float:right;padding:4px 10px;border-radius:999px;font-size:12px}
.pending{background:#475569}
.ok{background:#22c55e}
.no{background:#ef4444}
.actions{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.actions button{flex:1;padding:8px;border:none;border-radius:8px;background:#1e293b;color:white}
</style>
</head>

<body>
<div class="container">

<h2>🔍 Index Checker</h2>

<div class="grid">
  <div class="stat"><b id="total">0</b>TOTAL</div>
  <div class="stat"><b id="indexed">0</b>INDEXED</div>
  <div class="stat"><b id="not">0</b>NOT INDEXED</div>
  <div class="stat"><b id="pending">0</b>PENDING</div>
</div>

<div class="search">
  <input type="text" id="search" placeholder="Cari URL...">
</div>

<div class="filters">
  <button onclick="setFilter('all')" class="active">Semua</button>
  <button onclick="setFilter('ok')">Indexed</button>
  <button onclick="setFilter('no')">Not Indexed</button>
</div>

<button class="main-btn" onclick="checkAll()" id="btn">Cek Semua</button>

<div id="list"></div>

</div>

<script>
const worker = "https://worker-crimson-smoke-71e0.pembriahmad526.workers.dev"

let data = []
let filter = "all"

function stats(){
  document.getElementById("total").innerText = data.length
  document.getElementById("indexed").innerText = data.filter(x=>x.status==="ok").length
  document.getElementById("not").innerText = data.filter(x=>x.status==="no").length
  document.getElementById("pending").innerText = data.filter(x=>x.status==="pending").length
}

function render(){
  const list = document.getElementById("list")
  const key = document.getElementById("search").value.toLowerCase()
  list.innerHTML=""

  data
  .filter(x=>{
    if(filter==="ok") return x.status==="ok"
    if(filter==="no") return x.status==="no"
    return true
  })
  .filter(x=>x.url.toLowerCase().includes(key))
  .forEach(item=>{
    const div = document.createElement("div")
    div.className="card"

    let label = "Pending"
    if(item.status==="ok") label="Indexed"
    if(item.status==="no") label="Not Indexed"

    div.innerHTML = `
      <div>
        ${new URL(item.url).pathname}
        <span class="status ${item.status}">${label}</span>
      </div>
      <div style="font-size:12px;color:#94a3b8">${item.url}</div>

      <div class="actions">
        <button onclick="google('${item.url}')">Google</button>
        <button onclick="inspect('${item.url}')">Inspect</button>
        <button onclick="window.open('${item.url}')">Open</button>
        <button onclick="checkOne('${item.url}')">Recheck</button>
      </div>
    `

    list.appendChild(div)
  })

  stats()
}

function setFilter(f){
  filter=f
  document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"))
  event.target.classList.add("active")
  render()
}

function google(url){
  window.open("https://www.google.com/search?q=site:"+url)
}

function inspect(url){
  window.open("https://search.google.com/search-console/inspect?url="+url)
}

async function load(){
  const res = await fetch("/sitemap.xml")
  const txt = await res.text()
  const urls = [...txt.matchAll(/<loc>(.*?)<\/loc>/g)].map(x=>x[1])

  data = urls.map(u=>({url:u,status:"pending"}))
  render()
}

async function checkOne(url){
  const item = data.find(x=>x.url===url)
  item.status="pending"
  render()

  try{
    const r = await fetch(worker+"?url="+encodeURIComponent(url))
    const j = await r.json()

    if(j.blocked){
      item.status="pending"
    }else{
      item.status = j.indexed ? "ok" : "no"
    }

  }catch{
    item.status="no"
  }

  render()
}

// 🔥 FIX UTAMA: checkAll nggak macet + pasti ke-trigger
async function checkAll(){
  const btn = document.getElementById("btn")
  btn.innerText = "Loading..."
  btn.disabled = true

  for(let i=0;i<data.length;i++){
    await checkOne(data[i].url)
    await new Promise(r=>setTimeout(r,1000))
  }

  btn.innerText = "Cek Semua"
  btn.disabled = false
}

document.getElementById("search").addEventListener("input",render)

// 🔥 WAJIB: bikin fungsi global biar onclick jalan
window.checkAll = checkAll
window.checkOne = checkOne
window.setFilter = setFilter
window.google = google
window.inspect = inspect

load()
</script>

</body>
</html>

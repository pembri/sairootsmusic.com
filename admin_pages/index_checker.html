<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Index Checker - SAI Roots</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #161e31;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }

        /* Header Area */
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: var(--accent); font-size: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header p { color: var(--text-dim); font-size: 0.85rem; margin-top: 5px; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-box { background: var(--card-bg); padding: 15px 5px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
        .stat-box span { display: block; font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; }
        .stat-box strong { font-size: 1.2rem; }
        .t-total { color: var(--accent); }
        .t-indexed { color: var(--success); }
        .t-not { color: var(--danger); }
        .t-pending { color: var(--warning); }

        /* Search & Filter */
        .search-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 15px; display: flex; align-items: center; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; outline: none; margin-left: 10px; }
        
        .filter-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .f-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-dim); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .f-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(56, 189, 248, 0.1); }

        /* Main Button */
        .btn-main { background: var(--success); color: #052e16; width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* Card Item */
        .url-card { background: var(--card-bg); border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--border); position: relative; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .card-header h3 { font-size: 1rem; color: var(--text-main); }
        .url-link { color: var(--text-dim); font-size: 0.8rem; word-break: break-all; margin-bottom: 15px; display: block; }
        
        .status-badge { padding: 5px 15px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .status-pending { background: #334155; color: #cbd5e1; }
        .status-checking { background: var(--warning); color: #451a03; }
        .status-indexed { background: var(--success); color: #052e16; }
        .status-not_indexed { background: var(--danger); color: #fecaca; }

        .card-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .action-btn { background: #1e293b; color: var(--text-main); border: 1px solid var(--border); padding: 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; text-align: center; text-decoration: none; }
        .action-btn:hover { background: #334155; }
        .btn-retry { background: transparent; color: var(--accent); border: 1px solid var(--accent); margin-top: 10px; width: 100%; padding: 8px; border-radius: 6px; font-size: 0.75rem; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔍 SEO Index Checker</h1>
        <p id="sitemap-url-text">https://sairootsmusic.com/sitemap.xml</p>
    </div>

    <div class="stats-grid">
        <div class="stat-box"><span class="t-total">Total</span><strong id="stat-total">0</strong></div>
        <div class="stat-box"><span class="t-indexed">Indexed</span><strong id="stat-indexed">0</strong></div>
        <div class="stat-box"><span class="t-not">Not Indexed</span><strong id="stat-not">0</strong></div>
        <div class="stat-box"><span class="t-pending">Pending</span><strong id="stat-pending">0</strong></div>
    </div>

    <div class="search-box">
        <span>🔎</span>
        <input type="text" id="search-input" placeholder="Cari URL...">
    </div>

    <div class="filter-btns">
        <button class="f-btn active" onclick="filterData('all')">Semua</button>
        <button class="f-btn" onclick="filterData('indexed')">🟢 Indexed</button>
        <button class="f-btn" onclick="filterData('not_indexed')">🔴 Not Indexed</button>
    </div>

    <button id="btn-run" class="btn-main">▶️ Cek Semua URL</button>
    
    <div id="url-container">
        </div>
</div>

<script>
    const WORKER_URL = "https://worker-crimson-smoke-71e0.pembriahmad526.workers.dev/check?url=";
    // PENTING: Gunakan /sitemap.xml agar selalu ambil dari root domain
    const SITEMAP_PATH = "/sitemap.xml"; 
    const DELAY = 5000;

    let allData = [];
    let isRunning = false;

    // Load Data Otomatis saat buka
    window.onload = async () => {
        try {
            const res = await fetch(SITEMAP_PATH);
            if(!res.ok) throw new Error("Gagal load sitemap");
            const xml = await res.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xml, "text/xml");
            const locs = xmlDoc.getElementsByTagName("loc");

            for(let i=0; i<locs.length; i++) {
                const url = locs[i].textContent;
                const pathName = new URL(url).pathname;
                allData.push({
                    url: url,
                    path: pathName === "/" ? "/" : pathName,
                    status: 'pending',
                    id: i
                });
            }
            updateUI();
        } catch(e) {
            alert("File sitemap.xml tidak ditemukan di root! Pastikan ada di https://sairootsmusic.com/sitemap.xml");
        }
    };

    function updateUI() {
        const container = document.getElementById('url-container');
        container.innerHTML = '';
        
        let indexed = 0, not = 0, pending = 0;

        allData.forEach(item => {
            if(item.status === 'indexed') indexed++;
            else if(item.status === 'not_indexed') not++;
            else pending++;

            const card = document.createElement('div');
            card.className = `url-card item-status-${item.status}`;
            card.id = `card-${item.id}`;
            card.innerHTML = `
                <div class="card-header">
                    <h3>${item.path}</h3>
                    <span id="badge-${item.id}" class="status-badge status-${item.status}">${item.status.toUpperCase()}</span>
                </div>
                <span class="url-link">${item.url}</span>
                <div class="card-actions">
                    <a href="https://www.google.com/search?q=site:${item.url}" target="_blank" class="action-btn">🔍 Google</a>
                    <a href="https://search.google.com/search-console/inspect?resource_id=https://sairootsmusic.com/&url=${item.url}" target="_blank" class="action-btn">⚙️ Inspect</a>
                    <a href="${item.url}" target="_blank" class="action-btn">🌐 Buka</a>
                </div>
                <button class="btn-retry" onclick="checkSingle(${item.id})">🔄 Cek Ulang</button>
            `;
            container.appendChild(card);
        });

        document.getElementById('stat-total').innerText = allData.length;
        document.getElementById('stat-indexed').innerText = indexed;
        document.getElementById('stat-not').innerText = not;
        document.getElementById('stat-pending').innerText = pending;
    }

    document.getElementById('btn-run').onclick = async () => {
        if(isRunning) return;
        isRunning = true;
        document.getElementById('btn-run').innerText = "⏳ Sedang Memproses...";

        for(let i=0; i<allData.length; i++) {
            if(allData[i].status !== 'pending') continue;
            await checkSingle(i);
            await new Promise(r => setTimeout(r, DELAY));
        }

        isRunning = false;
        document.getElementById('btn-run').innerText = "▶️ Cek Semua URL";
    };

    async function checkSingle(id) {
        const badge = document.getElementById(`badge-${id}`);
        badge.innerText = "CHECKING...";
        badge.className = "status-badge status-checking";

        try {
            const res = await fetch(WORKER_URL + encodeURIComponent(allData[id].url));
            const json = await res.json();
            
            allData[id].status = json.indexed ? 'indexed' : 'not_indexed';
        } catch(e) {
            allData[id].status = 'not_indexed';
        }
        updateUI();
    }

    // Filter Logic
    function filterData(type) {
        document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        
        document.querySelectorAll('.url-card').forEach(card => {
            if(type === 'all') card.classList.remove('hidden');
            else if(!card.classList.contains(`item-status-${type}`)) card.classList.add('hidden');
            else card.classList.remove('hidden');
        });
    }

    // Search Logic
    document.getElementById('search-input').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.url-card').forEach(card => {
            const text = card.querySelector('h3').innerText.toLowerCase();
            card.classList.toggle('hidden', !text.includes(val));
        });
    };
</script>
</body>
</html>

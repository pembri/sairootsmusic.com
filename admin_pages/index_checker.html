<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Checker - SEO Tools</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding: 20px; line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; }

        header { margin-bottom: 30px; text-align: center; }
        header h1 { font-size: 2rem; color: var(--accent-blue); margin-bottom: 5px; }
        header p { color: var(--text-secondary); }

        /* Stats Section */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .stat-card h3 { font-size: 0.9rem; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 10px; }
        .stat-card p { font-size: 1.8rem; font-weight: bold; }
        #total-urls { color: var(--accent-blue); }
        #indexed-count { color: var(--success); }
        #not-indexed-count { color: var(--danger); }

        /* Controls */
        .controls { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        button { 
            padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; 
            transition: all 0.3s ease; font-size: 0.9rem;
        }
        .btn-load { background: var(--border); color: white; }
        .btn-start { background: var(--accent-blue); color: var(--bg-color); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }

        /* Table Section */
        .table-container { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(0,0,0,0.2); padding: 15px; color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 15px; border-top: 1px solid var(--border); font-size: 0.9rem; vertical-align: middle; }
        .url-text { color: var(--text-secondary); word-break: break-all; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
        .badge-pending { background: #334155; color: #cbd5e1; }
        .badge-checking { background: var(--warning); color: #451a03; animation: pulse 1.5s infinite; }
        .badge-indexed { background: var(--success); color: #052e16; }
        .badge-failed { background: var(--danger); color: #450a0a; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .log-container { margin-top: 15px; font-size: 0.8rem; color: var(--text-secondary); text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Index Checker</h1>
        <p>Monitoring Google Indexing Status via Cloudflare Workers</p>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total URL</h3>
            <p id="total-urls">0</p>
        </div>
        <div class="stat-card">
            <h3>Terindeks</h3>
            <p id="indexed-count">0</p>
        </div>
        <div class="stat-card">
            <h3>Belum Terindeks</h3>
            <p id="not-indexed-count">0</p>
        </div>
    </div>

    <div class="controls">
        <button id="btn-load-sitemap" class="btn-load">Muat Sitemap.xml</button>
        <button id="btn-start-scan" class="btn-start" disabled>Mulai Scanning</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 70%;">URL Halaman</th>
                    <th style="width: 30%; text-align: center;">Status Index</th>
                </tr>
            </thead>
            <tbody id="url-list">
                </tbody>
        </table>
    </div>

    <div id="status-log" class="log-container">Silakan klik "Muat Sitemap" untuk memulai.</div>
</div>

<script>
    // KONFIGURASI
    const WORKER_URL = "https://worker-crimson-smoke-71e0.pembriahmad526.workers.dev/check?url=";
    const SITEMAP_PATH = "./sitemap.xml";
    const SCAN_DELAY = 5000; // Jeda 5 detik antar URL agar aman dari block

    let urlQueue = [];
    let isScanning = false;
    let counts = { total: 0, indexed: 0, failed: 0 };

    const btnLoad = document.getElementById('btn-load-sitemap');
    const btnStart = document.getElementById('btn-start-scan');
    const urlListBody = document.getElementById('url-list');
    const logContainer = document.getElementById('status-log');

    // 1. Fungsi Ambil Sitemap
    btnLoad.addEventListener('click', async () => {
        try {
            logContainer.innerText = "Membaca sitemap...";
            const response = await fetch(SITEMAP_PATH);
            if (!response.ok) throw new Error("File sitemap.xml tidak ditemukan!");
            
            const xmlText = await response.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            const locations = xmlDoc.getElementsByTagName("loc");

            urlQueue = [];
            urlListBody.innerHTML = "";
            counts = { total: 0, indexed: 0, failed: 0 };

            for (let i = 0; i < locations.length; i++) {
                const url = locations[i].textContent;
                urlQueue.push(url);
                renderRow(url, i);
            }

            counts.total = urlQueue.length;
            updateStats();
            
            btnStart.disabled = false;
            logContainer.innerText = `Berhasil memuat ${counts.total} URL. Siap scan.`;
        } catch (err) {
            logContainer.innerText = "Error: " + err.message;
            alert(err.message);
        }
    });

    // 2. Fungsi Render Baris Tabel
    function renderRow(url, index) {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><span class="url-text">${url}</span></td>
            <td style="text-align: center;">
                <span id="status-${index}" class="badge badge-pending">Pending</span>
            </td>
        `;
        urlListBody.appendChild(row);
    }

    // 3. Fungsi Jalankan Scan (Sequential Queue)
    btnStart.addEventListener('click', async () => {
        if (isScanning) return;
        isScanning = true;
        btnStart.disabled = true;
        btnLoad.disabled = true;

        for (let i = 0; i < urlQueue.length; i++) {
            const currentUrl = urlQueue[i];
            const statusBadge = document.getElementById(`status-${i}`);
            
            statusBadge.innerText = "Checking...";
            statusBadge.className = "badge badge-checking";
            logContainer.innerText = `Memproses (${i + 1}/${counts.total}): ${currentUrl}`;

            try {
                const result = await checkIndex(currentUrl);
                
                if (result.indexed) {
                    statusBadge.innerText = "Indexed";
                    statusBadge.className = "badge badge-indexed";
                    counts.indexed++;
                } else {
                    statusBadge.innerText = "Not Indexed";
                    statusBadge.className = "badge badge-failed";
                    counts.failed++;
                }
            } catch (error) {
                statusBadge.innerText = "Error";
                statusBadge.className = "badge badge-failed";
                counts.failed++;
            }

            updateStats();
            
            // Beri jeda kecuali URL terakhir
            if (i < urlQueue.length - 1) {
                await new Promise(resolve => setTimeout(resolve, SCAN_DELAY));
            }
        }

        isScanning = false;
        btnLoad.disabled = false;
        logContainer.innerText = "Scanning Selesai!";
    });

    // 4. Hit ke Cloudflare Worker
    async function checkIndex(url) {
        const target = WORKER_URL + encodeURIComponent(url);
        const response = await fetch(target);
        if (!response.ok) throw new Error("Worker Error");
        return await response.json();
    }

    // 5. Update UI Statistik
    function updateStats() {
        document.getElementById('total-urls').innerText = counts.total;
        document.getElementById('indexed-count').innerText = counts.indexed;
        document.getElementById('not-indexed-count').innerText = counts.failed;
    }
</script>

</body>
</html>

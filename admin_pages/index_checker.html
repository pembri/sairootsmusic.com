<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SEO Index Checker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      padding: 20px;
      background: #1e293b;
      border-radius: 16px;
    }

    .header-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .header-text p {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 2px;
      word-break: break-all;
    }

    /* ── SUMMARY CARDS ── */
    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .summary-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
    }

    .summary-card .num {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }

    .summary-card .label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }

    .num-total   { color: #38bdf8; }
    .num-indexed { color: #22c55e; }
    .num-not     { color: #ef4444; }
    .num-pending { color: #f59e0b; }

    /* ── SEARCH & FILTER ── */
    .search-wrap {
      position: relative;
      margin-bottom: 10px;
    }

    .search-wrap input {
      width: 100%;
      padding: 11px 16px 11px 40px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-wrap input:focus { border-color: #38bdf8; }

    .search-wrap .icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 0.9rem;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: transparent;
      color: #94a3b8;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn.active {
      background: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .filter-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot-indexed { background: #22c55e; }
    .dot-not     { background: #ef4444; }

    /* ── MAIN ACTION BTN ── */
    .btn-check-all {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .btn-check-all:hover { opacity: 0.88; }
    .btn-check-all:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── PROGRESS ── */
    .progress-wrap {
      display: none;
      margin-bottom: 14px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      background: #1e293b;
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* ── RESULT INFO TEXT ── */
    .result-info {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 10px;
    }

    /* ── URL CARDS ── */
    .url-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .url-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #1e293b;
      transition: border-color 0.3s;
    }

    .url-card.status-indexed  { border-color: #16a34a33; }
    .url-card.status-not      { border-color: #dc262633; }
    .url-card.status-checking { border-color: #38bdf833; }

    .url-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .url-path {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
      word-break: break-all;
    }

    .url-full {
      font-size: 0.75rem;
      color: #64748b;
      word-break: break-all;
      margin-bottom: 12px;
    }

    /* Status Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-pending  { background: #1e3a5f; color: #93c5fd; }
    .badge-checking { background: #1c2d40; color: #38bdf8; }
    .badge-indexed  { background: #052e16; color: #4ade80; }
    .badge-not      { background: #2d0a0a; color: #f87171; }
    .badge-failed   { background: #2d2006; color: #fbbf24; }

    /* Action buttons */
    .url-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
    }

    .action-btn {
      padding: 6px 13px;
      border-radius: 7px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #94a3b8;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .action-btn:hover { border-color: #64748b; color: #e2e8f0; }

    .action-btn.btn-google   { border-color: #3b5bdb33; color: #748ffc; }
    .action-btn.btn-google:hover { border-color: #748ffc; }

    .action-btn.btn-inspect  { border-color: #f59e0b33; color: #fbbf24; }
    .action-btn.btn-inspect:hover { border-color: #fbbf24; }

    .action-btn.btn-open     { border-color: #33415533; color: #94a3b8; }

    .action-btn.btn-recheck  { border-color: #22c55e33; color: #4ade80; }
    .action-btn.btn-recheck:hover { border-color: #4ade80; }

    /* method tag */
    .method-tag {
      font-size: 0.65rem;
      color: #475569;
      margin-left: auto;
    }

    /* Spinner kecil */
    .mini-spinner {
      width: 10px;
      height: 10px;
      border: 2px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: #475569;
    }

    .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="header-icon">🔍</div>
    <div class="header-text">
      <h1>SEO Index Checker</h1>
      <p id="sitemapPathLabel">Memuat sitemap...</p>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="summary">
    <div class="summary-card">
      <div class="num num-total" id="numTotal">0</div>
      <div class="label">Total</div>
    </div>
    <div class="summary-card">
      <div class="num num-indexed" id="numIndexed">0</div>
      <div class="label">Indexed</div>
    </div>
    <div class="summary-card">
      <div class="num num-not" id="numNot">0</div>
      <div class="label">Not Indexed</div>
    </div>
    <div class="summary-card">
      <div class="num num-pending" id="numPending">0</div>
      <div class="label">Pending</div>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <span class="icon">🔎</span>
    <input type="text" id="searchInput" placeholder="Cari URL..." oninput="renderList()" />
  </div>

  <!-- FILTER -->
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">Semua</button>
    <button class="filter-btn" onclick="setFilter('indexed', this)">
      <span class="filter-dot dot-indexed"></span> Indexed
    </button>
    <button class="filter-btn" onclick="setFilter('not', this)">
      <span class="filter-dot dot-not"></span> Not Indexed
    </button>
  </div>

  <!-- MAIN BTN -->
  <button class="btn-check-all" id="btnCheckAll" onclick="startCheckAll()">
    🚀 Cek Semua URL
  </button>

  <!-- PROGRESS -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-info">
      <span id="progressText">Mengecek 0 dari 0...</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- RESULT INFO -->
  <div class="result-info" id="resultInfo"></div>

  <!-- LIST -->
  <div class="url-list" id="urlList">
    <div class="empty-state">
      <div class="icon">🗺️</div>
      <div>Memuat sitemap.xml...</div>
    </div>
  </div>

</div>

<script>
  // ─────────────────────────────────────────
  // CONFIG — hardcoded worker URL
  // ─────────────────────────────────────────
  const WORKER_URL = "https://index-checker.pembriahmad526.workers.dev";

  // Delay antar request (ms) — aman dari rate limit
  const DELAY_MIN = 2500;
  const DELAY_MAX = 4000;

  // ─────────────────────────────────────────
  // STATE
  // ─────────────────────────────────────────
  let urls = [];         // { url, path, status, method, details }
  let filter = "all";
  let isChecking = false;
  let stopFlag = false;

  // ─────────────────────────────────────────
  // INIT
  // ─────────────────────────────────────────
  window.addEventListener("DOMContentLoaded", async () => {
    await loadSitemap();
  });

  async function loadSitemap() {
    try {
      // Ambil sitemap.xml dari folder yang sama
      const sitemapUrl = new URL("sitemap.xml", location.href).href;
      document.getElementById("sitemapPathLabel").textContent = sitemapUrl;

      const res = await fetch(sitemapUrl);
      if (!res.ok) throw new Error("Gagal fetch sitemap: " + res.status);

      const text = await res.text();
      const parser = new DOMParser();
      const xml = parser.parseFromString(text, "application/xml");

      // Ambil semua <loc>
      const locs = [...xml.querySelectorAll("url > loc, sitemap > loc")];
      if (locs.length === 0) throw new Error("Tidak ada URL ditemukan di sitemap.");

      urls = locs.map(loc => {
        const fullUrl = loc.textContent.trim();
        let path = "/";
        try {
          const u = new URL(fullUrl);
          path = u.pathname + u.search || "/";
        } catch {}
        return { url: fullUrl, path, status: "pending", method: null, details: null };
      });

      updateSummary();
      renderList();
    } catch (err) {
      document.getElementById("urlList").innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <div>${err.message}</div>
        </div>`;
      document.getElementById("sitemapPathLabel").textContent = "Gagal memuat sitemap";
    }
  }

  // ─────────────────────────────────────────
  // CHECK ALL
  // ─────────────────────────────────────────
  async function startCheckAll() {
    if (isChecking) {
      // Tombol jadi stop
      stopFlag = true;
      return;
    }

    isChecking = true;
    stopFlag = false;

    const btn = document.getElementById("btnCheckAll");
    btn.textContent = "⏹ Stop";

    document.getElementById("progressWrap").style.display = "block";

    const total = urls.length;
    let done = 0;

    for (let i = 0; i < urls.length; i++) {
      if (stopFlag) break;

      // Skip yang sudah selesai
      if (urls[i].status === "indexed" || urls[i].status === "not") {
        done++;
        updateProgress(done, total);
        continue;
      }

      urls[i].status = "checking";
      renderList();

      try {
        const result = await checkUrl(urls[i].url);
        urls[i].status = result.indexed ? "indexed" : "not";
        urls[i].method = result.method;
        urls[i].details = result.details;
      } catch {
        urls[i].status = "failed";
      }

      done++;
      updateProgress(done, total);
      updateSummary();
      renderList();

      // Delay acak sebelum request berikutnya
      if (i < urls.length - 1 && !stopFlag) {
        await randomDelay(DELAY_MIN, DELAY_MAX);
      }
    }

    isChecking = false;
    stopFlag = false;
    btn.innerHTML = "🚀 Cek Semua URL";
    document.getElementById("progressWrap").style.display = "none";
    updateSummary();
    renderList();
  }

  async function recheckSingle(index) {
    if (isChecking) return;

    urls[index].status = "checking";
    renderList();

    try {
      const result = await checkUrl(urls[index].url);
      urls[index].status = result.indexed ? "indexed" : "not";
      urls[index].method = result.method;
      urls[index].details = result.details;
    } catch {
      urls[index].status = "failed";
    }

    updateSummary();
    renderList();
  }

  async function checkUrl(targetUrl) {
    const res = await fetch(`${WORKER_URL}/check?url=${encodeURIComponent(targetUrl)}`);
    if (!res.ok) throw new Error("Worker error: " + res.status);
    return await res.json();
  }

  function randomDelay(min, max) {
    return new Promise(r => setTimeout(r, Math.floor(Math.random() * (max - min + 1)) + min));
  }

  // ─────────────────────────────────────────
  // PROGRESS
  // ─────────────────────────────────────────
  function updateProgress(done, total) {
    const pct = Math.round((done / total) * 100);
    document.getElementById("progressText").textContent = `Mengecek ${done} dari ${total}...`;
    document.getElementById("progressPct").textContent = pct + "%";
    document.getElementById("progressFill").style.width = pct + "%";
  }

  // ─────────────────────────────────────────
  // SUMMARY
  // ─────────────────────────────────────────
  function updateSummary() {
    const total   = urls.length;
    const indexed = urls.filter(u => u.status === "indexed").length;
    const not     = urls.filter(u => u.status === "not" || u.status === "failed").length;
    const pending = urls.filter(u => u.status === "pending" || u.status === "checking").length;

    document.getElementById("numTotal").textContent   = total;
    document.getElementById("numIndexed").textContent = indexed;
    document.getElementById("numNot").textContent     = not;
    document.getElementById("numPending").textContent = pending;

    const filtered = getFiltered();
    document.getElementById("resultInfo").textContent =
      `Menampilkan ${filtered.length} dari ${total} URL`;
  }

  // ─────────────────────────────────────────
  // FILTER
  // ─────────────────────────────────────────
  function setFilter(f, el) {
    filter = f;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    el.classList.add("active");
    updateSummary();
    renderList();
  }

  function getFiltered() {
    const q = document.getElementById("searchInput").value.toLowerCase();
    return urls.filter((u, i) => {
      const matchFilter =
        filter === "all" ? true :
        filter === "indexed" ? u.status === "indexed" :
        filter === "not" ? (u.status === "not" || u.status === "failed") : true;

      const matchSearch = u.url.toLowerCase().includes(q) || u.path.toLowerCase().includes(q);
      return matchFilter && matchSearch;
    });
  }

  // ─────────────────────────────────────────
  // RENDER
  // ─────────────────────────────────────────
  function renderList() {
    const list = document.getElementById("urlList");
    const filtered = getFiltered();

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><div>Tidak ada URL ditemukan.</div></div>`;
      return;
    }

    list.innerHTML = filtered.map(u => {
      const realIndex = urls.indexOf(u);
      return cardHTML(u, realIndex);
    }).join("");
  }

  function cardHTML(u, index) {
    const statusClass =
      u.status === "indexed"  ? "status-indexed"  :
      u.status === "not"      ? "status-not"       :
      u.status === "checking" ? "status-checking"  : "";

    const badge = badgeHTML(u.status);
    const methodTag = u.method ? `<span class="method-tag">via ${u.method}</span>` : "";

    const encodedUrl = encodeURIComponent(u.url);
    const gscUrl = `https://search.google.com/search-console/inspect?resource_id=${encodeURIComponent(u.url)}&utm_medium=link`;

    return `
      <div class="url-card ${statusClass}" id="card-${index}">
        <div class="url-card-top">
          <span class="url-path">${escHtml(u.path)}</span>
          ${badge}
        </div>
        <div class="url-full">${escHtml(u.url)}</div>
        <div class="url-actions">
          <button class="action-btn btn-google" onclick="window.open('https://www.google.com/search?q=site:${encodeURIComponent(u.url)}','_blank')">🔵 Google</button>
          <button class="action-btn btn-inspect" onclick="window.open('${gscUrl}','_blank')">🔎 Inspect</button>
          <button class="action-btn btn-open" onclick="window.open('${escHtml(u.url)}','_blank')">🔗 Buka</button>
          <button class="action-btn btn-recheck" onclick="recheckSingle(${index})">🔄 Cek Ulang</button>
          ${methodTag}
        </div>
      </div>`;
  }

  function badgeHTML(status) {
    switch (status) {
      case "pending":  return `<span class="badge badge-pending">⏳ Pending</span>`;
      case "checking": return `<span class="badge badge-checking"><span class="mini-spinner"></span> Checking</span>`;
      case "indexed":  return `<span class="badge badge-indexed">✅ Indexed</span>`;
      case "not":      return `<span class="badge badge-not">❌ Not Indexed</span>`;
      case "failed":   return `<span class="badge badge-failed">⚠️ Failed</span>`;
      default:         return `<span class="badge badge-pending">⏳ Pending</span>`;
    }
  }

  function escHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
</script>
</body>
</html>

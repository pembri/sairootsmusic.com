<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replace Kode HTML - SAI Roots</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #e0e0e0;
            --primary-red: #ff4b2b;
            --primary-yellow: #fbc02d;
            --primary-green: #4caf50;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-top: 4px solid var(--primary-green);
        }

        h1 {
            text-align: center;
            color: var(--primary-yellow);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--primary-yellow);
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #252525;
            color: #fff;
            box-sizing: border-box;
        }

        textarea {
            height: 80px;
            font-family: monospace;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn-login { background-color: var(--primary-yellow); color: #000; }
        .btn-scan { background-color: #2196f3; color: #fff; }
        .btn-replace { background-color: var(--primary-red); color: #fff; }
        .btn-restore { background-color: var(--primary-green); color: #fff; }
        .btn-logout { background-color: #555; color: #fff; float: right; font-size: 10px; margin-top: -40px;}

        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            opacity: 0.8;
            transform: translateY(-2px);
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }

        .status-info { background: #1e3a5f; color: #fff; border: 1px solid #2196f3; }
        .status-success { background: #1b4332; color: #fff; border: 1px solid var(--primary-green); }
        .status-error { background: #4a1c1c; color: #fff; border: 1px solid var(--primary-red); }

        #fileList {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            background: #111;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .file-item {
            padding: 5px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-yellow);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 2s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Replace Kode HTML</h1>
    
    <!-- Login Section -->
    <div id="loginSection" class="section">
        <label for="githubToken">GitHub API Token:</label>
        <input type="password" id="githubToken" placeholder="Paste GitHub Token di sini...">
        <button class="btn-login" onclick="saveToken()">Login & Simpan Token</button>
    </div>

    <div id="mainSection" style="display: none;">
        <button class="btn-logout" onclick="logout()">Logout</button>
        
        <!-- Restore Section -->
        <div class="section" style="border-color: var(--primary-green);">
            <label>Fitur Keamanan:</label>
            <button id="restoreBtn" class="btn-restore" onclick="restoreBackup()">Kembalikan Kode Ke Sebelumnya (Undo)</button>
            <p style="font-size: 11px; margin-top: 5px; color: #888;">*Tombol ini aktif jika ada data backup terakhir.</p>
        </div>

        <!-- Replace Section -->
        <div class="section">
            <label>1. Kode yang ingin diganti (Old Code):</label>
            <textarea id="oldCode" placeholder="Contoh: https://link.deezer.com/s/..."></textarea>
            
            <div class="btn-group">
                <button id="scanBtn" class="btn-scan" onclick="startScan()">Cari di Semua File</button>
            </div>

            <div id="scanResult" style="display: none; margin-top: 15px;">
                <label>File yang ditemukan:</label>
                <div id="fileList"></div>
                
                <div style="margin-top: 15px;">
                    <label>2. Kode Baru (New Code):</label>
                    <textarea id="newCode" placeholder="Contoh: https://www.deezer.com/artist/..."></textarea>
                    <button id="replaceBtn" class="btn-replace" onclick="executeReplace()">Ganti Sekarang!</button>
                </div>
            </div>
        </div>
    </div>

    <div id="status"></div>
</div>

<script>
    const OWNER = 'pembri';
    const REPO = 'sairootsmusic.com';
    let GITHUB_TOKEN = '';
    let foundFiles = [];

    // Init
    window.onload = () => {
        const savedToken = localStorage.getItem('gh_token');
        if (savedToken) {
            GITHUB_TOKEN = savedToken;
            showMain();
        }
        checkBackup();
    };

    function showMain() {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('mainSection').style.display = 'block';
    }

    function saveToken() {
        const token = document.getElementById('githubToken').value.trim();
        if (!token) return alert('Token jangan kosong, cok!');
        localStorage.setItem('gh_token', token);
        GITHUB_TOKEN = token;
        showMain();
        showStatus('Login berhasil & Token disimpan.', 'success');
    }

    function logout() {
        localStorage.removeItem('gh_token');
        location.reload();
    }

    function showStatus(msg, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        statusDiv.className = 'status-' + type;
        statusDiv.innerHTML = msg;
    }

    async function startScan() {
        const oldText = document.getElementById('oldCode').value.trim();
        if (!oldText) return alert('Masukkan kode yang mau dicari dulu!');

        showStatus('<div class="loader"></div> Lagi nge-scan file .html...', 'info');
        foundFiles = [];
        const fileListDiv = document.getElementById('fileList');
        fileListDiv.innerHTML = '';
        document.getElementById('scanResult').style.display = 'none';

        try {
            // Get all files recursively
            const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/main?recursive=1`, {
                headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
            });
            const data = await response.json();

            if (!data.tree) throw new Error('Gagal ambil struktur repo. Cek token lo.');

            const htmlFiles = data.tree.filter(f => f.path.endsWith('.html') && f.type === 'blob');

            for (const file of htmlFiles) {
                const contentResponse = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${file.path}`, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                const contentData = await contentResponse.json();
                const decodedContent = atob(contentData.content.replace(/\n/g, ''));

                if (decodedContent.includes(oldText)) {
                    foundFiles.push({
                        path: file.path,
                        sha: contentData.sha,
                        content: decodedContent
                    });
                    fileListDiv.innerHTML += `<div class="file-item"><span>📄 ${file.path}</span> <span style="color:var(--primary-green)">Found</span></div>`;
                }
            }

            if (foundFiles.length > 0) {
                document.getElementById('scanResult').style.display = 'block';
                showStatus(`Ketemu ${foundFiles.length} file yang mengandung kode tersebut.`, 'success');
            } else {
                showStatus('Nggak ada file yang mengandung kode itu, cok.', 'error');
            }

        } catch (err) {
            showStatus('Error: ' + err.message, 'error');
        }
    }

    async function executeReplace() {
        const oldText = document.getElementById('oldCode').value;
        const newText = document.getElementById('newCode').value;
        if (!newText) return alert('Kode baru jangan kosong!');

        if (!confirm(`Yakin mau ganti kode di ${foundFiles.length} file? Gue backup dulu otomatis kok.`)) return;

        // Backup to LocalStorage first
        localStorage.setItem('last_backup', JSON.stringify(foundFiles));
        checkBackup();

        showStatus('<div class="loader"></div> Lagi proses update GitHub...', 'info');

        try {
            for (const file of foundFiles) {
                const updatedContent = file.content.split(oldText).join(newText);
                const encodedContent = btoa(unescape(encodeURIComponent(updatedContent)));

                await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${file.path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Automated replace code: ${file.path}`,
                        content: encodedContent,
                        sha: file.sha
                    })
                });
            }
            showStatus('MANTAP! Semua kode berhasil diganti. Refresh web lo buat cek.', 'success');
            document.getElementById('scanResult').style.display = 'none';
        } catch (err) {
            showStatus('Gagal replace: ' + err.message, 'error');
        }
    }

    function checkBackup() {
        const backup = localStorage.getItem('last_backup');
        const btn = document.getElementById('restoreBtn');
        if (backup) {
            btn.disabled = false;
            btn.innerHTML = 'Kembalikan Kode Ke Sebelumnya (Undo)';
        } else {
            btn.disabled = true;
            btn.innerHTML = 'Tidak Ada Backup';
        }
    }

    async function restoreBackup() {
        const backupData = JSON.parse(localStorage.getItem('last_backup'));
        if (!backupData || backupData.length === 0) return;

        if (!confirm('Yakin mau balikin ke kode sebelum diganti tadi?')) return;

        showStatus('<div class="loader"></div> Lagi proses Restore...', 'info');

        try {
            for (const file of backupData) {
                // We need current SHA because it might have changed
                const currentFileRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${file.path}`, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                const currentFileData = await currentFileRes.json();
                
                const encodedContent = btoa(unescape(encodeURIComponent(file.content)));

                await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${file.path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Restore previous code: ${file.path}`,
                        content: encodedContent,
                        sha: currentFileData.sha
                    })
                });
            }
            showStatus('RESTORE BERHASIL! Kode kembali seperti semula.', 'success');
            localStorage.removeItem('last_backup');
            checkBackup();
        } catch (err) {
            showStatus('Gagal restore: ' + err.message, 'error');
        }
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub HTML Bulk Replacer</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-red: #E53935;
            --accent-yellow: #FDD835;
            --accent-green: #43A047;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 8px;
            border-top: 5px solid var(--accent-red);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            color: var(--text-main);
        }

        h1 span.r { color: var(--accent-red); }
        h1 span.y { color: var(--accent-yellow); }
        h1 span.g { color: var(--accent-green); }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--accent-yellow);
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            box-sizing: border-box;
            font-family: monospace;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            flex: 1 1 30%;
            padding: 15px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover { opacity: 0.9; }
        button:disabled {
            background-color: #444 !important;
            color: #777 !important;
            cursor: not-allowed;
            transform: none;
        }

        #btnScan { background-color: var(--accent-yellow); color: #121212; }
        #btnReplace { background-color: var(--accent-green); color: #fff; }
        #btnUndo { background-color: var(--accent-red); color: #fff; }

        /* Fitur Dinamis - Disembunyikan secara default */
        #replaceSection {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
        }

        .log-container {
            margin-top: 30px;
            background: #000;
            border-left: 4px solid var(--accent-green);
            padding: 15px;
            height: 350px;
            overflow-y: auto;
            border-radius: 0 4px 4px 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .log-error { color: var(--accent-red); }
        .log-success { color: var(--accent-green); }
        .log-info { color: #2196F3; }
        .log-warn { color: var(--accent-yellow); }
    </style>
</head>
<body>

<div class="container">
    <h1>[ <span class="r">R</span><span class="y">Y</span><span class="g">G</span> File Replacer ]</h1>
    
    <div class="grid-2">
        <div class="form-group">
            <label for="token">GitHub API Token (PAT)</label>
            <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxx">
        </div>
        <div class="form-group">
            <label for="repo">Repository</label>
            <input type="text" id="repo" value="pembri/sairootsmusic.com">
        </div>
    </div>

    <div class="form-group">
        <label for="branch">Branch</label>
        <input type="text" id="branch" value="main">
    </div>

    <div class="form-group">
        <label for="oldText">Teks Lama (Yang Ingin Dicari)</label>
        <textarea id="oldText" rows="3" placeholder="Contoh: https://link.deezer.com/s/xxxx"></textarea>
    </div>

    <div class="button-group">
        <button id="btnScan">1. Scan Files (.html)</button>
        <button id="btnUndo" disabled>3. PANIC! Kembalikan Kode</button>
    </div>

    <div id="replaceSection">
        <div class="form-group">
            <label for="newText" style="color: var(--accent-green);">Teks Baru (Pengganti)</label>
            <textarea id="newText" rows="3" placeholder="Masukkan kode/teks penggantinya di sini..."></textarea>
        </div>
        <div class="button-group">
            <button id="btnReplace">2. Replace & Commit ke GitHub</button>
        </div>
    </div>

    <div class="log-container" id="logArea">Terminal siap. Sistem menggunakan localStorage untuk anti-refresh.</div>
</div>

<script>
    let filesReadyToUpdate = [];
    
    // UI Elements
    const UI = {
        token: document.getElementById('token'),
        repo: document.getElementById('repo'),
        branch: document.getElementById('branch'),
        oldText: document.getElementById('oldText'),
        newText: document.getElementById('newText'),
        btnScan: document.getElementById('btnScan'),
        btnReplace: document.getElementById('btnReplace'),
        btnUndo: document.getElementById('btnUndo'),
        logArea: document.getElementById('logArea'),
        replaceSection: document.getElementById('replaceSection')
    };

    // Auto-load Token & Cek Backup saat halaman dibuka/di-refresh
    window.onload = () => {
        const savedToken = localStorage.getItem('ryg_github_token');
        if (savedToken) UI.token.value = savedToken;

        const savedUndoData = localStorage.getItem('ryg_undo_backup');
        if (savedUndoData && JSON.parse(savedUndoData).length > 0) {
            UI.btnUndo.disabled = false;
            log('MENDETEKSI DATA BACKUP DI BROWSER! Tombol "PANIC" aktif. Jika sebelumnya ada replace yang salah, klik tombol tersebut untuk undo.', 'warn');
        }
    };

    function log(message, type = '') {
        const span = document.createElement('span');
        if(type) span.className = `log-${type}`;
        span.textContent = `[${new Date().toLocaleTimeString()}] ${message}\n`;
        UI.logArea.appendChild(span);
        UI.logArea.scrollTop = UI.logArea.scrollHeight;
    }

    // Encoder/Decoder Base64 UTF-8 (Aman untuk karakter khusus & emoji)
    function b64DecodeUnicode(str) {
        return decodeURIComponent(atob(str).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
    }
    function b64EncodeUnicode(str) {
        return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
            function toSolidBytes(match, p1) { return String.fromCharCode('0x' + p1); }));
    }

    async function apiRequest(endpoint, method = 'GET', body = null) {
        const headers = {
            'Authorization': `token ${UI.token.value.trim()}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
        };
        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);

        const response = await fetch(`https://api.github.com${endpoint}`, options);
        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.message || response.statusText);
        }
        return response.json();
    }

    // TAHAP 1: SCAN FILES
    UI.btnScan.addEventListener('click', async () => {
        const token = UI.token.value.trim();
        const repo = UI.repo.value.trim();
        const branch = UI.branch.value.trim();
        const oldText = UI.oldText.value;

        if (!token || !repo || !branch || !oldText) {
            log('Error: Token, Repo, Branch, dan Teks Lama harus diisi!', 'error');
            return;
        }

        // Simpan token ke localStorage
        localStorage.setItem('ryg_github_token', token);

        UI.replaceSection.style.display = 'none'; // Sembunyikan menu replace
        filesReadyToUpdate = [];
        UI.btnScan.disabled = true;
        UI.btnScan.textContent = "Scanning...";
        log(`\nMemulai scan di ${repo} (branch: ${branch})...`, 'info');

        try {
            const treeData = await apiRequest(`/repos/${repo}/git/trees/${branch}?recursive=1`);
            const htmlFiles = treeData.tree.filter(file => file.type === 'blob' && file.path.endsWith('.html'));
            
            let totalMatches = 0;

            for (const file of htmlFiles) {
                const fileData = await apiRequest(`/repos/${repo}/contents/${file.path}`);
                const content = b64DecodeUnicode(fileData.content);

                if (content.includes(oldText)) {
                    const matchCount = content.split(oldText).length - 1;
                    totalMatches += matchCount;

                    // Siapkan data gantung di memori
                    filesReadyToUpdate.push({
                        path: file.path,
                        oldSha: fileData.sha, 
                        originalContent: content // Ini untuk Undo nanti
                    });
                    log(`>> Ditemukan ${matchCount} kecocokan di: ${file.path}`, 'success');
                }
            }

            if (filesReadyToUpdate.length > 0) {
                log(`\nScan selesai. Teks ditemukan di ${filesReadyToUpdate.length} file.`, 'info');
                log(`Memunculkan Menu Replace...`, 'warn');
                // Tampilkan menu dinamis
                UI.replaceSection.style.display = 'block';
                // Jika mau replace, berarti data undo sebelumnya mending diamankan/direset dulu untuk sesi ini
                UI.btnUndo.disabled = true; 
            } else {
                log(`Scan selesai. Teks tidak ditemukan di file manapun.`, 'warn');
            }

        } catch (error) {
            log(`Error: ${error.message}`, 'error');
        } finally {
            UI.btnScan.disabled = false;
            UI.btnScan.textContent = "1. Scan Files (.html)";
        }
    });

    // TAHAP 2: REPLACE & COMMIT
    UI.btnReplace.addEventListener('click', async () => {
        const repo = UI.repo.value.trim();
        const branch = UI.branch.value.trim();
        const oldText = UI.oldText.value;
        const newText = UI.newText.value;
        
        UI.btnReplace.disabled = true;
        UI.btnScan.disabled = true;
        UI.btnReplace.textContent = "Committing to GitHub...";

        log(`\nMemulai proses Replace & Commit...`, 'info');
        
        let backupData = []; // Data yang akan disave ke localStorage

        for (const file of filesReadyToUpdate) {
            try {
                // Proses replace teks
                const replacedContent = file.originalContent.split(oldText).join(newText);
                const base64Content = b64EncodeUnicode(replacedContent);
                
                // Commit ke github
                const response = await apiRequest(`/repos/${repo}/contents/${file.path}`, 'PUT', {
                    message: `Auto-replace: Teks via HTML Replacer Tool`,
                    content: base64Content,
                    sha: file.oldSha,
                    branch: branch
                });
                
                // Simpan SHA yang BARU dari response github + KONTEN ASLI
                backupData.push({
                    path: file.path,
                    currentSha: response.content.sha, // Butuh SHA terbaru untuk nimpa ulang saat Undo
                    originalContent: file.originalContent
                });
                
                log(`>> Berhasil update: ${file.path}`, 'success');
            } catch (error) {
                log(`>> Gagal update ${file.path}: ${error.message}`, 'error');
            }
        }

        // Simpan backup ke localStorage sebagai pertahanan dari Refresh
        if (backupData.length > 0) {
            localStorage.setItem('ryg_undo_backup', JSON.stringify(backupData));
            log(`\nSELESAI! Data original otomatis dibackup di browser.`, 'warn');
            log(`Buka website sekarang. Kalau tampilannya hancur, klik tombol merah "PANIC! Kembalikan Kode" (Bahkan jika tab ini di-refresh, tombol tetap bisa dipakai).`, 'info');
            UI.btnUndo.disabled = false; // Aktifkan tombol sakti
        }
        
        UI.replaceSection.style.display = 'none'; // Sembunyikan form replace lagi
        filesReadyToUpdate = [];
        UI.btnScan.disabled = false;
        UI.btnReplace.textContent = "2. Replace & Commit ke GitHub";
    });

    // TAHAP 3: UNDO / PANIC KEMBALIKAN KODE
    UI.btnUndo.addEventListener('click', async () => {
        const confirmUndo = confirm("YAKIN UNDO? Kodingan web akan dikembalikan persis ke keadaan sebelum Replace terakhir dilakukan.");
        if (!confirmUndo) return;

        const repo = UI.repo.value.trim();
        const branch = UI.branch.value.trim();
        const savedData = localStorage.getItem('ryg_undo_backup');
        
        if (!savedData) {
            log("Tidak ada data backup ditemukan!", "error");
            return;
        }

        const undoQueue = JSON.parse(savedData);
        
        UI.btnUndo.disabled = true;
        UI.btnUndo.textContent = "Reverting...";
        log(`\nMemulai proses KEMBALIKAN KODE ASLI...`, 'error');

        for (const file of undoQueue) {
            try {
                const base64Content = b64EncodeUnicode(file.originalContent); 
                await apiRequest(`/repos/${repo}/contents/${file.path}`, 'PUT', {
                    message: `Auto-revert: Membatalkan perubahan dari HTML Replacer`,
                    content: base64Content,
                    sha: file.currentSha, // Pake SHA file yg sudah terganti di GitHub
                    branch: branch
                });
                log(`>> Berhasil mengembalikan file: ${file.path}`, 'success');
            } catch (error) {
                log(`>> Gagal mengembalikan ${file.path}: ${error.message}`, 'error');
            }
        }

        log(`\nPROSES UNDO SELESAI. Web sudah kembali seperti semula.`, 'info');
        
        // Bersihkan memori backup karena udah dibalikin
        localStorage.removeItem('ryg_undo_backup');
        UI.btnUndo.textContent = "3. PANIC! Kembalikan Kode";
    });
</script>

</body>
</html>

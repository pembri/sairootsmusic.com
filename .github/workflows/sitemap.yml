name: Generate Sitemap Otomatis

on:
  push:
    branches:
      - main # Ganti jadi 'master' jika branch utamamu bernama master
    paths:
      - '**/*.html' # Action ini cuma jalan kalau ada perubahan/penambahan file HTML
  workflow_dispatch: # Tombol manual buat nge-trigger action kapan saja

permissions:
  contents: write # Izin penting agar bot bisa push sitemap.xml ke repositori

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate sitemap.xml
        run: |
          cat << 'EOF' > generate_sitemap.py
          import os

          BASE_URL = "https://sairootsmusic.com"
          EXCLUDE_DIRS = ["admin_pages", ".git", ".github"]
          EXCLUDE_FILES = ["404.html"]

          urls = []
          for root, dirs, files in os.walk("."):
              # Hapus folder rahasia dari pencarian
              dirs[:] = [d for d in dirs if not any(d.startswith(ex) for ex in EXCLUDE_DIRS)]
              
              for file in files:
                  if file.endswith(".html") and file not in EXCLUDE_FILES:
                      filepath = os.path.relpath(os.path.join(root, file), ".")
                      
                      # Pengamanan lapis kedua: pastikan admin_pages benar-benar tidak masuk
                      if filepath.startswith("admin_pages/") or "admin_pages" in filepath:
                          continue

                      # Mengubah format jadi Clean URL (tanpa .html)
                      url_path = filepath.replace("\\", "/")
                      if url_path == "index.html":
                          url_path = ""
                      elif url_path.endswith("/index.html"):
                          url_path = url_path[:-11]
                      elif url_path.endswith(".html"):
                          url_path = url_path[:-5]

                      final_url = f"{BASE_URL}/{url_path}".rstrip('/')
                      if final_url == BASE_URL + "/":
                          final_url = BASE_URL
                          
                      urls.append(final_url)

          # Urutkan abjad biar sitemap rapi
          urls.sort()

          # Tulis ke file sitemap.xml
          with open("sitemap.xml", "w", encoding="utf-8") as f:
              f.write('<?xml version="1.0" encoding="UTF-8"?>\n')
              f.write('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n')
              for url in urls:
                  f.write('  <url>\n')
                  f.write(f'    <loc>{url}</loc>\n')
                  f.write('  </url>\n')
              f.write('</urlset>\n')
          EOF
          python3 generate_sitemap.py
          rm generate_sitemap.py

      - name: Commit & Push Sitemap
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          # Cek apakah ada perubahan, kalau ada baru commit & push
          git commit -m "Auto-update sitemap.xml (SEO Optimized) [skip ci]" || exit 0
          git push

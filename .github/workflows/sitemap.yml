name: Generate Sitemap Automated

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the repo
      uses: actions/checkout@v4

    - name: Generate Clean Sitemap
      run: |
        node -e "
        const fs = require('fs');
        const path = require('path');

        const baseUrl = 'https://sairootsmusic.com';
        const urls = [];

        // 1. Ambil semua file HTML kecuali admin_pages & 404
        function walk(dir) {
          let files = fs.readdirSync(dir);
          for (let f of files) {
            let fullPath = path.join(dir, f);
            if (fs.statSync(fullPath).isDirectory()) {
              // Blokir folder admin dan git
              if (f !== 'admin_pages' && f !== '.git' && f !== '.github' && f !== 'node_modules') {
                walk(fullPath);
              }
            } else if (f.endsWith('.html') && f !== '404.html') {
              let cleanPath = fullPath.replace(/\\/g, '/');
              // Buang .html dan /index
              let urlPath = cleanPath.replace(/\.html$/, '').replace(/\/index$/, '');
              if (urlPath === 'index') urlPath = ''; 
              urls.push(\`\${baseUrl}/\${urlPath}\`.replace(/\/$/, ''));
            }
          }
        }
        walk('.');

        // 2. Scan database.js untuk track lagu
        try {
          if (fs.existsSync('database.js')) {
            const db = fs.readFileSync('database.js', 'utf8');
            // Mencari pola title di dalam file
            const titleMatches = db.match(/title:\s*['\"](.+?)['\"]/g);
            if (titleMatches) {
              titleMatches.forEach(m => {
                const title = m.match(/['\"](.+?)['\"]/)[1];
                const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
                urls.push(\`\${baseUrl}/discography?track=\${slug}\`);
              });
            }
          }
        } catch (e) { console.log('Gagal scan track:', e.message); }

        // 3. Bangun XML dengan format yang benar
        const sitemapEntries = [...new Set(urls)].map(url => {
          const priority = url.includes('track=') ? '0.8' : (url === baseUrl ? '1.0' : '0.7');
          return \`  <url>\\n    <loc>\${url}</loc>\\n    <priority>\${priority}</priority>\\n  </url>\`;
        }).join('\\n');

        const xml = \`<?xml version=\"1.0\" encoding=\"UTF-8\"?>\\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\\n\${sitemapEntries}\\n</urlset>\`;
        
        fs.writeFileSync('sitemap.xml', xml);
        console.log('Sitemap Berhasil Dibuat: Bersih dari admin & 404, Track lagu masuk!');
        "

    - name: Commit and push changes
      run: |
        if [[ -n "$(git status --porcelain sitemap.xml)" ]]; then
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add sitemap.xml
          git commit -m "Fix Sitemap: Secure admin_pages, clean URLs, and auto-track sync"
          git push
        fi

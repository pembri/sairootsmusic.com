name: Generate Sitemap Automated

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the repo
      uses: actions/checkout@v4

    - name: Generate Clean Sitemap
      run: |
        node -e "
        const fs = require('fs');
        const path = require('path');

        const baseUrl = 'https://sairootsmusic.com';
        const urls = [];

        // 1. SCAN FILE FISIK (FILTER KETAT)
        function walk(dir) {
          const files = fs.readdirSync(dir);
          for (let f of files) {
            let fullPath = path.join(dir, f);
            if (fs.statSync(fullPath).isDirectory()) {
              // BLOKIR FOLDER ADMIN & SISTEM
              if (!['admin_pages', '.git', '.github', 'node_modules', 'asset_gambar', 'discography'].includes(f)) {
                walk(fullPath);
              }
            } else if (f.endsWith('.html')) {
              // TENDANG 404
              if (f === '404.html') continue;

              let cleanPath = fullPath.replace(/\\/g, '/');
              if (cleanPath.startsWith('./')) cleanPath = cleanPath.substring(2);
              
              // BANTAI .HTML DAN /INDEX
              let urlPath = cleanPath.replace(/\.html$/, '').replace(/\/index$/, '');
              if (urlPath === 'index') urlPath = ''; 
              
              urls.push(\`\${baseUrl}/\${urlPath}\`.replace(/\/$/, ''));
            }
          }
        }
        walk('.');

        // 2. SCAN TRACK DARI DATABASE.JS (LOGIKA JSON)
        try {
          if (fs.existsSync('database.js')) {
            const content = fs.readFileSync('database.js', 'utf8');
            // Ambil hanya bagian discography agar tidak campur dengan lirik/artikel
            const discoSection = content.match(/\"discography\":\s*\[([\s\S]*?)\]/);
            
            if (discoSection) {
              const titles = discoSection[1].match(/\"title\":\s*\"(.+?)\"/g);
              if (titles) {
                titles.forEach(t => {
                  const titleName = t.match(/\"title\":\s*\"(.+?)\"/)[1];
                  const slug = titleName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
                  urls.push(\`\${baseUrl}/discography?track=\${slug}\`);
                });
              }
            }
          }
        } catch (e) { console.log('Gagal scan track:', e.message); }

        // 3. RAKIT XML (UNIQUE)
        const sitemapEntries = [...new Set(urls)].map(url => {
          const priority = url.includes('?track=') ? '0.8' : (url === baseUrl ? '1.0' : '0.7');
          return \`  <url>\\n    <loc>\${url}</loc>\\n    <priority>\${priority}</priority>\\n  </url>\`;
        }).join('\\n');

        const xml = \`<?xml version=\"1.0\" encoding=\"UTF-8\"?>\\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\\n\${sitemapEntries}\\n</urlset>\`;
        
        fs.writeFileSync('sitemap.xml', xml);
        console.log('Sitemap Berhasil Dibuat!');
        "

    - name: Commit and push changes
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add sitemap.xml
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Sitemap Auto-Update: Bersih, Tanpa Admin, Track Terdeteksi"
          git push
        fi

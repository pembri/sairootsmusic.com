    <script src="/database.js"></script>
    <script>
        (function() {
            var btn = document.getElementById('menu-btn');
            var menu = document.getElementById('mobile-menu');
            var icon = document.getElementById('hamburger-icon');
            var sInp = document.getElementById('search-input');

            btn.addEventListener('click', function() {
                var isOpen = menu.classList.toggle('menu-open');
                if (isOpen) {
                    icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>';
                    icon.classList.add('text-rasta-yellow');
                    document.body.style.overflow = 'hidden';
                } else {
                    icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>';
                    icon.classList.remove('text-rasta-yellow');
                    document.body.style.overflow = 'auto';
                }
            });

            try {
                var fuse = new Fuse(searchData, { keys: ['title', 'excerpt', 'category'], threshold: 0.3 });
                sInp.addEventListener('input', function(e) {
                    var q = e.target.value;
                    var resDiv = document.getElementById('search-results');
                    var navDiv = document.getElementById('main-nav');
                    if(q.length < 2) { resDiv.classList.add('hidden'); navDiv.classList.remove('hidden'); return; }
                    var results = fuse.search(q);
                    navDiv.classList.add('hidden'); resDiv.classList.remove('hidden'); resDiv.innerHTML = '';
                    if(results.length === 0) { resDiv.innerHTML = '<div class="text-center py-10 text-gray-500 uppercase tracking-widest text-xs">No matching vibes found.</div>'; return; }
                    var html = '<div class="flex flex-col space-y-3 pb-8">';
                    results.forEach(function(r) {
                        html += '<a href="' + r.item.url + '" class="block bg-white/5 border border-white/10 p-5 hover:bg-white/10 transition-all text-left"><span class="text-[9px] uppercase tracking-widest text-gray-500">' + r.item.type + '</span><h4 class="text-xl font-display text-white mt-1">' + r.item.title + '</h4></a>';
                    });
                    html += '</div>';
                    resDiv.innerHTML = html;
                });
            } catch(err) { console.warn('Database not loaded yet.'); }
        })();
    </script>

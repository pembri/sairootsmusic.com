<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAI Roots Admin | Database Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0a0a0a; color: #e5e5e5; }
        .sai-card { background: #141414; border: 1px solid #262626; border-radius: 12px; }
        .tab-btn.active { border-bottom: 3px solid #ef4444; color: #ef4444; }
        .input-sai { background: #1f1f1f; border: 1px solid #333; border-radius: 8px; padding: 12px; color: white; width: 100%; outline: none; }
        .input-sai:focus { border-color: #ef4444; }
        .btn-save { background: #008000; transition: 0.3s; }
        .btn-save:hover { background: #006400; transform: translateY(-2px); }
    </style>
</head>
<body class="min-h-screen">

<div id="loginOverlay" class="fixed inset-0 bg-black z-50 flex items-center justify-center p-4">
    <div class="sai-card p-8 max-w-md w-full text-center">
        <h1 class="text-3xl font-bold text-red-600 mb-2">SAI ROOTS</h1>
        <p class="text-zinc-500 mb-6">Masukkan GitHub Classic Token untuk mengelola database</p>
        <input type="password" id="ghToken" placeholder="GitHub Token..." class="input-sai mb-4 text-center">
        <button onclick="login()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg uppercase tracking-widest">Login & Fetch Data</button>
        <p id="loginStatus" class="mt-4 text-xs text-zinc-600"></p>
    </div>
</div>

<div id="adminPanel" class="hidden">
    <nav class="bg-black border-b border-zinc-800 p-4 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <span class="text-xl font-bold text-red-600">SAI ROOTS <span class="text-white text-sm font-normal">Database Manager</span></span>
            <button onclick="logout()" class="text-zinc-400 hover:text-white text-sm"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <div class="flex space-x-6 mb-8 border-b border-zinc-800">
            <button onclick="switchTab('articles')" id="tab-articles" class="tab-btn pb-3 font-bold active">ARTICLES</button>
            <button onclick="switchTab('lyrics')" id="tab-lyrics" class="tab-btn pb-3 font-bold">LYRICS</button>
            <button onclick="switchTab('discography')" id="tab-discography" class="tab-btn pb-3 font-bold">DISCOGRAPHY</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <button onclick="prepareNew()" class="w-full mb-4 bg-zinc-800 hover:bg-zinc-700 p-3 rounded-lg font-bold text-sm">
                    <i class="fas fa-plus mr-2 text-green-500"></i> TAMBAH DATA BARU
                </button>
                <div id="dataList" class="space-y-2 overflow-y-auto max-h-[600px] pr-2">
                    </div>
            </div>

            <div class="lg:col-span-2">
                <div id="editorUI" class="sai-card p-6 sticky top-24">
                    <h3 id="editorTitle" class="text-lg font-bold mb-4 text-yellow-500">Pilih data untuk diedit</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2">
                            <label class="text-xs text-zinc-500 uppercase">ID / Slug (Unik)</label>
                            <input type="text" id="f_id" class="input-sai" placeholder="judul-lagu-baru">
                        </div>
                        <div>
                            <label class="text-xs text-zinc-500 uppercase">Judul</label>
                            <input type="text" id="f_title" class="input-sai">
                        </div>
                        <div>
                            <label class="text-xs text-zinc-500 uppercase">Kategori</label>
                            <input type="text" id="f_category" class="input-sai">
                        </div>
                        <div class="md:col-span-2">
                            <label class="text-xs text-zinc-500 uppercase">Image URL</label>
                            <input type="text" id="f_image" class="input-sai" value="/asset_gambar/default.jpg">
                        </div>
                        <div class="md:col-span-2">
                            <label class="text-xs text-zinc-500 uppercase">Kutipan / Excerpt</label>
                            <textarea id="f_excerpt" class="input-sai h-20"></textarea>
                        </div>
                        <div id="audioGroup" class="md:col-span-2 hidden">
                            <label class="text-xs text-zinc-500 uppercase">Audio Path (.mp3)</label>
                            <input type="text" id="f_audio" class="input-sai">
                        </div>
                    </div>

                    <div class="mt-6 flex space-x-4">
                        <button onclick="saveData()" class="flex-1 btn-save text-white font-bold py-3 rounded-lg">
                            <i class="fas fa-cloud-upload-alt mr-2"></i> UPDATE DATABASE
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const CONFIG = { owner: 'pembri', repo: 'sairootsmusic.com', path: 'database.js' };
let db = { articles: [], lyrics: [], discography: [] };
let currentTab = 'articles';
let currentSha = '';
let rawFileContent = '';
let editingId = null; 

async function login() {
    const token = document.getElementById('ghToken').value;
    const status = document.getElementById('loginStatus');
    if(!token) return;

    status.innerText = "Connecting to GitHub...";
    try {
        const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`, {
            headers: { 'Authorization': `token ${token}` }
        });
        const data = await res.json();
        if(res.ok) {
            currentSha = data.sha;
            rawFileContent = atob(data.content);
            parseDB(rawFileContent);
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            renderList();
        } else {
            status.innerText = "Token salah atau Repo tidak ditemukan.";
        }
    } catch (e) { status.innerText = "Error koneksi."; }
}

function parseDB(content) {
    const start = content.indexOf('const sairootsDB = {');
    const end = content.indexOf('};', start) + 2;
    const jsonStr = content.substring(start, end).replace('const sairootsDB = ', '').replace(';', '');
    db = JSON.parse(jsonStr);
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    document.getElementById('audioGroup').classList.toggle('hidden', tab !== 'discography');
    editingId = null;
    renderList();
    prepareNew();
}

function renderList() {
    const listContainer = document.getElementById('dataList');
    listContainer.innerHTML = '';
    db[currentTab].forEach(item => {
        const div = document.createElement('div');
        div.className = "p-3 bg-zinc-900 border border-zinc-800 rounded-lg hover:border-red-600 cursor-pointer transition flex justify-between items-center";
        div.innerHTML = `<div><div class="font-bold text-sm">${item.title}</div><div class="text-[10px] text-zinc-500">${item.id}</div></div> <i class="fas fa-chevron-right text-zinc-700"></i>`;
        div.onclick = () => loadToEditor(item);
        listContainer.appendChild(div);
    });
}

function loadToEditor(item) {
    editingId = item.id;
    document.getElementById('editorTitle').innerText = "Edit: " + item.title;
    document.getElementById('f_id').value = item.id;
    document.getElementById('f_title').value = item.title;
    document.getElementById('f_category').value = item.category;
    document.getElementById('f_image').value = item.image;
    document.getElementById('f_excerpt').value = item.excerpt || "";
    if(item.audio) document.getElementById('f_audio').value = item.audio;
}

function prepareNew() {
    editingId = "NEW";
    document.getElementById('editorTitle').innerText = "Tambah Data Baru ke " + currentTab.toUpperCase();
    document.getElementById('f_id').value = "";
    document.getElementById('f_title').value = "";
    document.getElementById('f_category').value = currentTab === 'lyrics' ? 'Album - Critical Fire' : '';
    document.getElementById('f_image').value = "/asset_gambar/default.jpg";
    document.getElementById('f_excerpt').value = "";
    if(document.getElementById('f_audio')) document.getElementById('f_audio').value = "";
}

async function saveData() {
    const token = document.getElementById('ghToken').value;
    const newData = {
        id: document.getElementById('f_id').value,
        title: document.getElementById('f_title').value,
        category: document.getElementById('f_category').value,
        image: document.getElementById('f_image').value,
        excerpt: document.getElementById('f_excerpt').value
    };
    if(currentTab === 'discography') newData.audio = document.getElementById('f_audio').value;

    if(editingId === "NEW") {
        db[currentTab].push(newData);
    } else {
        const idx = db[currentTab].findIndex(i => i.id === editingId);
        db[currentTab][idx] = newData;
    }

    // Rakit ulang
    const dbString = `const sairootsDB = ${JSON.stringify(db, null, 4)};`;
    const startStr = "// === PUSAT DATA SAI ROOTS ===";
    const endStr = "// === DATA PENCARIAN GLOBAL (FUSE.JS) ===";
    const parts = rawFileContent.split(startStr);
    const tailParts = rawFileContent.split(endStr);
    
    const finalContent = `${startStr}\n// File ini akan di-update otomatis oleh admin_post.html\n\n${dbString}\n\n${endStr}${tailParts[1]}`;

    try {
        const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`, {
            method: 'PUT',
            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: `Update ${currentTab}: ${newData.title}`,
                content: btoa(unescape(encodeURIComponent(finalContent))),
                sha: currentSha
            })
        });
        if(res.ok) {
            alert("Data Berhasil Disimpan!");
            location.reload();
        }
    } catch (e) { alert("Error saving data."); }
}

function logout() { location.reload(); }
</script>
</body>
</html>

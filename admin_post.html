<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SAI Roots</title>
    <link rel="canonical" href="https://sairootsmusic.com/" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-main { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .admin-card { background: var(--card-bg); padding: 25px; border-radius: 15px; border: 1px solid #333; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        label { color: var(--reggae-yellow); font-weight: bold; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: white; border-radius: 5px; }
        #editor-container { height: 300px; background: white; color: black; border-radius: 0 0 5px 5px; }
        
        .btn-action { padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 10px; }
        .btn-publish { background: var(--reggae-red); color: white; }
        .btn-edit { background: var(--reggae-green); color: white; margin-top: 20px; }
        
        /* List Management */
        .post-list-item { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--reggae-yellow); }
        .post-actions button { background: none; border: none; color: white; cursor: pointer; margin-left: 10px; font-size: 1.1rem; }
        .btn-del-icon { color: var(--reggae-red) !important; }
        .btn-edit-icon { color: var(--reggae-green) !important; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo"><span>SAI ROOTS ADMIN</span></div>
            <div class="menu-toggle" id="mobile-menu"><i class="fas fa-bars"></i></div>
        </div>
        <nav class="nav-menu" id="nav-menu">
            <ul>
                <li><a href="index.html">WEBSITE</a></li>
                <li><a href="#" onclick="location.reload()">REFRESH DATA</a></li>
            </ul>
        </nav>
    </header>

    <main class="admin-main">
        <div class="admin-card">
            <h2 id="form-title" style="color:var(--reggae-green)">Post Baru</h2>
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <label>Tipe Konten</label>
                <select id="post-type">
                    <option value="articles">Article</option>
                    <option value="music">Music / Discography</option>
                    <option value="lyrics">Lyrics</option>
                </select>
            </div>
            <div class="form-group">
                <label>Judul</label>
                <input type="text" id="post-title" placeholder="Judul konten...">
            </div>
            <div class="form-group">
                <label>File Path Gambar (Contoh: img/album1.jpg)</label>
                <input type="text" id="post-image" placeholder="img/nama-file.jpg">
            </div>
            <div class="form-group" id="audio-group" style="display:none;">
                <label>File Path MP3 (Contoh: mp3/lagu.mp3)</label>
                <input type="text" id="post-audio" placeholder="mp3/nama-file.mp3">
            </div>
            <div class="form-group">
                <label>Isi Konten</label>
                <div id="editor-container"></div>
            </div>
            <div class="form-group">
                <label>GitHub Token (PAT)</label>
                <input type="password" id="gh-token" placeholder="GitHub Personal Access Token">
            </div>
            <button class="btn-action btn-publish" id="publish-btn">PUBLISH KE GITHUB</button>
            <div id="status-msg" style="margin-top:10px; text-align:center; display:none; padding:10px; border-radius:5px;"></div>
        </div>

        <div class="admin-card">
            <h2 style="color:var(--reggae-yellow)">Kelola Konten</h2>
            <div id="manage-list">Memuat data...</div>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-links streaming">
                <a href="https://open.spotify.com/artist/0xOPCtZvhXVd9RTbU1aYTr" target="_blank"><i class="fab fa-spotify"></i></a>
                <a href="https://music.youtube.com/channel/UC2EfMkjDMG9LTWfc1llL4AQ" target="_blank"><i class="fab fa-youtube"></i></a>
                <a href="https://music.apple.com/id/artist/sai-roots/1892187423?l=id" target="_blank"><i class="fab fa-apple"></i></a>
                <a href="https://m.soundcloud.com/sairoots" target="_blank"><i class="fab fa-soundcloud"></i></a>
                <a href="https://link.deezer.com/s/3366qh6efN8QoSqSPCEsB" target="_blank"><i class="fab fa-deezer"></i></a>
                <a href="https://music.amazon.com/artists/B0GTFWNC32/sai-roots" target="_blank"><i class="fab fa-amazon"></i></a>
            </div>
            <div class="footer-links socials">
                <a href="https://www.youtube.com/@sairoots" target="_blank"><i class="fab fa-youtube"></i></a>
                <a href="https://instagram.com/ahmadsupembri" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://tiktok.com/@ahmadsupembri" target="_blank"><i class="fab fa-tiktok"></i></a>
                <a href="https://facebook.com/ahmadsupembri" target="_blank"><i class="fab fa-facebook"></i></a>
            </div>
            <div class="footer-bottom"><p>© 2026 SAI Roots Music.</p></div>
        </div>
    </footer>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="admin.js"></script>
    <script>
        var quill = new Quill('#editor-container', { theme: 'snow' });
        document.getElementById('post-type').addEventListener('change', function() {
            document.getElementById('audio-group').style.display = (this.value === 'music') ? 'block' : 'none';
        });
    </script>
</body>
</html>

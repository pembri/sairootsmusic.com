<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SAI Roots</title>

    <link rel="canonical" href="https://sairootsmusic.com/" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .admin-main { max-width: 900px; margin: 0 auto; padding: 20px; }
        .admin-card { background: var(--card-bg); padding: 25px; border-radius: 15px; border: 1px solid #333; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--reggae-yellow); font-weight: bold; }
        input, select { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; outline: none; }
        
        /* Editor Style */
        #editor-container { height: 350px; background: white; color: black; border-radius: 0 0 8px 8px; }
        .ql-toolbar { background: #ddd; border-radius: 8px 8px 0 0; }
        
        .btn-publish { background: var(--reggae-red); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px; }
        .btn-publish:hover { background: var(--reggae-green); transform: scale(1.02); }
        .btn-publish:disabled { background: #555; cursor: not-allowed; }

        .status-msg { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; text-align: center; font-weight: bold; }
        .success { background: var(--reggae-green); color: white; }
        .error { background: var(--reggae-red); color: white; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">
                <img src="https://raw.githubusercontent.com/sairootsmusic/sairootsmusic.com/refs/heads/main/android-chrome-192x192.png" alt="SAI Roots Logo">
                <span>SAI ROOTS ADMIN</span>
            </div>
            <div class="menu-toggle" id="mobile-menu"><i class="fas fa-bars"></i></div>
        </div>
        <nav class="nav-menu" id="nav-menu">
            <ul>
                <li><a href="index.html">LIHAT WEBSITE</a></li>
                <li><a href="article.html">ARTICLE</a></li>
                <li><a href="discography.html">DISCOGRAPHY</a></li>
                <li><a href="lyric.html">LYRIC</a></li>
            </ul>
        </nav>
    </header>

    <main class="admin-main">
        <div class="admin-card">
            <h2 style="color: var(--reggae-green); margin-bottom: 20px;"><i class="fas fa-cloud-upload-alt"></i> Upload New Content</h2>
            
            <div class="form-group">
                <label>Tipe Konten</label>
                <select id="post-type">
                    <option value="articles">Artikel / Berita</option>
                    <option value="music">Discography (Lagu/Album)</option>
                    <option value="lyrics">Lirik Lagu</option>
                </select>
            </div>

            <div class="form-group">
                <label>Judul</label>
                <input type="text" id="post-title" placeholder="Masukkan judul...">
            </div>

            <div class="form-group">
                <label id="label-file-cover">Upload Cover / Gambar Artikel</label>
                <input type="file" id="file-cover" accept="image/*">
            </div>

            <div class="form-group" id="music-upload-group" style="display:none;">
                <label>Upload File MP3 (Khusus Discography)</label>
                <input type="file" id="file-audio" accept="audio/mpeg">
            </div>

            <div class="form-group">
                <label>Isi Konten / Deskripsi / Lirik</label>
                <div id="editor-container"></div>
            </div>

            <div class="form-group">
                <label>GitHub Personal Access Token</label>
                <input type="password" id="gh-token" placeholder="Tempel token PAT lo di sini">
            </div>

            <button type="button" class="btn-publish" id="publish-btn">
                <i class="fas fa-paper-plane"></i> PUBLISH KE GITHUB
            </button>
            
            <div id="status-msg" class="status-msg"></div>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-links streaming">
                <a href="https://open.spotify.com/artist/0xOPCtZvhXVd9RTbU1aYTr" target="_blank"><i class="fab fa-spotify"></i></a>
                <a href="https://music.youtube.com/channel/UC2EfMkjDMG9LTWfc1llL4AQ" target="_blank"><i class="fab fa-youtube"></i></a>
                <a href="https://music.apple.com/id/artist/sai-roots/1892187423?l=id" target="_blank"><i class="fab fa-apple"></i></a>
                <a href="https://m.soundcloud.com/sairoots" target="_blank"><i class="fab fa-soundcloud"></i></a>
                <a href="https://link.deezer.com/s/3366qh6efN8QoSqSPCEsB" target="_blank"><i class="fab fa-deezer"></i></a>
                <a href="https://music.amazon.com/artists/B0GTFWNC32/sai-roots" target="_blank"><i class="fab fa-amazon"></i></a>
            </div>
            <div class="footer-links socials">
                <a href="https://www.youtube.com/@sairoots" target="_blank"><i class="fab fa-youtube"></i></a>
                <a href="https://instagram.com/ahmadsupembri" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://tiktok.com/@ahmadsupembri" target="_blank"><i class="fab fa-tiktok"></i></a>
                <a href="https://facebook.com/ahmadsupembri" target="_blank"><i class="fab fa-facebook"></i></a>
            </div>
            <div class="footer-bottom"><p>© 2026 SAI Roots Music.</p></div>
        </div>
    </footer>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="main.js"></script>
    <script src="admin.js"></script>
    <script>
        var quill = new Quill('#editor-container', {
            theme: 'snow',
            modules: { toolbar: [[{'header': [1, 2, false]}], ['bold', 'italic'], ['image', 'link'], [{'list': 'ordered'}, {'list': 'bullet'}]] }
        });

        document.getElementById('post-type').addEventListener('change', function() {
            const musicGroup = document.getElementById('music-upload-group');
            musicGroup.style.display = (this.value === 'music') ? 'block' : 'none';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAI Roots CMS | Admin Panel</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: { 
                    colors: { 
                        rasta: { green: '#2D8659', yellow: '#FBBF24', red: '#DC2626' }, 
                        neutral: { 950: '#050505' } 
                    }, 
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        display: ['Anton', 'sans-serif'] 
                    } 
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #f0f0f0; }
        .ql-toolbar.ql-snow { border-color: rgba(255,255,255,0.1); background-color: #111; }
        .ql-container.ql-snow { 
            border-color: rgba(255,255,255,0.1); 
            background-color: #0a0a0a; 
            color: white; 
            min-height: 320px; 
            font-family: 'Inter', sans-serif; 
        }
        .ql-snow .ql-stroke { stroke: #ccc; }
        .ql-snow .ql-fill { fill: #ccc; }
        .ql-snow .ql-picker { color: #ccc; }

        .tab-main-active { border-bottom: 3px solid #2D8659; color: #2D8659; font-weight: 700; }
        .tab-sub-active { border-bottom: 3px solid #FBBF24; color: #FBBF24; font-weight: 700; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #FBBF24; }
    </style>
</head>
<body class="font-sans antialiased selection:bg-rasta-yellow selection:text-black">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-neutral-950 flex flex-col items-center justify-center p-6">
        <div class="bg-neutral-900 border border-white/10 p-8 md:p-12 rounded-3xl shadow-2xl w-full max-w-md text-center">
            <img src="https://raw.githubusercontent.com/sairootsmusic/sairootsmusic.com/refs/heads/main/android-chrome-192x192.png" 
                 alt="Logo" class="w-20 h-20 mx-auto rounded-full border-2 border-white/10 mb-6">
            <h1 class="text-4xl font-display uppercase tracking-widest mb-2 text-white">SAI Roots <span class="text-rasta-green">CMS</span></h1>
            <p class="text-gray-500 text-sm mb-8">Authorised Personnel Only</p>
            
            <div class="text-left mb-6">
                <label class="block text-xs text-gray-400 uppercase tracking-widest mb-2">GitHub Token (PAT)</label>
                <input type="password" id="github-pat" 
                       class="w-full bg-black border border-white/10 px-5 py-4 text-white focus:outline-none focus:border-rasta-green transition rounded-2xl text-center font-mono"
                       placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
            </div>
            
            <button onclick="login()" 
                    class="w-full bg-white/10 hover:bg-rasta-green hover:text-white transition py-4 font-bold uppercase tracking-widest text-sm rounded-2xl">
                Masuk Sistem
            </button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-screen" class="hidden container mx-auto p-4 md:p-8 max-w-6xl">

        <div class="flex justify-between items-center mb-8 bg-neutral-900 border border-white/10 p-5 rounded-3xl">
            <h1 class="text-2xl font-display uppercase tracking-widest text-white">Dashboard <span class="text-rasta-yellow">Manager</span></h1>
            <button onclick="logout()" class="text-xs text-gray-500 hover:text-rasta-red uppercase tracking-widest font-bold flex items-center gap-2">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <div id="global-status" class="hidden mb-6 p-4 border text-center text-sm font-bold uppercase tracking-widest rounded-3xl"></div>

        <!-- Main Tabs -->
        <div class="flex border-b border-white/10 mb-8 uppercase text-sm font-bold tracking-widest">
            <button onclick="switchMainTab('create')" id="tab-main-create" class="tab-main-active flex-1 py-4 hover:bg-white/5 transition">Buat / Posting</button>
            <button onclick="switchMainTab('manage')" id="tab-main-manage" class="flex-1 py-4 text-gray-500 hover:bg-white/5 transition">Kelola Data</button>
        </div>

        <!-- CREATE SECTION -->
        <div id="section-create" class="bg-neutral-900 border border-white/10 p-6 md:p-8 rounded-3xl shadow-xl">
            
            <div class="flex gap-6 border-b border-white/10 mb-8 uppercase text-xs font-bold tracking-widest">
                <button onclick="switchSubTab('article')" id="tab-sub-article" class="tab-sub-active pb-3 px-4 hover:text-white transition">Artikel</button>
                <button onclick="switchSubTab('lyric')" id="tab-sub-lyric" class="text-gray-500 pb-3 px-4 hover:text-white transition">Lirik</button>
                <button onclick="switchSubTab('music')" id="tab-sub-music" class="text-gray-500 pb-3 px-4 hover:text-white transition">Musik (MP3)</button>
            </div>

            <div class="space-y-6">
                <div id="edit-alert" class="hidden bg-rasta-yellow/20 border border-rasta-yellow/50 text-rasta-yellow p-4 rounded-2xl flex justify-between items-center">
                    <span><i class="fas fa-edit mr-2"></i> Mode Edit Sedang Aktif</span>
                    <button onclick="cancelEdit()" class="px-4 py-2 bg-black/60 hover:bg-black text-xs rounded-xl border border-rasta-yellow/30">Batal Edit</button>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 uppercase tracking-widest mb-2">Judul</label>
                    <input type="text" id="input-title" class="w-full bg-black border border-white/10 px-5 py-4 text-white focus:outline-none focus:border-rasta-yellow rounded-2xl" placeholder="Masukkan judul...">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs text-gray-400 uppercase tracking-widest mb-2">Kategori / Genre</label>
                        <input type="text" id="input-category" class="w-full bg-black border border-white/10 px-5 py-4 text-white focus:outline-none focus:border-rasta-yellow rounded-2xl" placeholder="Cth: Roots, New Release...">
                    </div>
                    <div id="color-wrapper">
                        <label class="block text-xs text-gray-400 uppercase tracking-widest mb-2">Warna Tema (Khusus Artikel)</label>
                        <select id="input-color" class="w-full bg-black border border-white/10 px-5 py-4 text-white focus:outline-none focus:border-rasta-yellow rounded-2xl">
                            <option value="green">Hijau (Rasta Green)</option>
                            <option value="yellow">Kuning (Rasta Yellow)</option>
                            <option value="red">Merah (Rasta Red)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 uppercase tracking-widest mb-2">Deskripsi Singkat (Excerpt)</label>
                    <textarea id="input-excerpt" class="w-full bg-black border border-white/10 px-5 py-4 text-white focus:outline-none focus:border-rasta-yellow h-24 resize-none rounded-2xl" placeholder="Deskripsi pendek untuk list..."></textarea>
                </div>

                <!-- Upload Area -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-6 border border-white/10 bg-black rounded-3xl">
                    <div>
                        <label class="block text-xs text-gray-400 uppercase tracking-widest mb-2"><i class="fas fa-image mr-2"></i>Upload Cover/Gambar</label>
                        <input type="file" id="input-image" accept="image/*" 
                               class="w-full text-sm text-gray-400 file:mr-4 file:py-3 file:px-6 file:border-0 file:text-xs file:font-bold file:bg-white/10 file:text-white hover:file:bg-white/20 rounded-xl">
                        <p id="edit-img-note" class="hidden text-[10px] text-gray-500 mt-2">* Kosongkan jika tidak ingin mengubah gambar lama</p>
                    </div>
                    
                    <div id="music-upload-section" class="hidden">
                        <label class="block text-xs text-rasta-yellow uppercase tracking-widest mb-2"><i class="fas fa-music mr-2"></i>Upload File MP3</label>
                        <input type="file" id="input-audio" accept="audio/mp3,audio/mpeg" 
                               class="w-full text-sm text-gray-400 file:mr-4 file:py-3 file:px-6 file:border-0 file:text-xs file:font-bold file:bg-rasta-yellow/20 file:text-rasta-yellow hover:file:bg-rasta-yellow/30 rounded-xl">
                        <p id="edit-audio-note" class="hidden text-[10px] text-gray-500 mt-2">* Kosongkan jika tidak ingin mengubah MP3 lama</p>
                        <p id="audio-size-info" class="text-[10px] text-gray-500 mt-1"></p>
                    </div>
                </div>

                <div id="editor-section">
                    <label class="block text-xs text-gray-400 uppercase tracking-widest mb-2">Isi Konten (Artikel / Lirik)</label>
                    <div id="quill-editor"></div>
                </div>

                <button onclick="publishData()" id="btn-publish" 
                        class="w-full py-5 bg-rasta-green hover:bg-green-700 text-white font-display uppercase tracking-widest text-xl transition rounded-3xl flex items-center justify-center gap-3">
                    <i class="fas fa-rocket"></i>
                    <span id="publish-text">Publish Konten</span>
                </button>
            </div>
        </div>

        <!-- MANAGE SECTION -->
        <div id="section-manage" class="hidden space-y-8">
            <button onclick="loadDatabaseManage()" 
                    class="bg-white/10 hover:bg-white/20 text-white px-6 py-3 rounded-2xl text-sm font-bold uppercase tracking-widest">
                <i class="fas fa-sync-alt mr-2"></i> Refresh Data
            </button>

            <div class="bg-neutral-900 border border-white/10 rounded-3xl overflow-hidden">
                <div class="bg-black/60 p-5 border-b border-white/10"><h3 class="text-rasta-green font-display uppercase tracking-widest text-xl">Daftar Artikel</h3></div>
                <div class="p-5" id="list-articles"><p class="text-gray-500 text-sm italic">Memuat data...</p></div>
            </div>

            <div class="bg-neutral-900 border border-white/10 rounded-3xl overflow-hidden">
                <div class="bg-black/60 p-5 border-b border-white/10"><h3 class="text-rasta-red font-display uppercase tracking-widest text-xl">Daftar Lirik</h3></div>
                <div class="p-5" id="list-lyrics"><p class="text-gray-500 text-sm italic">Memuat data...</p></div>
            </div>

            <div class="bg-neutral-900 border border-white/10 rounded-3xl overflow-hidden">
                <div class="bg-black/60 p-5 border-b border-white/10"><h3 class="text-rasta-yellow font-display uppercase tracking-widest text-xl">Daftar Musik (MP3)</h3></div>
                <div class="p-5" id="list-music"><p class="text-gray-500 text-sm italic">Memuat data...</p></div>
            </div>
        </div>
    </div>

    <script>
        const REPO = 'pembri/sairootsmusic.com';
        let quill;
        let currentMainTab = 'create';
        let currentSubTab = 'article';
        
        let isEditMode = false;
        let editId = null;
        let editOriginalData = null;
        let cachedDB = null;

        window.onload = function() {
            quill = new Quill('#quill-editor', {
                theme: 'snow',
                modules: { 
                    toolbar: [
                        ['bold', 'italic', 'underline', 'strike'],
                        ['blockquote'],
                        [{ 'header': [1, 2, 3, false] }],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        [{ 'align': [] }],
                        ['link']
                    ]
                }
            });

            if (localStorage.getItem('github_pat')) {
                document.getElementById('github-pat').value = localStorage.getItem('github_pat');
                login();
            }
        };

        // ==================== LOGIN ====================
        function login() {
            const token = document.getElementById('github-pat').value.trim();
            if (token.length < 15) {
                alert('Token GitHub tidak valid! Minimal 15 karakter.');
                return;
            }
            localStorage.setItem('github_pat', token);
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            loadDatabaseManage();
        }

        function logout() {
            if (confirm('Yakin ingin logout?')) {
                localStorage.removeItem('github_pat');
                location.reload();
            }
        }

        // ==================== TABS ====================
        function switchMainTab(tab) {
            currentMainTab = tab;
            document.getElementById('tab-main-create').className = `flex-1 py-4 transition ${tab === 'create' ? 'tab-main-active' : 'text-gray-500 hover:bg-white/5'}`;
            document.getElementById('tab-main-manage').className = `flex-1 py-4 transition ${tab === 'manage' ? 'tab-main-active' : 'text-gray-500 hover:bg-white/5'}`;
            
            document.getElementById('section-create').classList.toggle('hidden', tab !== 'create');
            document.getElementById('section-manage').classList.toggle('hidden', tab !== 'manage');

            if (tab === 'manage') loadDatabaseManage();
        }

        function switchSubTab(tab) {
            if (isEditMode) return;
            currentSubTab = tab;

            ['article', 'lyric', 'music'].forEach(t => {
                const el = document.getElementById('tab-sub-' + t);
                if (el) el.className = `pb-3 px-4 transition ${t === tab ? 'tab-sub-active' : 'text-gray-500 hover:text-white'}`;
            });

            const isMusic = tab === 'music';
            document.getElementById('editor-section').classList.toggle('hidden', isMusic);
            document.getElementById('music-upload-section').classList.toggle('hidden', !isMusic);
            document.getElementById('color-wrapper').classList.toggle('hidden', tab !== 'article');
        }

        function showStatus(msg, type = 'info') {
            const el = document.getElementById('global-status');
            el.classList.remove('hidden', 'bg-rasta-green/20', 'text-rasta-green', 'border-rasta-green',
                                'bg-rasta-red/20', 'text-rasta-red', 'border-rasta-red',
                                'bg-rasta-yellow/20', 'text-rasta-yellow', 'border-rasta-yellow');

            if (type === 'success') el.classList.add('bg-rasta-green/20', 'text-rasta-green', 'border-rasta-green');
            else if (type === 'error') el.classList.add('bg-rasta-red/20', 'text-rasta-red', 'border-rasta-red');
            else el.classList.add('bg-rasta-yellow/20', 'text-rasta-yellow', 'border-rasta-yellow');

            el.innerText = msg;
            if (type === 'success') setTimeout(() => el.classList.add('hidden'), 6000);
        }

        // ==================== GITHUB API ====================
        async function fetchGitHub(path, method = 'GET', body = null, sha = null) {
            const token = localStorage.getItem('github_pat');
            if (!token) throw new Error("Token GitHub tidak ditemukan. Silakan login kembali.");

            const headers = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' };
            const opts = { method, headers };
            if (body) {
                if (sha) body.sha = sha;
                opts.body = JSON.stringify(body);
            }

            const res = await fetch(`https://api.github.com/repos/\( {REPO}/contents/ \){path}`, opts);
            if (!res.ok && res.status !== 404) throw new Error(`GitHub Error ${res.status}: ${await res.text()}`);
            return res.status === 404 ? null : await res.json();
        }

        async function uploadFile(path, base64Content, message) {
            const existing = await fetchGitHub(path);
            const body = { message, content: base64Content, sha: existing ? existing.sha : undefined };
            await fetchGitHub(path, 'PUT', body);
            return `/${path}`;
        }

        async function deleteFile(path, message) {
            const existing = await fetchGitHub(path);
            if (!existing) return;
            await fetch(`https://api.github.com/repos/\( {REPO}/contents/ \){path}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('github_pat')}`, 'Accept': 'application/vnd.github.v3+json' },
                body: JSON.stringify({ message, sha: existing.sha })
            });
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                if (file.size > 45 * 1024 * 1024) {
                    reject(new Error("Ukuran file maksimal 45 MB"));
                    return;
                }
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = () => reject(new Error("Gagal membaca file"));
                reader.readAsDataURL(file);
            });
        }

        function strToBase64(str) { return btoa(unescape(encodeURIComponent(str))); }
        function base64ToStr(b64) { return decodeURIComponent(escape(atob(b64))); }

        // ==================== LOAD DATABASE ====================
        async function loadDatabaseManage() {
            try {
                const dbRes = await fetchGitHub('database.js');
                if (!dbRes) throw new Error("database.js tidak ditemukan!");

                const dbContent = base64ToStr(dbRes.content);
                const match = dbContent.match(/const sairootsDB = ([\s\S]*?);\s*\/\//);
                if (!match) throw new Error("Format database.js tidak sesuai");

                cachedDB = eval('(' + match[1] + ')');

                renderList('list-articles', cachedDB.articles || [], 'article');
                renderList('list-lyrics', cachedDB.lyrics || [], 'lyric');
                renderList('list-music', cachedDB.discography || [], 'music');
            } catch (err) {
                console.error(err);
                showStatus("Gagal memuat database: " + err.message, "error");
            }
        }

        function renderList(containerId, items, type) {
            const container = document.getElementById(containerId);
            if (items.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm italic">Belum ada data.</p>';
                return;
            }

            let html = '<div class="space-y-3">';
            items.forEach(item => {
                html += `
                    <div class="flex items-center justify-between bg-black border border-white/10 p-4 rounded-2xl hover:border-white/30 transition">
                        <div class="flex items-center gap-4">
                            <img src="${item.image}" class="w-12 h-12 object-cover rounded-lg grayscale brightness-75">
                            <div>
                                <h4 class="text-white font-medium">${item.title}</h4>
                                <span class="text-xs text-gray-500">${item.category}</span>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="startEdit('\( {type}', ' \){item.id}')" class="px-4 py-2 bg-white/10 hover:bg-rasta-yellow hover:text-black rounded-xl text-xs font-bold transition"><i class="fas fa-edit"></i></button>
                            <button onclick="executeDelete('\( {type}', ' \){item.id}', '${item.title}')" class="px-4 py-2 bg-white/10 hover:bg-rasta-red hover:text-white rounded-xl text-xs font-bold transition"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        // ==================== DELETE ====================
        async function executeDelete(type, id, title) {
            if (!confirm(`YAKIN menghapus "${title}" secara permanen?`)) return;

            try {
                showStatus(`Menghapus ${title}...`, "info");
                // (Kode delete lengkap tetap sama seperti versi lama, hanya ditambahkan error handling)
                const dbRes = await fetchGitHub('database.js');
                let dbContent = base64ToStr(dbRes.content);
                let dbMatch = dbContent.match(/const sairootsDB = ([\s\S]*?);\s*\/\//);
                let dbObj = eval('(' + dbMatch[1] + ')');

                if (type === 'article') dbObj.articles = dbObj.articles.filter(a => a.id !== id);
                if (type === 'lyric') dbObj.lyrics = dbObj.lyrics.filter(a => a.id !== id);
                if (type === 'music') dbObj.discography = dbObj.discography.filter(a => a.id !== id);

                const newDbString = `// === PUSAT DATA SAI ROOTS ===\n// File ini akan di-update otomatis oleh admin_post.html\n\nconst sairootsDB = ${JSON.stringify(dbObj, null, 4)};\n\n// === DATA PENCARIAN GLOBAL (FUSE.JS) ===\nconst searchData = [\n    ...sairootsDB.articles.map(a => ({ type: "Article", title: a.title, url: \`/article/\${a.id}\`, excerpt: a.excerpt, category: a.category })),\n    ...sairootsDB.lyrics.map(l => ({ type: "Lyric", title: \`\${l.title} (Lyrics)\`, url: \`/lyric/\${l.id}\`, excerpt: l.excerpt, category: l.category })),\n    ...sairootsDB.discography.map(d => ({ type: "Discography", title: d.title, url: \`/discography/\${d.id}\`, excerpt: d.excerpt, category: d.category }))\n];`;

                await uploadFile('database.js', strToBase64(newDbString), `Deleted ${title}`);

                if (type === 'article') await deleteFile(`article/${id}/index.html`, `Delete article ${title}`);
                if (type === 'lyric') await deleteFile(`lyric/${id}/index.html`, `Delete lyric ${title}`);
                if (type === 'music') await deleteFile(`discography/${id}.mp3`, `Delete MP3 ${title}`);

                showStatus(`Berhasil menghapus "${title}"`, "success");
                loadDatabaseManage();
            } catch (e) {
                showStatus("Gagal menghapus: " + e.message, "error");
            }
        }

        // ==================== EDIT ====================
        async function startEdit(type, id) {
            isEditMode = true;
            editId = id;

            let arr = type === 'article' ? cachedDB.articles : type === 'lyric' ? cachedDB.lyrics : cachedDB.discography;
            editOriginalData = arr.find(item => item.id === id);
            if (!editOriginalData) return alert('Data tidak ditemukan!');

            switchMainTab('create');
            switchSubTab(type);

            document.getElementById('edit-alert').classList.remove('hidden');
            document.getElementById('input-title').value = editOriginalData.title;
            document.getElementById('input-category').value = editOriginalData.category;
            document.getElementById('input-excerpt').value = editOriginalData.excerpt || '';

            if (type === 'article' && editOriginalData.color) {
                document.getElementById('input-color').value = editOriginalData.color;
            }

            document.getElementById('edit-img-note').classList.remove('hidden');
            document.getElementById('edit-audio-note').classList.remove('hidden');

            const btn = document.getElementById('btn-publish');
            btn.innerHTML = `<i class="fas fa-save"></i> <span id="publish-text">Update Data</span>`;
            btn.classList.remove('bg-rasta-green');
            btn.classList.add('bg-rasta-yellow', 'text-black');

            if (type !== 'music') {
                showStatus("Mengambil konten lama...", "info");
                try {
                    const htmlRes = await fetchGitHub(`\( {type}/ \){id}/index.html`);
                    const rawHtml = base64ToStr(htmlRes.content);
                    const match = rawHtml.match(/<div class="[^"]*ql-editor[^"]*">([\s\S]*?)<\/div>\s*<\/article>/);
                    quill.root.innerHTML = match ? match[1] : "<p>Konten lama tidak dapat diekstrak.</p>";
                } catch (e) {
                    quill.root.innerHTML = "<p>Tidak dapat memuat konten lama.</p>";
                }
            }
        }

        function cancelEdit() {
            isEditMode = false;
            editId = null;
            editOriginalData = null;
            document.getElementById('edit-alert').classList.add('hidden');
            document.getElementById('input-title').value = '';
            document.getElementById('input-category').value = '';
            document.getElementById('input-excerpt').value = '';
            quill.root.innerHTML = '';
            document.getElementById('edit-img-note').classList.add('hidden');
            document.getElementById('edit-audio-note').classList.add('hidden');

            const btn = document.getElementById('btn-publish');
            btn.innerHTML = `<i class="fas fa-rocket"></i> <span id="publish-text">Publish Konten</span>`;
            btn.classList.remove('bg-rasta-yellow', 'text-black');
            btn.classList.add('bg-rasta-green', 'text-white');
        }

        // ==================== PUBLISH DATA ====================
        async function publishData() {
            const btn = document.getElementById('btn-publish');
            const originalHTML = btn.innerHTML;

            try {
                btn.disabled = true;
                btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Memproses...`;

                const title = document.getElementById('input-title').value.trim();
                const category = document.getElementById('input-category').value.trim();
                const excerpt = document.getElementById('input-excerpt').value.trim();
                const imgFile = document.getElementById('input-image').files[0];

                if (!title || !category) throw new Error("Judul dan Kategori wajib diisi!");

                const cleanId = isEditMode ? editId : title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

                let imgUrl = isEditMode ? editOriginalData.image : "/asset_gambar/default.jpg";
                if (imgFile) {
                    showStatus("Mengunggah gambar...", "info");
                    const imgBase64 = await fileToBase64(imgFile);
                    imgUrl = await uploadFile(`asset_gambar/\( {cleanId}- \){imgFile.name}`, imgBase64, `Upload image for ${title}`);
                }

                // Ambil DB terbaru
                showStatus("Memperbarui database...", "info");
                const dbRes = await fetchGitHub('database.js');
                let dbContent = base64ToStr(dbRes.content);
                let dbMatch = dbContent.match(/const sairootsDB = ([\s\S]*?);\s*\/\//);
                let dbObj = eval('(' + dbMatch[1] + ')');

                const newDataObj = { id: cleanId, title, category, image: imgUrl, excerpt };

                let newHtmlPath = "";
                let masterHtml = "";

                if (currentSubTab === 'article') {
                    const color = document.getElementById('input-color').value;
                    const date = isEditMode ? editOriginalData.date : new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                    newDataObj.color = color;
                    newDataObj.date = date;

                    if (isEditMode) {
                        const idx = dbObj.articles.findIndex(x => x.id === editId);
                        if (idx !== -1) dbObj.articles[idx] = newDataObj;
                    } else dbObj.articles.unshift(newDataObj);

                    const postContent = `<article class="max-w-4xl mx-auto">
                        <img src="${imgUrl}" class="w-full h-64 md:h-96 object-cover grayscale brightness-75 mb-8">
                        <span class="text-xs text-rasta-\( {color} font-bold uppercase tracking-widest bg-rasta- \){color}/10 py-1 px-3 mb-4 inline-block">${category}</span>
                        <h1 class="font-display text-4xl md:text-6xl text-white mb-4 uppercase">${title}</h1>
                        <div class="text-gray-400 text-sm mb-8">${date}</div>
                        <div class="text-gray-300 leading-relaxed font-light ql-editor px-0">${quill.root.innerHTML}</div>
                    </article>`;

                    masterHtml = generateHTMLTemplate(title, 'article', postContent);
                    newHtmlPath = `article/${cleanId}/index.html`;

                } else if (currentSubTab === 'lyric') {
                    if (isEditMode) {
                        const idx = dbObj.lyrics.findIndex(x => x.id === editId);
                        if (idx !== -1) dbObj.lyrics[idx] = newDataObj;
                    } else dbObj.lyrics.unshift(newDataObj);

                    const postContent = `<article class="max-w-2xl mx-auto text-center">
                        <img src="${imgUrl}" class="w-48 h-48 mx-auto object-cover grayscale brightness-75 mb-8 rounded-full border border-white/10">
                        <span class="text-xs text-rasta-red font-bold uppercase tracking-widest border border-rasta-red/20 py-0.5 px-2 mb-4 inline-block">${category}</span>
                        <h1 class="font-display text-5xl md:text-7xl text-white mb-8 uppercase">${title}</h1>
                        <div class="text-gray-300 leading-loose font-light text-lg ql-editor text-left px-0">${quill.root.innerHTML}</div>
                    </article>`;

                    masterHtml = generateHTMLTemplate(title, 'lyric', postContent);
                    newHtmlPath = `lyric/${cleanId}/index.html`;

                } else if (currentSubTab === 'music') {
                    const audioFile = document.getElementById('input-audio').files[0];
                    let audioUrl = isEditMode ? (editOriginalData.audio || "") : "";

                    if (!audioFile && !isEditMode) throw new Error("File MP3 wajib diupload untuk lagu baru!");

                    if (audioFile) {
                        showStatus("Mengunggah MP3... (bisa agak lama)", "info");
                        const audioBase64 = await fileToBase64(audioFile);
                        audioUrl = await uploadFile(`discography/${cleanId}.mp3`, audioBase64, `Upload MP3 ${title}`);
                    }
                    newDataObj.audio = audioUrl;

                    if (isEditMode) {
                        const idx = dbObj.discography.findIndex(x => x.id === editId);
                        if (idx !== -1) dbObj.discography[idx] = newDataObj;
                    } else dbObj.discography.unshift(newDataObj);
                }

                // Update database.js
                const newDbString = `// === PUSAT DATA SAI ROOTS ===\n// File ini akan di-update otomatis oleh admin_post.html\n\nconst sairootsDB = ${JSON.stringify(dbObj, null, 4)};\n\n// === DATA PENCARIAN GLOBAL (FUSE.JS) ===\nconst searchData = [\n    ...sairootsDB.articles.map(a => ({ type: "Article", title: a.title, url: \`/article/\${a.id}\`, excerpt: a.excerpt, category: a.category })),\n    ...sairootsDB.lyrics.map(l => ({ type: "Lyric", title: \`\${l.title} (Lyrics)\`, url: \`/lyric/\${l.id}\`, excerpt: l.excerpt, category: l.category })),\n    ...sairootsDB.discography.map(d => ({ type: "Discography", title: d.title, url: \`/discography/\${d.id}\`, excerpt: d.excerpt, category: d.category }))\n];`;

                await uploadFile('database.js', strToBase64(newDbString), `Update DB for ${title}`);

                if (newHtmlPath) {
                    showStatus("Menyimpan halaman HTML...", "info");
                    await uploadFile(newHtmlPath, strToBase64(masterHtml), `Generate HTML for ${title}`);
                }

                showStatus(`BERHASIL! "\( {title}" berhasil di- \){isEditMode ? 'update' : 'publish'}.`, "success");

                setTimeout(() => {
                    cancelEdit();
                    switchMainTab('manage');
                }, 2000);

            } catch (error) {
                console.error(error);
                showStatus("GAGAL: " + error.message, "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        }

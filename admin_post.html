<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="canonical" href="https://sairootsmusic.com/" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* CSS Khusus Admin Dashboard */
        .admin-main { max-width: 900px; margin: 0 auto; padding: 20px; }
        .admin-card { background: var(--card-bg); padding: 25px; border-radius: 15px; border: 1px solid #333; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--reggae-yellow); font-weight: bold; }
        input, select, textarea { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; outline: none; }
        input:focus { border-color: var(--reggae-green); }
        
        /* Editor Style ala Blogger */
        #editor-container { height: 350px; background: white; color: black; border-radius: 0 0 8px 8px; }
        .ql-toolbar { background: #ddd; border-radius: 8px 8px 0 0; }
        
        .btn-publish { background: var(--reggae-red); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-publish:hover { background: var(--reggae-green); transform: scale(1.02); }
        
        .status-msg { margin-top: 15px; padding: 10px; border-radius: 8px; display: none; text-align: center; font-weight: bold; }
        .success { background: var(--reggae-green); color: white; }
        .error { background: var(--reggae-red); color: white; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">
                <img src="https://raw.githubusercontent.com/sairootsmusic/sairootsmusic.com/refs/heads/main/android-chrome-192x192.png" alt="SAI Roots Logo">
                <span>SAI ROOTS ADMIN</span>
            </div>
            <div class="menu-toggle" id="mobile-menu">
                <i class="fas fa-bars"></i>
            </div>
        </div>

        <nav class="nav-menu" id="nav-menu">
            <div class="search-box">
                <input type="text" id="global-search" placeholder="Cari artikel, lirik, musik...">
                <button type="button" id="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <ul>
                <li><a href="index.html">LIHAT WEBSITE</a></li>
                <li><a href="article.html">ARTICLE</a></li>
                <li><a href="discography.html">DISCOGRAPHY</a></li>
                <li><a href="lyric.html">LYRIC</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="contact.html">CONTACT</a></li>
                <li><a href="privacy.html">PRIVACY POLICY</a></li>
            </ul>
        </nav>
    </header>

    <main class="admin-main">
        <div class="admin-card">
            <h2 style="color: var(--reggae-green); margin-bottom: 20px;"><i class="fas fa-edit"></i> Create New Post</h2>
            
            <div class="form-group">
                <label>Pilih Tipe Konten</label>
                <select id="post-type">
                    <option value="articles">Artikel / Berita</option>
                    <option value="music">Discography (Lagu/Album Baru)</option>
                    <option value="lyrics">Lirik Lagu</option>
                </select>
            </div>

            <div class="form-group">
                <label>Judul / Nama Lagu</label>
                <input type="text" id="post-title" placeholder="Masukkan judul postingan...">
            </div>

            <div class="form-group" id="editor-wrapper">
                <label>Isi Konten / Deskripsi / Lirik</label>
                <div id="editor-container"></div>
            </div>

            <div id="music-extra-fields" style="display:none;">
                <div class="form-group">
                    <label>Path Cover Image (Contoh: img/cover-1.jpg)</label>
                    <input type="text" id="post-cover" placeholder="Masukkan path file gambar di GitHub">
                </div>
                <div class="form-group">
                    <label>Path File Audio (Contoh: mp3/lagu-1.mp3)</label>
                    <input type="text" id="post-audio" placeholder="Masukkan path file mp3 di GitHub">
                </div>
            </div>

            <div class="form-group">
                <label>GitHub Personal Access Token</label>
                <input type="password" id="gh-token" placeholder="Tempel token GitHub lo di sini">
            </div>

            <button type="button" class="btn-publish" id="publish-btn">
                <i class="fas fa-paper-plane"></i> PUBLISH KE GITHUB
            </button>
            
            <div id="status-msg" class="status-msg"></div>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-links streaming">
                <a href="https://open.spotify.com/artist/0xOPCtZvhXVd9RTbU1aYTr" target="_blank" title="Spotify"><i class="fab fa-spotify"></i></a>
                <a href="https://music.youtube.com/channel/UC2EfMkjDMG9LTWfc1llL4AQ" target="_blank" title="YouTube Music"><i class="fab fa-youtube"></i></a>
                <a href="https://music.apple.com/id/artist/sai-roots/1892187423?l=id" target="_blank" title="Apple Music"><i class="fab fa-apple"></i></a>
                <a href="https://m.soundcloud.com/sairoots" target="_blank" title="SoundCloud"><i class="fab fa-soundcloud"></i></a>
                <a href="https://link.deezer.com/s/3366qh6efN8QoSqSPCEsB" target="_blank" title="Deezer"><i class="fab fa-deezer"></i></a>
                <a href="https://music.amazon.com/artists/B0GTFWNC32/sai-roots" target="_blank" title="Amazon Music"><i class="fab fa-amazon"></i></a>
            </div>

            <div class="footer-links socials">
                <a href="https://www.youtube.com/@sairoots" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
                <a href="https://instagram.com/ahmadsupembri" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://tiktok.com/@ahmadsupembri" target="_blank" title="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="https://facebook.com/ahmadsupembri" target="_blank" title="Facebook"><i class="fab fa-facebook"></i></a>
            </div>

            <div class="footer-bottom">
                <p>© 2026 SAI Roots Music. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="main.js"></script>
    <script src="admin.js"></script>
    <script>
        // Inisialisasi Editor ala Blogger
        var quill = new Quill('#editor-container', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, false] }],
                    ['bold', 'italic', 'underline'],
                    ['image', 'link', 'video'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['clean']
                ]
            }
        });

        // Logika munculin input tambahan kalau pilih tipe 'music'
        document.getElementById('post-type').addEventListener('change', function() {
            const musicFields = document.getElementById('music-extra-fields');
            if (this.value === 'music') {
                musicFields.style.display = 'block';
            } else {
                musicFields.style.display = 'none';
            }
        });
    </script>
</body>
</html>

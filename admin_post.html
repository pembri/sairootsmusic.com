<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SAI Roots</title>
    <link rel="canonical" href="https://sairootsmusic.com/" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-main { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .admin-card { background: var(--card-bg); padding: 25px; border-radius: 15px; border: 1px solid #333; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        label { color: var(--reggae-yellow); font-weight: bold; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: white; border-radius: 5px; }
        #editor-container { height: 300px; background: white; color: black; border-radius: 0 0 5px 5px; }
        .btn-action { padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 10px; background: var(--reggae-red); color: white; }
        .btn-action:hover { background: var(--reggae-green); }
        .post-list-item { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--reggae-yellow); }
        .post-actions button { background: none; border: none; cursor: pointer; margin-left: 10px; font-size: 1.2rem; }
        .status-msg { margin-top: 10px; text-align: center; display: none; padding: 10px; border-radius: 5px; font-weight: bold; }
        .success { background: var(--reggae-green); color: white; }
        .error { background: var(--reggae-red); color: white; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo"><span>SAI ROOTS ADMIN</span></div>
        </div>
    </header>

    <main class="admin-main">
        <div class="admin-card">
            <h2 id="form-title" style="color:var(--reggae-green)">Post Konten Baru</h2>
            <input type="hidden" id="edit-id">
            
            <div class="form-group">
                <label>Tipe Konten</label>
                <select id="post-type">
                    <option value="articles">Article</option>
                    <option value="music">Music / Discography</option>
                    <option value="lyrics">Lyrics</option>
                </select>
            </div>

            <div class="form-group">
                <label>Judul</label>
                <input type="text" id="post-title" placeholder="Masukkan Judul...">
            </div>

            <div class="form-group">
                <label>File Path Gambar (img/nama-file.jpg)</label>
                <input type="text" id="post-image" placeholder="Contoh: img/cover-lagu.jpg">
            </div>

            <div class="form-group" id="audio-group" style="display:none;">
                <label>File Path MP3 (mp3/nama-file.mp3)</label>
                <input type="text" id="post-audio" placeholder="Contoh: mp3/lagu-reggae.mp3">
            </div>

            <div class="form-group">
                <label>Isi / Lirik / Deskripsi</label>
                <div id="editor-container"></div>
            </div>

            <div class="form-group">
                <label>GitHub Personal Access Token (PAT)</label>
                <input type="password" id="gh-token" placeholder="Masukkan Token GitHub lo">
            </div>

            <button class="btn-action" id="publish-btn">PUBLISH KE GITHUB</button>
            <div id="status-msg" class="status-msg"></div>
        </div>

        <div class="admin-card">
            <h2 style="color:var(--reggae-yellow)">Kelola Postingan</h2>
            <div id="manage-list">Sedang memuat data dari repo pembri...</div>
        </div>
    </main>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="admin.js"></script>
    <script>
        // Inisialisasi Editor
        var quill = new Quill('#editor-container', { 
            theme: 'snow',
            modules: { toolbar: [[{'header': [1, 2, false]}], ['bold', 'italic'], ['link', 'image'], [{'list': 'ordered'}, {'list': 'bullet'}]] }
        });

        // Toggle field audio
        document.getElementById('post-type').addEventListener('change', function() {
            document.getElementById('audio-group').style.display = (this.value === 'music') ? 'block' : 'none';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discography | SAI Roots</title>
    
    <meta name="description" content="Official discography of SAI Roots - Roots Reggae, Ska, & Reggae Rap musician.">
    <meta property="og:title" content="SAI Roots - Discography">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rasta: { green: '#2D8659', yellow: '#FBBF24', red: '#DC2626' },
                        neutral: { 950: '#050505' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Anton', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #050505; color: #f0f0f0; }
        .glass { background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.03); }
        .rasta-stripe { height: 3px; background: linear-gradient(90deg, #2D8659 0%, #FBBF24 50%, #DC2626 100%); width: 100%; position: fixed; top: 0; z-index: 60; }
        #mobile-menu { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; }
        .menu-open { transform: translateX(0) !important; }
        
        /* Custom Audio Player Style */
        input[type='range'] { overflow: hidden; appearance: none; background-color: rgba(255,255,255,0.1); }
        input[type='range']::-webkit-slider-runnable-track { height: 4px; appearance: none; color: #FBBF24; }
        input[type='range']::-webkit-slider-thumb { width: 0; appearance: none; height: 0; box-shadow: -100vw 0 0 100vw #FBBF24; }
    </style>
</head>
<body class="overflow-x-hidden pt-1">

    <div class="rasta-stripe"></div>

    <header class="fixed top-[3px] w-full z-50 glass">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-3xl font-display uppercase tracking-wider">
                <a href="/" class="flex items-center gap-3 hover:text-rasta-yellow transition-colors duration-300">
                    <img src="https://raw.githubusercontent.com/sairootsmusic/sairootsmusic.com/refs/heads/main/android-chrome-192x192.png" 
                         alt="Logo SAI Roots" class="w-10 h-10 rounded-full object-cover border border-white/10">
                    <span>SAI <span class="text-rasta-green">Roots</span></span>
                </a>
            </div>

            <button id="menu-btn" class="focus:outline-none z-50 p-2 rounded-full hover:bg-white/5 transition">
                <svg id="hamburger-icon" class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>      
        </div>
    </header>

    <div id="mobile-menu" class="fixed inset-0 z-40 bg-neutral-950 translate-x-full flex flex-col items-center pt-28 pb-12 p-6 border-l border-white/5">
        <div class="w-full max-w-md relative mb-8 shrink-0">
            <input type="text" id="search-input" placeholder="Cari artikel, lirik, atau lagu..." 
                   class="w-full bg-white/5 border border-white/10 rounded-none py-4 px-6 focus:outline-none focus:border-rasta-yellow transition-all text-white text-lg">
            <span class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-500">⏎</span>
        </div>

        <div id="search-results" class="w-full max-w-md flex-1 overflow-y-auto hidden"></div>

        <nav id="main-nav" class="flex flex-col space-y-6 text-center uppercase tracking-widest w-full max-w-md">
            <a href="/" class="text-3xl font-display hover:text-rasta-green transition duration-300">Home</a>
            <a href="/discography" class="text-3xl font-display hover:text-rasta-yellow transition duration-300">Discography</a>
            <a href="/lyric" class="text-3xl font-display hover:text-rasta-red transition duration-300">Lyric</a>
            <a href="/about" class="hover:text-rasta-green transition duration-300 text-base font-sans mt-4">About</a>
            <a href="/privacy" class="hover:text-rasta-yellow transition duration-300 text-base font-sans">Privacy Policy</a>
            <a href="/contact" class="hover:text-rasta-red transition duration-300 text-base font-sans">Contact Us</a>
        </nav>
    </div>

    <main class="pt-32 pb-20 container mx-auto px-6 min-h-[70vh]">
        <div class="flex flex-col items-center justify-center mb-16 text-center">
            <h1 class="font-display text-5xl md:text-7xl mb-4 tracking-tight uppercase leading-none text-white">
                Official <span class="text-rasta-yellow">Discography</span>
            </h1>
            <p class="text-gray-400 max-w-xl text-sm md:text-base font-light">
                Perjalanan nada dari Jombang untuk dunia. Dengarkan karya-karya terbaru SAI Roots.
            </p>
        </div>

        <div id="global-player" class="fixed bottom-0 left-0 w-full bg-neutral-950/95 border-t border-white/10 p-4 z-[100] transform translate-y-full transition-transform duration-500 backdrop-blur-md">
            <div class="container mx-auto flex items-center gap-4">
                <img id="player-img" src="" class="w-12 h-12 rounded object-cover border border-white/10 hidden md:block">
                <div class="flex-1 min-w-0">
                    <h4 id="player-title" class="text-white text-sm font-bold truncate">Judul Lagu</h4>
                    <p id="player-cat" class="text-rasta-yellow text-[10px] uppercase tracking-widest">Category</p>
                </div>
                <div class="flex items-center gap-4">
                    <button id="play-pause-btn" class="text-white hover:text-rasta-yellow transition">
                        <i class="fas fa-play text-xl"></i>
                    </button>
                    <div class="hidden sm:flex flex-col w-32 md:w-64">
                        <input type="range" id="seek-bar" value="0" class="w-full h-1">
                    </div>
                </div>
            </div>
            <audio id="main-audio-element"></audio>
        </div>

        <div id="disco-list" class="flex flex-col space-y-4 max-w-4xl mx-auto">
            </div>
    </main>

    <footer id="footer" class="border-t border-white/5 py-12 bg-black">
        <div class="container mx-auto px-6 text-center">
            <p class="text-gray-600 text-[10px] tracking-[0.3em] uppercase mb-6">Stream Our Music</p>
            <div class="flex flex-wrap justify-center gap-7 mb-10 text-gray-400">
                <a href="https://www.youtube.com/@sairoots" target="_blank" class="hover:text-[#ff0000]"><i class="fab fa-youtube text-2xl"></i></a>
                <a href="https://open.spotify.com/artist/0xOPCtZvhXVd9RTbU1aYTr" target="_blank" class="hover:text-[#1DB954]"><i class="fab fa-spotify text-2xl"></i></a>
                <a href="https://music.apple.com/id/artist/sai-roots/1892187423?l=id" target="_blank" class="hover:text-white"><i class="fab fa-apple text-2xl"></i></a>
                <a href="https://m.soundcloud.com/sairoots" target="_blank" class="hover:text-[#ff5500]"><i class="fab fa-soundcloud text-2xl"></i></a>
                <a href="https://link.deezer.com/s/3366qh6efN8QoSqSPCEsB" target="_blank" class="hover:text-white"><i class="fab fa-deezer text-2xl"></i></a>
                <a href="https://music.amazon.com/artists/B0GTFWNC32/sai-roots" target="_blank" class="hover:text-[#00a8e1]"><i class="fab fa-amazon text-2xl"></i></a>
            </div>
            <div class="flex justify-center space-x-8 mb-10 text-gray-500">
                <a href="https://instagram.com/ahmadsupembri" target="_blank" class="hover:text-white"><i class="fab fa-instagram text-xl"></i></a>
                <a href="https://tiktok.com/@ahmadsupembri" target="_blank" class="hover:text-white"><i class="fab fa-tiktok text-xl"></i></a>
                <a href="https://facebook.com/ahmadsupembri" target="_blank" class="hover:text-[#1877F2]"><i class="fab fa-facebook-f text-xl"></i></a>
            </div>
            <div class="border-t border-white/5 pt-8">
                <p class="text-gray-600 text-[11px] tracking-[0.2em] uppercase">© 2026 <span class="text-white font-medium">SAI Roots Music</span>. All Rights Reserved.</p>
                <p class="text-gray-800 text-[9px] mt-2 tracking-[0.4em] uppercase italic">Roots • Reggae • Rap</p>
            </div>
        </div>
    </footer>

    <script src="./database.js"></script>

    <script>
        // ================= UI & HAMBURGER (MUTLAK SAMA) =================
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const hamburgerIcon = document.getElementById('hamburger-icon');
        const searchInput = document.getElementById('search-input');

        function toggleMenu() {
            const isOpen = mobileMenu.classList.toggle('menu-open');
            if (isOpen) {
                hamburgerIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>`;
                hamburgerIcon.classList.add('text-rasta-yellow');
                document.body.style.overflow = 'hidden';
            } else {
                hamburgerIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>`;
                hamburgerIcon.classList.remove('text-rasta-yellow');
                document.body.style.overflow = 'auto';
                searchInput.value = '';
                document.getElementById('search-results').classList.add('hidden');
                document.getElementById('main-nav').classList.remove('hidden');
            }
        }

        menuBtn.addEventListener('click', toggleMenu);
        searchInput.addEventListener('click', e => e.stopPropagation());

        // ================= AUDIO PLAYER LOGIC =================
        const audio = document.getElementById('main-audio-element');
        const globalPlayer = document.getElementById('global-player');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const seekBar = document.getElementById('seek-bar');

        function playTrack(url, title, cat, img) {
            if (audio.src.includes(url) && !audio.paused) {
                audio.pause();
                playPauseBtn.innerHTML = '<i class="fas fa-play text-xl"></i>';
            } else {
                audio.src = url;
                audio.play();
                globalPlayer.classList.remove('translate-y-full');
                document.getElementById('player-title').innerText = title;
                document.getElementById('player-cat').innerText = cat;
                document.getElementById('player-img').src = img;
                playPauseBtn.innerHTML = '<i class="fas fa-pause text-xl"></i>';
            }
        }

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playPauseBtn.innerHTML = '<i class="fas fa-pause text-xl"></i>';
            } else {
                audio.pause();
                playPauseBtn.innerHTML = '<i class="fas fa-play text-xl"></i>';
            }
        });

        audio.ontimeupdate = () => {
            if (audio.duration) {
                seekBar.value = (audio.currentTime / audio.duration) * 100;
            }
        };

        seekBar.oninput = () => {
            audio.currentTime = (seekBar.value / 100) * audio.duration;
        };

        // ================= LOGIKA DATA & PENCARIAN =================
        try {
            const fuse = new Fuse(searchData, { 
                keys: ['title', 'excerpt', 'category', 'type'], 
                threshold: 0.3 
            });

            function renderDiscography() {
                const list = document.getElementById('disco-list');
                if(!list) return;
                list.innerHTML = '';

                sairootsDB.discography.forEach(track => {
                    const html = `
                        <div class="group bg-white/5 border border-white/5 hover:bg-white/10 transition-all p-4 flex items-center justify-between">
                            <div class="flex items-center gap-6 min-w-0">
                                <div class="relative w-16 h-16 shrink-0 group-hover:scale-105 transition-transform duration-300">
                                    <img src="${track.image}" class="w-full h-full object-cover grayscale brightness-75">
                                    <button onclick="playTrack('${track.audio}', '${track.title}', '${track.category}', '${track.image}')" 
                                            class="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <i class="fas fa-play text-white text-lg"></i>
                                    </button>
                                </div>
                                <div class="min-w-0">
                                    <span class="text-[10px] text-rasta-yellow font-bold uppercase tracking-widest">${track.category}</span>
                                    <h3 class="text-xl font-display text-white truncate">${track.title}</h3>
                                    <p class="text-xs text-gray-500 line-clamp-1">${track.excerpt}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-4">
                                <a href="${track.audio}" download class="text-gray-500 hover:text-white transition p-2">
                                    <i class="fas fa-download"></i>
                                </a>
                            </div>
                        </div>
                    `;
                    list.innerHTML += html;
                });
            }

            function showSearchResults(query) {
                const container = document.getElementById('search-results');
                const nav = document.getElementById('main-nav');
                
                if (query.length < 2) {
                    container.classList.add('hidden');
                    nav.classList.remove('hidden');
                    return;
                }

                const results = fuse.search(query);
                nav.classList.add('hidden');
                container.classList.remove('hidden');
                container.innerHTML = '';

                if (results.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-10">
                            <p class="text-gray-400 text-lg">Tidak ada hasil untuk "<span class="text-white">${query}</span>"</p>
                            <p class="text-gray-600 text-sm mt-2">Coba kata kunci lain.</p>
                        </div>`;
                    return;
                }

                let html = '<div class="flex flex-col space-y-3 w-full pb-6">';
                results.forEach(result => {
                    const item = result.item;
                    let colorClass = 'text-gray-400 border-gray-400';
                    if (item.type === 'Article') colorClass = 'text-rasta-green border-rasta-green';
                    else if (item.type === 'Discography') colorClass = 'text-rasta-yellow border-rasta-yellow';
                    else if (item.type === 'Lyric') colorClass = 'text-rasta-red border-rasta-red';

                    html += `
                        <a href="${item.url}" class="block bg-white/5 border border-white/10 p-4 hover:bg-white/10 hover:border-white/30 transition-all text-left">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-[10px] uppercase tracking-widest px-2 py-0.5 border ${colorClass}">${item.type}</span>
                                <span class="text-xs text-gray-500">${item.category}</span>
                            </div>
                            <h4 class="text-xl font-display text-white mb-1 tracking-wide">${item.title}</h4>
                            <p class="text-sm text-gray-400 line-clamp-2 font-light">${item.excerpt}</p>
                        </a>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            }

            searchInput.addEventListener('input', (e) => showSearchResults(e.target.value.trim()));

            window.addEventListener('load', () => {
                renderDiscography();
            });

        } catch (error) {
            console.warn("Menunggu database.js...", error);
        }
    </script>
</body>
</html>

    <style>
        .disco-container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
        .disco-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; margin-top: 30px; }
        
        /* Album Card Style */
        .album-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid #222; transition: 0.3s; }
        .album-card:hover { transform: translateY(-10px); border-color: var(--reggae-green); }
        .album-cover { width: 100%; aspect-ratio: 1/1; background-size: cover; background-position: center; position: relative; }
        .play-btn-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; cursor: pointer; }
        .album-card:hover .play-btn-overlay { opacity: 1; }
        .play-btn-overlay i { font-size: 4rem; color: var(--reggae-yellow); }
        .album-info { padding: 15px; }
        .album-info h3 { font-size: 1.1rem; margin-bottom: 5px; color: var(--text-main); }
        .album-info p { color: var(--text-muted); font-size: 0.9rem; }

        /* Music Player Bar (Sticky di Bawah) */
        .music-player-bar { position: fixed; bottom: -100px; left: 0; width: 100%; background: #111; border-top: 3px solid var(--reggae-green); padding: 15px 5%; display: flex; align-items: center; justify-content: space-between; z-index: 1000; transition: 0.5s ease-in-out; }
        .music-player-bar.active-player { bottom: 0; }
        .player-info { display: flex; align-items: center; gap: 15px; }
        .player-info i { color: var(--reggae-yellow); font-size: 1.5rem; }
        .player-controls audio { height: 35px; filter: invert(1); }
        .close-player { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">
                <img src="https://raw.githubusercontent.com/sairootsmusic/sairootsmusic.com/refs/heads/main/android-chrome-192x192.png" alt="SAI Roots Logo">
                <span>SAI ROOTS</span>
            </div>
            <div class="menu-toggle" id="mobile-menu"><i class="fas fa-bars"></i></div>
        </div>

            <ul>

    <main class="disco-container">
        <h2 style="border-left: 5px solid var(--reggae-red); padding-left: 15px;">DISCOGRAPHY</h2>

            <div class="loading">Memuat katalog musik...</div>
        </div>
    </main>

    <div class="music-player-bar" id="music-player">
        <div class="player-info">
            <i class="fas fa-compact-disc fa-spin"></i>
            <span id="now-playing-title">Pilih Lagu...</span>
        </div>
        <div class="player-controls">
            <audio id="main-audio" controls></audio>
        </div>
        <button class="close-player" onclick="closePlayer()"><i class="fas fa-times"></i></button>
    </div>

    <footer>

    <script>
        function closePlayer() {
            const player = document.getElementById('music-player');
            const audio = document.getElementById('main-audio');
            audio.pause();
            player.classList.remove('active-player');
        }
